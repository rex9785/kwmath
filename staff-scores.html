<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>성적 · 이관우 수학연구소</title>
<!--
  2026-07-29 · 조교 성적 화면을 /admin-scores 하나로 합침.

  왜 합쳤나 —
    이 파일은 /admin-scores 의 옛 복사본이었다(같은 함수 29개가 두 벌). 그래서 원장 화면에만
    ① 반 평균  ② 일일·주간·월말 테스트 탭  ③ 학생 식별을 이름이 아닌 student_id로 하는 것
    세 가지가 들어가고, 조교 화면은 그대로 뒤처져 있었다. 조교야말로 "우리 반이 지금 어느 정도인가"를
    가장 자주 봐야 하는 사람인데 그걸 못 봤다.

  /admin-scores 를 조교가 그냥 써도 되는 이유 —
    이 화면이 부르는 API는 /api/students(GET)·/api/scores(GET·POST·DELETE) 셋뿐이고,
    셋 다 서버가 X-Staff-Phone(검증된 조교 신원)으로 담당 학원만 남긴다.
    (_middleware.js: /api/scores 는 STAFF_WRITE_ALLOW 에 있고, scores.js 의 ?scope=class 는
     담당 학원이 아니면 403.)  즉 조교가 남의 학원 성적을 보거나 넣을 길이 없다.
    원장 전용 기능은 이 화면에 애초에 없다.

  이 파일을 지우지 않고 남겨 둔 이유 — 조교 폰에 /staff-scores 로 저장된 바로가기·북마크가 살아 있다.
  주소를 그대로 눌러도 끊기지 않게 넘겨준다. 쿼리(?sid=&acad=&cls=)도 같이 넘긴다.
-->
<meta http-equiv="refresh" content="0; url=/admin-scores">
<style>
  body{ margin:0; font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
        background:#FAF7F7; color:#777; display:flex; align-items:center; justify-content:center;
        min-height:100vh; font-size:0.9rem; }
</style>
</head>
<body>
<div>성적 화면으로 이동 중…</div>
<script>
  // replace = 뒤로가기를 눌렀을 때 이 빈 페이지로 되돌아와 다시 튕기는 무한루프를 막는다.
  location.replace('/admin-scores' + (location.search || ''));
</script>
</body>
</html>
