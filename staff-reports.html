<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>리포트·테스트 확인 · 이관우 수학연구소</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;600;700;900&display=swap');
  :root{ --primary:#862633; --primary-light:#F9ECED; --ink:#241318; --muted:#8A7B75; --border:#E9E1D9; --bg:#F7F5F2; --ok:#1F7A33; --ok-light:#E5F5E8; --warn:#B07A00; --warn-light:#FFF7E0;  --hairline:#F1EAE2; --primary-mid:#A83040; --serif:'Noto Serif KR',serif;}
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap{ max-width:780px; margin:0 auto; padding:max(18px,env(safe-area-inset-top,18px)) 16px 60px; }
  .top{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:4px; }
  h1{ font-size:1.3rem; margin:6px 0 2px; }
  .sub{ color:var(--muted); font-size:0.82rem; margin-bottom:14px; }
  .back{ color:var(--primary); text-decoration:none; font-size:0.84rem; font-weight:700; background:none; border:none; cursor:pointer; font-family:inherit; }
  .nav{ display:flex; gap:8px; margin-bottom:13px; flex-wrap:wrap; }
  .nav a{ flex:1; min-width:110px; text-align:center; text-decoration:none; background:#fff; border:1.5px solid var(--border); border-radius:10px; padding:9px 10px; font-weight:700; font-size:0.82rem; color:var(--ink); }
  .nav a.cur{ border-color:var(--primary); background:var(--primary-light); color:var(--primary); }
  .bar{ display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .bar input[type=date]{ padding:8px 10px; border:1.5px solid var(--border); border-radius:9px; font-size:0.88rem; font-family:inherit; outline:none; background:#fff; }
  .bar input[type=date]:focus{ border-color:var(--primary); }
  .search{ flex:1; min-width:140px; padding:8px 12px; border:1.5px solid var(--border); border-radius:9px; font-size:0.9rem; font-family:inherit; outline:none; }
  .search:focus{ border-color:var(--primary); }
  .sumbox{ background:#fff; border:1px solid var(--border); border-radius:13px; padding:12px 15px; margin-bottom:12px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .sumbox .s{ font-size:0.86rem; font-weight:700; } .sumbox .s b{ color:var(--primary); }
  .copybtn{ margin-left:auto; background:var(--primary); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:0.8rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .copybtn:hover{ opacity:0.92; }
  .hint{ font-size:0.74rem; color:var(--muted); width:100%; }
  .clshead{ font-weight:800; font-size:0.95rem; margin:16px 2px 8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .clshead .cnt{ font-size:0.74rem; font-weight:700; color:var(--muted); }
  .card{ background:#fff; border:1px solid var(--border); border-radius:13px; padding:12px 15px; margin-bottom:8px; }
  .row{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .nm{ font-weight:800; font-size:0.96rem; }
  .meta{ font-size:0.74rem; color:var(--muted); }
  .badge{ display:inline-block; font-size:0.72rem; font-weight:700; padding:3px 10px; border-radius:10px; white-space:nowrap; }
  .b-ok{ background:var(--ok-light); color:var(--ok); }
  .b-no{ background:var(--warn-light); color:var(--warn); }
  .b-none{ background:#F2EDEE; color:#999; }
  button.mini{ margin-left:auto; background:#fff; color:var(--muted); border:1px solid var(--border); border-radius:7px; padding:5px 11px; font-size:0.76rem; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; }
  button.mini:hover{ border-color:var(--primary); color:var(--primary); }
  .detail{ display:none; margin-top:10px; border-top:1px dashed var(--border); padding-top:10px; }
  .detail.show{ display:block; }
  .rep{ background:var(--bg); border-radius:9px; padding:10px 12px; margin-bottom:7px; font-size:0.83rem; }
  .rep .rd{ font-weight:800; color:var(--primary); font-size:0.8rem; margin-bottom:4px; }
  .rep .rk{ color:var(--muted); font-size:0.72rem; display:block; margin-top:6px; }
  .rep .rv{ white-space:pre-wrap; line-height:1.55; }
  .file{ display:flex; align-items:center; gap:8px; font-size:0.82rem; padding:6px 2px; }
  .file a{ color:var(--primary); font-weight:700; text-decoration:none; cursor:pointer; }
  .file .fm{ color:var(--muted); font-size:0.72rem; }
  .msg{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:30px 18px; text-align:center; color:var(--muted); }
  .toast{ position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(30,30,30,0.92); color:#fff; padding:11px 18px; border-radius:9px; font-size:0.84rem; font-weight:600; z-index:100; display:none; }
  .toast.show{ display:block; }
  /* 상단 통합 네비 (홈 + 메뉴 드롭다운) */
  .kwnav{ display:flex; align-items:center; gap:8px; }
  .kwnav-home{ display:inline-flex; align-items:center; gap:5px; background:var(--primary); color:#fff; font-weight:800; font-size:0.84rem; text-decoration:none; padding:8px 13px; border-radius:9px; font-family:inherit; white-space:nowrap; line-height:1; }
  .kwnav-mw{ position:relative; }
  .kwnav-toggle{ display:inline-flex; align-items:center; gap:5px; background:#fff; color:var(--primary); border:1.5px solid var(--primary); font-weight:800; font-size:0.84rem; padding:6px 13px; border-radius:9px; cursor:pointer; font-family:inherit; white-space:nowrap; line-height:1.25; }
  .kwnav-pop{ position:absolute; right:0; top:calc(100% + 6px); background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,0.16); padding:6px; min-width:196px; z-index:200; display:none; }
  .kwnav-pop.show{ display:block; }
  .kwnav-pop a{ display:block; text-decoration:none; color:var(--ink); font-weight:700; font-size:0.86rem; padding:9px 12px; border-radius:8px; white-space:nowrap; }
  .kwnav-pop a:hover{ background:var(--primary-light); }
  .kwnav-pop a.cur{ background:var(--primary-light); color:var(--primary); cursor:default; }
  .kwnav-pop a.kwnav-logout{ color:var(--muted); border-top:1px solid var(--border); margin-top:4px; }
  .kwnav-pop a.kwnav-logout:hover{ background:#FBE6E6; color:#b3261e; }
  .kwnav--light .kwnav-home{ background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.28); color:#fff; }
  .kwnav--light .kwnav-toggle{ background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.28); color:#fff; }

  /* ══════════════════════════════════════════════════════════════════
     2026-08-04 조교 콘솔 정렬 (디자인가이드_조교관리자.md)
     기능이 한눈에 · 바로 처리. 기존 규칙은 남기고 여기서만 덮어쓴다(CSS 전용).
     ══════════════════════════════════════════════════════════════════ */
  body{ font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
        letter-spacing:-0.01em; background:var(--bg); word-break:keep-all; overflow-wrap:break-word; }
  .wrap{ max-width:880px; padding:0 16px 60px; }

  /* 상단 고정 바 — 제목·부제·네비를 와인 바에 모으고 스크롤해도 남긴다 */
  .top{ display:flex; align-items:center; gap:12px; flex-wrap:nowrap;
        background:var(--primary); color:#fff; position:sticky; top:0; z-index:30;
        margin:0 -16px 18px; padding:max(12px,env(safe-area-inset-top,12px)) 16px 11px; }
  .top > div:first-child{ min-width:0; display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
  h1{ font-size:1rem; font-weight:800; margin:0; color:#fff; letter-spacing:-0.02em;
      display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  h1 svg{ opacity:.85; }
  .sub{ font-size:0.76rem; color:rgba(255,255,255,0.66); margin:0 !important; font-weight:500; }
  .top .kwnav{ margin-left:auto; flex:0 0 auto; }
  .top .kwnav-home{ background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28); color:#fff; padding:7px 12px; }
  .top .kwnav-toggle{ background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28); color:#fff; padding:6px 12px; }
  .top .kwnav-home:hover, .top .kwnav-toggle:hover{ background:rgba(255,255,255,0.24); }
  .top .back{ margin-left:auto; color:#fff; background:rgba(255,255,255,0.14);
              border:1px solid rgba(255,255,255,0.28); border-radius:9px; padding:7px 12px; }

  /* 카드·면 — 그림자 줄이고 헤어라인으로 */
  .card, .batch, .msg, .box, .sec-card{ border-color:var(--border) !important; box-shadow:0 1px 3px rgba(70,20,35,.04) !important; }
  .msg{ padding:34px 18px; }

  /* 숫자는 세리프 — 처리해야 할 개수가 가장 먼저 보이게 */
  .count b, .sc .g, .pill, .bdg, .n{ font-family:var(--serif); }
  .count{ font-size:0.95rem; }

  /* 입력 — 터치 타깃 44px · 포커스 와인 링 */
  input, select, textarea{ font-family:inherit; }
  .search, .aidate, .aihw, .aih, .aim, .bp-ctrl select, .bp-ctrl input,
  input[type=text], input[type=date], input[type=number], input[type=month], select, textarea{
    border:1.5px solid var(--border); border-radius:10px; outline:none;
    transition:border-color .12s, box-shadow .12s; }
  .search{ min-height:42px; padding:9px 13px; }
  .search:focus, .aidate:focus, .aihw:focus, .aih:focus, .aim:focus,
  input[type=text]:focus, input[type=date]:focus, input[type=number]:focus, input[type=month]:focus,
  select:focus, textarea:focus{ border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }

  /* 버튼 — 상태 버튼은 눌린 게 확실히 보이게 */
  .aibtn, .bp-b, .bp-mode, .mini, .aisave, .bp-save, .bp-all{ border-radius:9px; font-family:inherit; }
  .aibtn, .bp-b{ min-height:36px; }
  .aibtn.on, .bp-b.on, .bp-mode.on{ box-shadow:0 1px 4px rgba(134,38,51,.22); }
  .aisave, .bp-save{ min-height:42px; font-weight:800; }
  .mini{ display:inline-flex; align-items:center; gap:6px; min-height:34px; }
  .bp-save, .aisave{ display:inline-flex; align-items:center; justify-content:center; gap:7px; }
  .bp-all{ display:inline-flex; align-items:center; gap:6px; }

  /* 라벨·섹션 */
  .ailabel{ display:flex; align-items:center; gap:6px; }
  .bp-head{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .attwrap, .cliwrap{ border-style:solid !important; background:#FFFCFC !important; border-radius:12px !important; }
  .cliwrap{ background:#FAFDFD !important; }


  /* 아이콘이 들어간 라벨·배지 정렬 */
  .sechead, .paynote, .rd, .file, .sumline, .copybtn, .ghost{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .badge{ display:inline-flex !important; align-items:center; gap:5px; }
  .file a{ flex:1; min-width:0; }
  .hint{ display:flex; align-items:flex-start; gap:7px; }

  /* 상단 바 — 제목/부제 2줄로 고정(부제가 제목을 밀지 않게) */
  .top > div:first-child{ flex-direction:column; align-items:flex-start; gap:2px; }
  h1{ white-space:nowrap; }
  .sub{ line-height:1.4; }
  /* 상태 버튼·이름은 줄바꿈 금지 */
  .bp-b, .aibtn, .pill, .badge, .cls, .mini{ white-space:nowrap; }
  .bp-nm{ flex:0 0 92px; width:92px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bp-st{ gap:6px; }
  .count{ white-space:nowrap; }
  .chead{ gap:7px; }
  .nm{ white-space:nowrap; }
  .meta{ white-space:nowrap; }

  /* 텍스트 라벨은 flex로 만들지 않는다 — 문장이 조각나 gap이 끼어든다. 아이콘은 vertical-align으로 정렬됨 */
  .sechead, .paynote, .rd, .file, .sumline, .bp-head, .ailabel, .hint{ display:block !important; }
  .file a{ flex:none; }
  /* 상단 바 — 부제는 한 줄로 잘라 바 높이를 흔들지 않게 */
  .top{ align-items:center; }
  .top > div:first-child{ flex:1 1 auto; min-width:0; }
  .sub{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

  /* 버튼은 inline-flex + 줄바꿈 금지 (아이콘과 라벨이 한 줄에) */
  .copybtn, .ghost, .mini, .aisave, .bp-save, .bp-all, .listbtn{
    display:inline-flex !important; align-items:center; justify-content:center; gap:6px;
    flex-wrap:nowrap !important; white-space:nowrap; }
  .bp-save{ flex:1; }
  .sumbox .s, .clshead{ white-space:nowrap; }

  /* ── 반응형 (반드시 마지막) — 위 블록들과 동일 특이도라 소스 순서로 이겨야 한다 ── */
  @media (max-width:640px){
    .top{ flex-wrap:wrap; gap:8px 10px; align-items:flex-start; }
    .top > div:first-child{ flex:1 1 100%; }
    .top .kwnav{ margin-left:0; }
    /* 좁은 화면에선 안내 문구를 자르지 않고 접는다 (바는 이미 2줄이므로 높이 손해 없음) */
    .sub{ white-space:normal; overflow:visible; text-overflow:clip; }
  }
</style>
<!-- 🔄 2026-07-29 원장·조교 로그인 유지(슬라이딩 갱신) 수신부 -->

<div class="wrap">
  <div class="top">
    <div><h1><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><rect x="9" y="2.5" width="6" height="4" rx="1"></rect><rect x="4.5" y="4.5" width="15" height="17" rx="2"></rect><path d="M8.5 11h7M8.5 15h5"></path></svg>리포트·테스트 확인</h1><div class="sub">선택한 날짜에 수업 리포트·테스트 결과가 올라왔는지 확인해요 · 안 올라온 학생은 원장님께 보고</div></div>

<script>
  var token = sessionStorage.getItem('kwmath_admin_pw') || localStorage.getItem('kwmath_admin_pw') || localStorage.getItem('kwmath_admin_token') || null;
  if (!token) location.href = '/portal';
  var students = [], reportsByName = {}, filesByName = {}, filesLoaded = false;
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function showToast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},2400); }
  function logout(){ sessionStorage.removeItem('kwmath_admin_pw'); localStorage.removeItem('kwmath_admin_pw'); location.href='/portal'; }
  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function localYmd(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return ''; return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function mdLabel(ymd){ if(!ymd) return ''; var p=ymd.split('-'); return p.length===3 ? (Number(p[1])+'/'+Number(p[2])) : ymd; }

  async function api(path, opts){
    opts = opts || {}; opts.headers = opts.headers || {};
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    opts.credentials = 'same-origin';
    var r = await fetch(path, opts);
    if (r.status === 401){ logout(); throw new Error('401'); }
    return r;
  }

  async function loadAll(){
    $('dateSel').value = todayStr();
    try {
      var rs = await api('/api/students');
      var all = await rs.json();
      if (!rs.ok) throw new Error(all.error || '학생 목록 실패');
      students = (Array.isArray(all) ? all : []).filter(function(s){
        return s.approvalStatus !== '대기중' && s.approvalStatus !== '거부';
      });
      var rr = await api('/api/reports');
      var rd = await rr.json();
      if (!rr.ok) throw new Error(rd.error || '리포트 실패');
      reportsByName = {};
      (rd.reports || []).forEach(function(r){
        if (!reportsByName[r.studentName]) reportsByName[r.studentName] = [];
        reportsByName[r.studentName].push(r);
      });
      render();
      loadFiles();   // 테스트 결과 파일은 뒤에서 채움 (학생 수만큼 조회)
    } catch(e) {
      $('content').innerHTML = '<div class="msg">불러오지 못했어요: '+esc(e.message)+'</div>';
    }
  }

  async function loadFiles(){
    var names = students.map(function(s){ return s.name; }).filter(Boolean);
    var i = 0;
    async function worker(){
      while (i < names.length) {
        var name = names[i++];
        try {
          var r = await api('/api/list-files?folder=' + encodeURIComponent('test-results/' + name));
          var d = await r.json();
          filesByName[name] = (r.ok && Array.isArray(d)) ? d : [];
        } catch(e) { filesByName[name] = []; }
      }
    }
    var workers = []; for (var w = 0; w < 5; w++) workers.push(worker());
    await Promise.all(workers);
    filesLoaded = true;
    render();
  }

  function stat(s, day){
    var reps = reportsByName[s.name] || [];
    var repToday = reps.filter(function(r){ return (r.date||'').slice(0,10) === day; });
    var lastRep = reps.length ? (reps[0].date||'').slice(0,10) : '';
    var files = filesByName[s.name] || [];
    var fToday = files.filter(function(f){ return localYmd(f.lastModified) === day; });
    var lastFile = '';
    files.forEach(function(f){ var d = localYmd(f.lastModified); if (d > lastFile) lastFile = d; });
    return { repToday:repToday, lastRep:lastRep, fToday:fToday, lastFile:lastFile, reps:reps, files:files };
  }

  function render(){
    var day = $('dateSel').value || todayStr();
    var q = ($('search').value || '').trim();
    var list = students.filter(function(s){ return !q || (s.name||'').indexOf(q)>=0 || (s.className||'').indexOf(q)>=0; });
    if (!students.length){ $('content').innerHTML = '<div class="msg">담당 학원에 학생이 없어요.</div>'; return; }

    var byCls = {};
    list.forEach(function(s){ var c = s.className || '반 미지정'; (byCls[c] = byCls[c] || []).push(s); });

    var repOk = 0, testOk = 0;
    students.forEach(function(s){ var t = stat(s, day); if (t.repToday.length) repOk++; if (t.fToday.length) testOk++; });
    $('sumbox').style.display = 'flex';
    $('sumRep').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><rect x="9" y="2.5" width="6" height="4" rx="1"></rect><rect x="4.5" y="4.5" width="15" height="17" rx="2"></rect><path d="M8.5 11h7M8.5 15h5"></path></svg>리포트 <b>' + repOk + '</b>/' + students.length + '명';
    $('sumTest').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M6 20V12"></path><path d="M12 20V5"></path><path d="M18 20V9"></path></svg>테스트 결과 ' + (filesLoaded ? ('<b>' + testOk + '</b>/' + students.length + '명') : '확인 중…');

    var html = '';
    Object.keys(byCls).sort().forEach(function(cls){
      var arr = byCls[cls];
      var cRep = 0, cTest = 0;
      arr.forEach(function(s){ var t = stat(s, day); if (t.repToday.length) cRep++; if (t.fToday.length) cTest++; });
      html += '<div class="clshead">' + esc(cls) + ' <span class="cnt">리포트 ' + cRep + '/' + arr.length + (filesLoaded ? ' · 테스트 ' + cTest + '/' + arr.length : '') + '</span></div>';
      arr.forEach(function(s){
        var t = stat(s, day);
        var repBadge = t.repToday.length
          ? '<span class="badge b-ok"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><rect x="9" y="2.5" width="6" height="4" rx="1"></rect><rect x="4.5" y="4.5" width="15" height="17" rx="2"></rect><path d="M8.5 11h7M8.5 15h5"></path></svg>리포트 ✓</span>'
          : (t.lastRep ? '<span class="badge b-no"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><rect x="9" y="2.5" width="6" height="4" rx="1"></rect><rect x="4.5" y="4.5" width="15" height="17" rx="2"></rect><path d="M8.5 11h7M8.5 15h5"></path></svg>리포트 없음 · 최근 ' + mdLabel(t.lastRep) + '</span>' : '<span class="badge b-none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><rect x="9" y="2.5" width="6" height="4" rx="1"></rect><rect x="4.5" y="4.5" width="15" height="17" rx="2"></rect><path d="M8.5 11h7M8.5 15h5"></path></svg>리포트 기록 없음</span>');
        var testBadge = !filesLoaded
          ? '<span class="badge b-none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M6 20V12"></path><path d="M12 20V5"></path><path d="M18 20V9"></path></svg>확인 중…</span>'
          : (t.fToday.length
            ? '<span class="badge b-ok"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M6 20V12"></path><path d="M12 20V5"></path><path d="M18 20V9"></path></svg>테스트 ✓ ' + t.fToday.length + '개</span>'
            : (t.lastFile ? '<span class="badge b-no"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M6 20V12"></path><path d="M12 20V5"></path><path d="M18 20V9"></path></svg>테스트 없음 · 최근 ' + mdLabel(t.lastFile) + '</span>' : '<span class="badge b-none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M6 20V12"></path><path d="M12 20V5"></path><path d="M18 20V9"></path></svg>테스트 기록 없음</span>'));
        html += '<div class="card">' +
          '<div class="row"><span class="nm">' + esc(s.name) + '</span>' + repBadge + testBadge +
          '<button class="mini" onclick="toggleDetail(this,\'' + esc(s.name).replace(/'/g,'&#39;') + '\')">내용 보기</button></div>' +
          '<div class="detail" data-name="' + esc(s.name) + '"></div>' +
        '</div>';
      });
    });
    $('content').innerHTML = html || '<div class="msg">검색 결과가 없어요.</div>';
  }

  function toggleDetail(btn, name){
    var box = btn.parentNode.parentNode.querySelector('.detail');
    if (box.classList.contains('show')){ box.classList.remove('show'); btn.textContent = '내용 보기'; return; }
    var reps = (reportsByName[name] || []).slice(0, 5);
    var files = (filesByName[name] || []).slice().sort(function(a,b){ return new Date(b.lastModified) - new Date(a.lastModified); }).slice(0, 5);
    var h = '';
    if (reps.length){
      h += reps.map(function(r){
        return '<div class="rep"><div class="rd"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><rect x="9" y="2.5" width="6" height="4" rx="1"></rect><rect x="4.5" y="4.5" width="15" height="17" rx="2"></rect><path d="M8.5 11h7M8.5 15h5"></path></svg>' + esc((r.date||'').slice(0,10)) + ' 수업 리포트</div>' +
          (r.content ? '<span class="rk">수업 내용</span><div class="rv">' + esc(r.content) + '</div>' : '') +
          (r.homework ? '<span class="rk">숙제</span><div class="rv">' + esc(r.homework) + '</div>' : '') +
          (r.notes ? '<span class="rk">메모</span><div class="rv">' + esc(r.notes) + '</div>' : '') +
        '</div>';
      }).join('');
    } else { h += '<div class="rep">아직 수업 리포트가 없어요.</div>'; }
    if (files.length){
      h += files.map(function(f, idx){
        return '<div class="file"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M6 20V12"></path><path d="M12 20V5"></path><path d="M18 20V9"></path></svg><a onclick="openFile(\'' + esc(f.key).replace(/'/g,'&#39;') + '\')">' + esc(f.displayName) + '</a><span class="fm">' + mdLabel(localYmd(f.lastModified)) + ' · ' + esc(f.sizeLabel||'') + '</span></div>';
      }).join('');
    }
    box.innerHTML = h;
    box.classList.add('show');
    btn.textContent = '접기';
  }

  async function openFile(key){
    try {
      showToast('파일 여는 중…');
      var r = await api('/api/download-file?key=' + encodeURIComponent(key));
      if (!r.ok) { showToast('파일을 열 수 없어요'); return; }
      var blob = await r.blob();
      window.open(URL.createObjectURL(blob), '_blank');
    } catch(e) { showToast('파일을 열 수 없어요'); }
  }

  function copyReport(){
    var day = $('dateSel').value || todayStr();
    var noRep = [], noTest = [];
    var byCls = {};
    students.forEach(function(s){ var c = s.className || '반 미지정'; (byCls[c] = byCls[c] || []).push(s); });
    Object.keys(byCls).sort().forEach(function(cls){
      var a = [], b = [];
      byCls[cls].forEach(function(s){
        var t = stat(s, day);
        if (!t.repToday.length) a.push(s.name);
        if (filesLoaded && !t.fToday.length) b.push(s.name);
      });
      if (a.length) noRep.push(cls + ': ' + a.join(', '));
      if (b.length) noTest.push(cls + ': ' + b.join(', '));
    });
    var msg = '[' + mdLabel(day) + ' 업로드 확인]\n';
    msg += noRep.length ? ('📋 리포트 안 올라온 학생\n- ' + noRep.join('\n- ') + '\n') : '📋 리포트: 전원 업로드 완료 ✓\n';
    if (filesLoaded) msg += noTest.length ? ('📊 테스트 결과 안 올라온 학생\n- ' + noTest.join('\n- ')) : '📊 테스트 결과: 전원 업로드 완료 ✓';
    msg += '\n(수업 없던 반은 지우고 보냅니다)';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msg).then(function(){ showToast('복사됐어요 — 원장님께 붙여넣어 보내세요'); }, function(){ showToast('복사 실패'); });
    } else { showToast('복사를 지원하지 않는 브라우저예요'); }
  }

  loadAll();
</script>
<!-- 조교/원장 공통 상단 네비: 홈(역할별) + 메뉴 드롭다운 -->
<script>
(function(){
  try{
    var pw = sessionStorage.getItem('kwmath_admin_pw') || localStorage.getItem('kwmath_admin_pw') || '';
    var home = /^ast_/.test(pw) ? '/staff-home' : '/admin';
    var h = document.getElementById('kwnavHome'); if(h){ h.setAttribute('href', home); }
    var tt = document.getElementById('kwnavTitleHome'); if(tt){ tt.setAttribute('href', home); }
    var path = (location.pathname || '').replace(/\.html$/,''); if(path.length > 1){ path = path.replace(/\/+$/,''); }
    var pop = document.getElementById('kwnavPop');
    if(pop){
      var links = pop.querySelectorAll('a[data-p]');
      for(var i=0;i<links.length;i++){
        if(links[i].getAttribute('data-p') === path){ links[i].className = 'cur'; links[i].removeAttribute('href'); }
      }
    }
    var tog = document.getElementById('kwnavToggle');
    if(tog && pop){
      tog.addEventListener('click', function(e){
        e.stopPropagation();
        var open = pop.classList.toggle('show');
        tog.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', function(ev){
        if(!pop.contains(ev.target) && ev.target !== tog){ pop.classList.remove('show'); tog.setAttribute('aria-expanded','false'); }
      });
    }
    var lo = document.getElementById('kwnavLogout');
    if(lo){
      lo.addEventListener('click', function(e){
        e.preventDefault();
        try{ sessionStorage.removeItem('kwmath_admin_pw'); localStorage.removeItem('kwmath_admin_pw'); localStorage.removeItem('kwmath_admin_token'); }catch(_){}
        location.href = '/portal';
      });
    }
  }catch(_){}
})();
</script>
