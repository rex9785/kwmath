            h.textContent='분수·루트는 오른쪽 키패드 버튼, 또는 3/4·sqrt(2)·x^2처럼 입력 · 고치면 다시 채점돼요';
            host.appendChild(h);
          }
          function toMath(){
            if(!(window.customElements && customElements.get('math-field'))){ toast('수식 키패드 준비 중 — 잠시 후 다시 눌러 주세요'); return; }
            host.innerHTML='';
            var row=document.createElement('div'); row.style.cssText='display:flex;gap:6px;align-items:stretch;';
            var mf=document.createElement('math-field'); mf.className='ansEdit'; mf.setAttribute('data-qid',qid); mf.setAttribute('math-virtual-keyboard-policy','onfocus'); mf.style.flex='1';
            try{ mf.value=cur; }catch(e){}
            mf.addEventListener('input', function(){ cur=mf.value; });
            mf.addEventListener('focusin', function(){ setTimeout(kbShow,60); });
            mf.addEventListener('pointerup', function(){ try{ mf.focus(); }catch(e){} setTimeout(kbShow,150); });
            row.appendChild(mf); row.appendChild(mkBtn('일반','일반 키보드로 입력',toText)); host.appendChild(row);
            var h=document.createElement('div'); h.className='sub'; h.style.cssText='font-size:0.72rem;margin:4px 0 0;';
            h.textContent='칸을 누르면 수학 키패드 · 형태가 달라도(2/4=1/2) 값 같으면 정답 · 고치면 다시 채점돼요';
            host.appendChild(h);
          }
          if(atype==='math' || /\\/.test(cur)) toMath(); else toText();
        })(host);
      });
      sc.querySelectorAll('[data-toggle]').forEach(function(el){
        el.addEventListener('click', function(){
          var rid = parseInt(el.dataset.toggle,10);
          var ix = _openResp.indexOf(rid);
          if(ix>=0) _openResp.splice(ix,1); else _openResp.push(rid);
          var y = window.scrollY;
          renderResults(survey, _allResp);
          window.scrollTo(0, y);
        });
      });
      // ── ✏️ 답 수정 시작/취소/저장 · 🔄 재제출 허용(응답 삭제) ──
      sc.querySelectorAll('[data-editstart]').forEach(function(b){
        b.addEventListener('click', function(ev){
          ev.stopPropagation();
          _editResp = parseInt(b.dataset.editstart,10);
          var y = window.scrollY; renderResults(survey, _allResp); window.scrollTo(0, y);
        });
      });
      sc.querySelectorAll('[data-editcancel]').forEach(function(b){
        b.addEventListener('click', function(ev){
          ev.stopPropagation(); _editResp = null;
          var y = window.scrollY; renderResults(survey, _allResp); window.scrollTo(0, y);
        });
      });
      sc.querySelectorAll('[data-editsave]').forEach(function(b){
        b.addEventListener('click', function(ev){
          ev.stopPropagation();
          var rid = parseInt(b.dataset.editsave,10);
          var r = null; responses.forEach(function(x){ if(x.id===rid) r = x; });
          var wrap = sc.querySelector('[data-editwrap="' + rid + '"]');
          if(!r || !wrap) return;
          var patch = {};
          wrap.querySelectorAll('.ansEdit').forEach(function(el){ patch[el.dataset.qid] = el.value; });
          var multi = {};   // 체크박스(복수선택)는 qid별 배열로
          wrap.querySelectorAll('.ansEditM').forEach(function(c){
            var qid = c.dataset.qid;
            if(!multi[qid]) multi[qid] = [];
            if(c.checked) multi[qid].push(c.value);
          });
          Object.keys(multi).forEach(function(qid){ patch[qid] = multi[qid]; });
          b.disabled = true; b.textContent = '저장 중…';
          api('PATCH', '?id=' + survey.id + '&editAnswers=1', { responseId: rid, answers: patch })
            .then(function(x){ return x.json(); }).then(function(d){
              if(!d || !d.ok){ toast((d && d.error) || '저장 실패'); b.disabled = false; b.textContent = '저장'; return; }
              r.answers = d.answers || r.answers; r.score = d.score; r.maxScore = d.maxScore; r.manual = d.manual || {};
              _editResp = null;
              toast('답을 수정했어요' + (survey.quiz ? ' — 재채점 완료' : ''));
              var y = window.scrollY; renderResults(survey, _allResp); window.scrollTo(0, y);
            }).catch(function(){ toast('저장 실패'); b.disabled = false; b.textContent = '저장'; });
        });
      });
      sc.querySelectorAll('[data-resub]').forEach(function(b){
        b.addEventListener('click', function(ev){
          ev.stopPropagation();
          var rid = parseInt(b.dataset.resub,10);
          // 반 필터가 걸려 있으면 responses 는 걸러낸 사본이다 — 지우는 건 반드시 전체 목록(_allResp) 쪽이어야 한다.
          var r = null, idx = -1; _allResp.forEach(function(x,i){ if(x.id===rid){ r = x; idx = i; } });
          if(!r) return;
          var who = survey.anonymous ? '이 응답' : ('"' + (r.respondentName || '이름 없음') + '" 응답');
          var msg = who + '을 삭제할까요?\n\n· 답안·점수가 지워지고, 그 학생이 처음부터 다시 제출할 수 있게 돼요.'
            + (survey.testKind ? '\n· 성적표에 반영된 이 테스트 점수도 함께 지워져요.' : '')
            + '\n· 되돌릴 수 없어요.';
          if(!confirm(msg)) return;
          api('DELETE', '?id=' + survey.id + '&responseId=' + rid)
            .then(function(x){ return x.json(); }).then(function(d){
              if(!d || !d.ok){ toast((d && d.error) || '삭제 실패'); return; }
              _allResp.splice(idx, 1);
              var ix = _openResp.indexOf(rid); if(ix >= 0) _openResp.splice(ix, 1);
              if(_editResp === rid) _editResp = null;
              toast('응답을 삭제했어요 — 학생이 다시 제출할 수 있어요');
              var y = window.scrollY; renderResults(survey, _allResp); window.scrollTo(0, y);
            }).catch(function(){ toast('삭제 실패'); });
        });
      });
      attachOx(sc);
    }

    // 개인별 응답 블록(비익명 전용) — 선택형·척도에서 "누가 뭘 골랐는지" 접이식 표시
    function perPersonBlock(q, valFn){
      if(survey.anonymous) return '';
      var rows = [];
      responses.forEach(function(r){
        var v = valFn(r.answers[q.id]);
        if(v!=null && v!=='') rows.push({ who: esc(r.respondentName||'(이름없음)'), val: esc(String(v)) });
      });
      if(!rows.length) return '';
      var s = '<details style="margin-top:8px;"><summary style="cursor:pointer;font-size:0.82rem;color:var(--primary);font-weight:700;">개인별 응답 (' + rows.length + '명) ▾</summary><div style="margin-top:6px;">';
      rows.forEach(function(x){ s += '<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 2px;border-bottom:1px solid #f0e6e9;font-size:0.85rem;"><span>' + x.who + '</span><span><b>' + x.val + '</b></span></div>'; });
      s += '</div></details>';
      return s;
    }

    qs.forEach(function(q){
      var box = document.createElement('div'); box.className = 'qres';
      var isCorrectOpt = function(o){
        if(!survey.quiz || q.correct==null) return false;
        return Array.isArray(q.correct) ? (q.correct.indexOf(o)>=0) : (q.correct===o);
      };
      var ptsTxt = (survey.quiz && q.points!=null) ? (' <span class="sub">(' + q.points + '점)</span>') : '';
      var h = '<h4>' + esc(q.label) + ptsTxt + '</h4>';
      if(q.type==='single'||q.type==='multi'||q.type==='dropdown'){
        var counts = {}; (q.options||[]).forEach(function(o){ counts[o]=0; });
        responses.forEach(function(r){
          var a = r.answers[q.id];
          if(Array.isArray(a)) a.forEach(function(x){ if(x in counts) counts[x]++; });
          else if(a && (a in counts)) counts[a]++;
        });
        (q.options||[]).forEach(function(o){
          var n = counts[o]||0; var pct = responses.length ? Math.round(n/responses.length*100) : 0;
          var mk = isCorrectOpt(o) ? ' <span class="ok">✔ 정답</span>' : '';
          h += '<div class="bar"><div class="lbl"><span>' + esc(o) + mk + '</span><span>' + n + '명 (' + pct + '%)</span></div>' +
               '<div class="track"><div class="fill" style="width:' + pct + '%;"></div></div></div>';
        });
        // 테스트: 정답률 표시 / 개인별 응답 접이식은 일반 설문에서만 (테스트는 응답자별 점수에서 펼침)
        if(survey.quiz && q.correct!=null){
          // 정답률 분모 = 전체 응시 인원(responses.length). 미제출(무응답)도 오답으로 포함 (2026-07-29 관우T).
          var okC = 0, totC = responses.length;
          responses.forEach(function(r){ if(isRight(q, r.answers[q.id])===true) okC++; });
          h += '<div class="rsummary" style="margin-top:6px;">정답률 <b>' + (totC?Math.round(okC/totC*100):0) + '%</b> (' + okC + '/' + totC + '명)</div>';
        }
        if(!survey.quiz) h += perPersonBlock(q, function(a){ return Array.isArray(a) ? a.join(', ') : a; });
      } else if(survey.quiz && q.type==='short' && q.correct!=null){
        // 단답형(테스트): 답이 제각각이라 나열하지 않고 정답률만 — 개별 답안은 응답자별 점수에서
        var okS = 0, totS = responses.length;   // 분모=전체 응시 인원, 미제출=오답 (2026-07-29 관우T)
        responses.forEach(function(r){ if(isRight(q, r.answers[q.id])===true) okS++; });
        h += '<div class="rsummary">정답: <b>' + esc(q.correct) + '</b> · 정답률 <b>' + (totS?Math.round(okS/totS*100):0) + '%</b> (' + okS + '/' + totS + '명)</div>';
        h += '<div class="sub">개별 답안은 위 "응답자별 점수"에서 이름을 누르면 보여요.</div>';
      } else if(survey.quiz && q.type==='math' && q.correct!=null){
        // 수식(테스트): 형태가 달라도 수학적으로 같으면 정답 — 정답률만, 개별 답안은 응답자별 점수에서
        var okM = 0, totM = responses.length;   // 분모=전체 응시 인원, 미제출=오답 (2026-07-29 관우T)
        responses.forEach(function(r){ if(isRight(q, r.answers[q.id])===true) okM++; });
        h += '<div class="rsummary">정답: <b>' + fmtMathA(q.correct) + '</b> · 정답률 <b>' + (totM?Math.round(okM/totM*100):0) + '%</b> (' + okM + '/' + totM + '명)</div>';
        h += '<div class="sub">형태가 달라도 수학적으로 같으면 정답으로 채점돼요. 개별 답안은 위 "응답자별 점수"에서 이름을 누르면 보여요.</div>';
      } else if(survey.quiz && q.type==='long' && q.points!=null){
        // 서술형(테스트): 여기선 채점 현황 요약만 — 채점은 맨 위 "✍️ 채점 대기"에서
        var oN=0, xN=0, pN=0;
        responses.forEach(function(r){ var m=(r.manual||{})[q.id]; if(m===1) oN++; else if(m===0) xN++; else pN++; });
        h += '<div class="rsummary">서술형 · 배점 <b>' + q.points + '점</b> — <span class="ok">O ' + oN + '</span> · <span class="no">X ' + xN + '</span> · <span style="color:#B26A00;font-weight:700;">채점 대기 ' + pN + '</span></div>';
        h += '<div class="sub">채점은 맨 위 "✍️ 채점 대기"에서, 개별 답안은 "응답자별 점수"에서 이름을 눌러 보세요.</div>';
      } else if(q.type==='scale'){
        var sum=0, cnt=0, dist={};
        for(var v=q.scaleMin; v<=q.scaleMax; v++) dist[v]=0;
        responses.forEach(function(r){ var a=parseInt(r.answers[q.id],10); if(Number.isFinite(a)){ sum+=a; cnt++; if(a in dist) dist[a]++; } });
        var avg = cnt ? (sum/cnt).toFixed(2) : '-';
        h += '<div class="rsummary">평균 <b>' + avg + '</b> / ' + q.scaleMax + ' (' + cnt + '명 응답)</div>';
        for(var v2=q.scaleMin; v2<=q.scaleMax; v2++){
          var n2 = dist[v2]||0; var pct2 = cnt ? Math.round(n2/cnt*100) : 0;
          h += '<div class="bar"><div class="lbl"><span>' + v2 + '점</span><span>' + n2 + '명</span></div>' +
               '<div class="track"><div class="fill" style="width:' + pct2 + '%;"></div></div></div>';
        }
        if(!survey.quiz) h += perPersonBlock(q, function(a){ var n=parseInt(a,10); return Number.isFinite(n) ? (n + '점') : ''; });
      } else {
        var any = false;
        responses.forEach(function(r){
          var a = r.answers[q.id];
          if(a && String(a).trim()){
            any = true;
            var who = survey.anonymous ? '' : (r.respondentName || '');
            h += '<div class="textans">' + (who?'<span class="who">' + esc(who) + '</span>':'') + esc(a) + '</div>';
          }
        });
        if(!any) h += '<div class="sub">응답 없음</div>';
      }
      box.innerHTML = h;
      viewEl.appendChild(box);

      attachOx(box);   // (문항 블록엔 이제 O·X 버튼이 없지만, 혹시 남아있어도 동작하게)
    });
  }

  function csvCell(v){
    var s = (v==null?'':String(v));
    if(Array.isArray(v)) s = v.join(' | ');
    if(/[",\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  // clsLabel: 반을 골라 둔 상태면 그 반 이름 — 내려받은 파일이 어느 반 것인지 이름만 보고 알게(2026-08-14).
  function downloadCsv(survey, responses, clsLabel){
    var qs = survey.questions || [];
    var header = ['시각'];
    if(!survey.anonymous) header.push('이름');
    if(survey.quiz) header.push('점수');
    qs.forEach(function(q){ header.push(q.label); });
    var lines = [ header.map(csvCell).join(',') ];
    responses.forEach(function(r){
      var row = [ fmt(r.createdAt) ];
      if(!survey.anonymous) row.push(r.respondentName || '');
      if(survey.quiz) row.push((typeof r.score==='number') ? (r.score + (typeof r.maxScore==='number'?('/'+r.maxScore):'')) : '');
      qs.forEach(function(q){ row.push(r.answers[q.id]); });
      lines.push(row.map(csvCell).join(','));
    });
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = ((survey.title||'survey') + (clsLabel ? ('_' + clsLabel) : '')).replace(/[\\/:*?"<>|]/g,'_') + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  // ─────────────── 이벤트 ───────────────
  if(isStaff){
    newBtn.textContent = '+ 새 테스트';   // 조교: 테스트 전용
    var sn = document.getElementById('staffNav'); if(sn) sn.style.display = 'flex';   // 조교 콘솔 네비 노출
  } else {
    var ab = document.getElementById('adminBack'); if(ab) ab.classList.remove('hidden');   // 원장: 관리자 홈으로 돌아가기
  }
  newBtn.addEventListener('click', startNew);
  backBtn.addEventListener('click', function(){ draft = null; loadList(); });
  // ───────── 🛡️ 2026-08-04 유령클릭 차단 · 아이폰·갤럭시 공통 (surveys.html 과 같은 사고의 관리자쪽 판) ─────────
  //  MathLive 수식 키패드는 position:fixed 로 화면 아래를 덮고, 열릴 때 body 에 padding-bottom(≈300px)을 준다.
  //  그래서 sticky 하단바(.builderBar)가 키패드 '맨 아랫줄' 바로 밑에 겹쳐 깔린다. 모바일 브라우저는 터치가 끝나는
  //  시점의 좌표로 click 을 다시 쏘므로, 정답을 수식으로 넣다가 키패드가 닫히는 순간 그 자리의 「취소」·「저장」이 눌린다.
  //  📱 iOS 전용 문제가 아니다 — 관우T가 갤럭시에서도 확인. 「안드로이드엔 불필요」로 걷어내지 말 것.
  //  「취소」가 눌리면 만들던 설문·테스트가 통째로 날아간다 → 반드시 막아야 한다.
  //   ① 무장(arm): 그 버튼 위에서 눌리기 시작한 클릭만 받는다(유령클릭엔 pointerdown 이 없다).
  //   ② 잠금(kbLock): 키패드가 떠 있는 동안 + 닫힌 뒤 0.7초까지 하단바를 안 보이게·안 눌리게 한다.
  //      MathLive 이벤트 대신 0.2초 폴링 — 이벤트가 안 오는 기기에서 하단바가 영영 숨는 사고를 막기 위해서다.
  //  🚫 지우면 사고 재발. 학생쪽 같은 코드는 surveys.html 하단에 있다.
  var kbArmedEl = null;
  document.addEventListener('pointerdown', function(ev){ kbArmedEl = ev.target; }, true);
  function guardedClick(btn, fn){
    btn.addEventListener('click', function(ev){
      if(ev.detail === 0){ fn(); return; }                                  // 키보드 Enter·보조기기
      var ok = !!(kbArmedEl && (kbArmedEl === btn || btn.contains(kbArmedEl)));
      if(!ok || builderBar.classList.contains('kbLock')){ ev.preventDefault(); return; }
      kbArmedEl = null;
      fn();
    });
  }
  guardedClick(document.getElementById('cancelBuild'), function(){ draft = null; loadList(); });
  guardedClick(document.getElementById('saveBuild'), saveBuilder);
  (function(){
    var wasOpen = false, unlockAt = 0;
    function kbOpenNow(){
      try{
        var mvk = window.mathVirtualKeyboard;
        if(!mvk) return false;
        if(typeof mvk.visible === 'boolean') return mvk.visible;
        return !!(mvk.boundingRect && mvk.boundingRect.height > 0);
      }catch(e){ return false; }
    }
    setInterval(function(){
      var now = Date.now();
      if(kbOpenNow()){ wasOpen = true; unlockAt = 0; kbArmedEl = null; builderBar.classList.add('kbLock'); return; }
      if(wasOpen){ wasOpen = false; unlockAt = now + 700; }
      if(unlockAt && now < unlockAt){ kbArmedEl = null; builderBar.classList.add('kbLock'); return; }
      unlockAt = 0;
      builderBar.classList.remove('kbLock');
    }, 200);
  })();

  // ?acad=&cls=&new=1 로 넘어왔으면 그 반을 대상으로 새 테스트 빌더를 바로 연다.
  if(PRESET.isNew && PRESET.acad) startNew();
  else loadList();
})();
</script>
<!-- 조교/원장 공통 상단 네비: 홈(역할별) + 메뉴 드롭다운 -->
<script>
(function(){
  try{
    var pw = sessionStorage.getItem('kwmath_admin_pw') || localStorage.getItem('kwmath_admin_pw') || '';
    var home = /^ast_/.test(pw) ? '/staff-home' : '/admin';
    var h = document.getElementById('kwnavHome'); if(h){ h.setAttribute('href', home); }
    var tt = document.getElementById('kwnavTitleHome'); if(tt){ tt.setAttribute('href', home); }
    var path = (location.pathname || '').replace(/\.html$/,''); if(path.length > 1){ path = path.replace(/\/+$/,''); }
    var pop = document.getElementById('kwnavPop');
    if(pop){
      var links = pop.querySelectorAll('a[data-p]');
      for(var i=0;i<links.length;i++){
        if(links[i].getAttribute('data-p') === path){ links[i].className = 'cur'; links[i].removeAttribute('href'); }
      }
    }
    var tog = document.getElementById('kwnavToggle');
    if(tog && pop){
      tog.addEventListener('click', function(e){
        e.stopPropagation();
        var open = pop.classList.toggle('show');
        tog.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', function(ev){
        if(!pop.contains(ev.target) && ev.target !== tog){ pop.classList.remove('show'); tog.setAttribute('aria-expanded','false'); }
      });
    }
    var lo = document.getElementById('kwnavLogout');
    if(lo){
      lo.addEventListener('click', function(e){
        e.preventDefault();
        try{ sessionStorage.removeItem('kwmath_admin_pw'); localStorage.removeItem('kwmath_admin_pw'); localStorage.removeItem('kwmath_admin_token'); }catch(_){}
        location.href = '/portal';
      });
    }
  }catch(_){}
})();
</script>
