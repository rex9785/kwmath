<!-- 수식(math) 문제유형 입력용 — MathLive 웹컴포넌트. 로드 실패해도 나머지 빌더는 정상 동작.
     버전 고정(@0.110.0): 미고정 +esm은 최신판이 조용히 바뀌며 기기별(특히 iOS) 회귀를 만들 수 있어 고정. -->
<script type="module">
  try {
    await import('https://cdn.jsdelivr.net/npm/mathlive@0.110.0/+esm');
    // 커스텀 간소 키패드: 분수·√·ⁿ√·xⁿ·행렬만 (적분·삼각·그리스문자 제외)
    if (window.mathVirtualKeyboard) {
      window.mathVirtualKeyboard.layouts = {
        label: '수식', tooltip: '분수·루트·행렬',
        rows: [
          ['[7]','[8]','[9]',{class:'small',latex:'\\frac{#@}{#?}'},{latex:'\\sqrt{#0}'},{class:'small',latex:'\\sqrt[#?]{#?}'},{label:'[backspace]',width:1.5}],
          ['[4]','[5]','[6]',{label:'x<sup>n</sup>',latex:'#@^{#?}'},'[(]','[)]','\\times'],
          ['[1]','[2]','[3]','+','-',{class:'small',latex:'\\begin{pmatrix}#?&#?\\\\#?&#?\\end{pmatrix}'}],
          [{label:'[0]',width:1.5},'[.]','[left]','[right]',{label:'[hide-keyboard]',width:1.5}]
        ]
      };
    }
  }
  catch (e) { console.warn('[admin-surveys] MathLive 로드 실패:', e); }
</script>

<script>
(function(){
  var token = sessionStorage.getItem('kwmath_admin_pw')
           || localStorage.getItem('kwmath_admin_pw')
           || localStorage.getItem('kwmath_admin_token')
           || null;
  // 조교(ast_) 세션이면 '테스트 전용' 모드 — 목록은 서버가 테스트만 내려주고, 새 항목은 테스트 강제.
  var isStaff = /^ast_/.test(token || '');

  var viewEl = document.getElementById('view');
  var toastEl = document.getElementById('toast');
  var backBtn = document.getElementById('backBtn');
  var newBtn = document.getElementById('newBtn');
  var hTitle = document.getElementById('hTitle');
  var builderBar = document.getElementById('builderBar');
  var toastT = null;

  // ox·multi는 빌더 전용 표시 처리 — ox 저장은 single+['O','X']. 객관식은 드롭다운 한 항목('객관식')으로 통합하고
  // '복수 응답 허용' 토글로 single↔multi 전환. 내부 저장 type은 그대로 single/multi → 서버·학생화면 무수정.
  // 단답·수식 통합(2026-07-24 관우T): 문항 유형에서 '수식'을 없애고 '단답' 하나로. 수식은 단답 정답칸의
  //   키패드 버튼으로 입력(선택). 옛 저장 'math' 문항은 type을 그대로 두되 dispType로 '단답'처럼 표시 →
  //   서버 math 채점 분기는 무변경(하위호환). 새 문항은 전부 short로 저장·채점(텍스트일치 또는 수식동치).
  var QTYPE_LABEL = { single:'객관식', ox:'OX형(참/거짓)', short:'단답', long:'장문', scale:'척도', dropdown:'드롭다운' };
  function isOXQuestion(q){
    return q.type==='single' && Array.isArray(q.options) && q.options.length===2 && q.options[0]==='O' && q.options[1]==='X';
  }
  var AUD_LABEL = { all:'전체', student:'학생', parent:'학부모' };

  var draft = null;   // 빌더 편집 중인 설문 { id?, title, description, audience, anonymous, status, questions:[] }
  var _qseq = 0;      // 문항 고유 id 시퀀스 — 일괄 생성 시 Date.now() 충돌 방지

  function toast(m){
    toastEl.textContent = m; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function esc(s){ var d = document.createElement('div'); d.textContent = (s==null?'':String(s)); return d.innerHTML; }
  function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmt(iso){
    if(!iso) return '';
    try{ return new Date(iso).toLocaleString('ko-KR',{ timeZone:'Asia/Seoul', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
    catch(e){ return iso; }
  }
  function api(method, qs, body){
    var opts = { method:method, headers:{} };
    if(token) opts.headers['Authorization'] = 'Bearer ' + token;
    if(body){ opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    return fetch('/api/surveys' + (qs||''), opts);
  }
  function needLogin(){
    viewEl.innerHTML = '<div class="state">원장 전용 페이지예요.<br>먼저 <a href="/admin">관리자 로그인</a> 후 다시 열어주세요.</div>';
  }
  function setMode(mode){
    // mode: list | build | results
    // 제목 표기 — 목록처럼 둘이 섞이는 자리는 '테스트·설문' 고정, 한 건을 열고 있을 땐 그 건의 성격대로 부른다.
    //   조교는 테스트만 다루므로(설문 탭 잠금) 그대로 '테스트'.
    if(mode === 'list'){ hTitle.textContent = isStaff ? '테스트' : '테스트·설문'; backBtn.classList.add('hidden'); newBtn.classList.remove('hidden'); builderBar.classList.add('hidden'); }
    if(mode === 'build'){ var 무엇 = (isStaff || (draft && draft.quiz)) ? '테스트' : '설문'; hTitle.textContent = (draft && draft.id) ? (무엇 + ' 수정') : ('새 ' + 무엇); backBtn.classList.remove('hidden'); newBtn.classList.add('hidden'); builderBar.classList.remove('hidden'); }
    if(mode === 'results'){ hTitle.textContent = isStaff ? '테스트 결과' : '결과 보기'; backBtn.classList.remove('hidden'); newBtn.classList.add('hidden'); builderBar.classList.add('hidden'); }
  }

  // ─────────────── 목록 ───────────────
  function loadList(){
    setMode('list');
    if(!token){ needLogin(); return; }
    viewEl.innerHTML = '<div class="state">불러오는 중…</div>';
    api('GET', '?admin=1').then(function(r){
      if(r.status === 401 || r.status === 403){ needLogin(); return null; }
      return r.json();
    }).then(function(data){
      if(!data) return;
      if(!data.ok){ viewEl.innerHTML = '<div class="state">' + esc(data.error || '불러오지 못했어요.') + '</div>'; return; }
      renderList(data.surveys || []);
    }).catch(function(){
      viewEl.innerHTML = '<div class="state">네트워크 오류로 불러오지 못했어요.</div>';
    });
  }

  // ── 목록을 반별로 묶는다 (2026-08-14 관우T: "반별로 묶어줘 드롭다운식으로") ──
  //   묶는 기준은 응답자가 아니라 **그 테스트의 대상 반**(audClass, "학원|반" 형식 · 2026-07-16 규칙).
  //   대상 반이 여럿이거나 아예 없는 항목은 어느 반 칸에 넣어도 거짓이 되므로 따로 모아 맨 끝에 둔다.
  var GRP_MULTI = 'multi', GRP_NONE = 'none';
  /* ⚠️ 아래는 편집 도구가 문자열 안에 제어문자(U+0001·U+0002)를 흘려 넣은 흔적이다. 값은 바로 위에서 다시 정했으니
     동작에는 영향이 없다. 이 주석 줄은 통째로 지워도 된다 — 제어문자가 섞여 있어 자동 치환으로는 못 지운다: 'multi', GRP_NONE = 'none'; */
  function listGroupKey(s){
    var cs = (s.audClass || []).filter(function(c){ return !!c; });
    if(cs.length !== 1) return cs.length > 1 ? GRP_MULTI : GRP_NONE;
    var k = cs[0];
    // ⚠️ 2026-07-16 규칙 이전에 만든 항목은 반 이름만 있고 「학원|」이 없다(실측: id 7 「썸머 공통수학2반」, 2026-07-14).
    //    그대로 두면 같은 반이 「세정학원 › 썸머 공통수학2반」과 「썸머 공통수학2반」 두 줄로 갈라진다.
    //    그 항목이 스스로 들고 있는 audAcademy가 딱 하나면 그걸 붙여 한 줄로 모은다(추측이 아니라 그 항목의 값이다).
    //    학원이 없거나 둘 이상이면 어느 학원인지 단정할 수 없으므로 이름 그대로 따로 둔다.
    if(k.indexOf('|') < 0){
      var ac = (s.audAcademy || []).filter(function(a){ return !!a; });
      if(ac.length === 1) return ac[0] + '|' + k;
    }
    return k;
  }
  function listGroupLabel(k){
    if(k === GRP_MULTI) return '여러 반';
    if(k === GRP_NONE) return '반 지정 없음';
    var i = k.indexOf('|');
    return i < 0 ? k : (k.slice(0, i) + ' › ' + k.slice(i + 1));
  }
  // 접고 편 상태는 기억한다 — 매번 같은 반을 다시 펼치게 만들지 않으려고.
  var LIST_OPEN_KEY = 'kwSurveyListOpen';
  function listOpenState(){
    try{ var v = JSON.parse(localStorage.getItem(LIST_OPEN_KEY) || 'null'); return (v && typeof v === 'object') ? v : null; }
    catch(e){ return null; }
  }
  function listOpenSave(o){ try{ localStorage.setItem(LIST_OPEN_KEY, JSON.stringify(o)); }catch(e){} }

  function renderList(items){
    if(!items.length){
      viewEl.innerHTML = isStaff
        ? '<div class="state">아직 만든 테스트가 없어요.<br>오른쪽 위 <b>+ 새로 만들기</b> 버튼으로 첫 테스트를 만들어 보세요.</div>'
        : '<div class="state">아직 만든 테스트·설문이 없어요.<br>오른쪽 위 <b>+ 새로 만들기</b> 버튼으로 첫 항목을 만들어 보세요.</div>';
      return;
    }
    viewEl.innerHTML = '';

    var order = [], bucket = {};
    items.forEach(function(s){
      var k = listGroupKey(s);
      if(!bucket[k]){ bucket[k] = []; order.push(k); }
      bucket[k].push(s);
    });

    // 묶을 게 하나뿐이면 머리줄은 군더더기다 — 예전처럼 그냥 나열한다.
    if(order.length < 2){
      items.forEach(function(s){ viewEl.appendChild(listCard(s)); });
      return;
    }

    // 실제 반이 먼저, 「여러 반」 → 「반 지정 없음」이 뒤. 반끼리는 서버가 준 순서(최근 만든 순)를 그대로 둔다.
    var rank = function(k){ return k === GRP_NONE ? 2 : (k === GRP_MULTI ? 1 : 0); };
    order.sort(function(a, b){ return rank(a) - rank(b); });

    var saved = listOpenState();
    order.forEach(function(k, gi){
      var arr = bucket[k];
      var openN = arr.filter(function(s){ return s.status === 'open'; }).length;
      // 처음 열 땐 맨 위(가장 최근에 쓴 반)만 펼친다. 그 뒤로는 접고 편 상태를 그대로 되살린다.
      var isOpen = (saved && (k in saved)) ? !!saved[k] : (gi === 0);
      var d = document.createElement('details');
      d.className = 'clsGrp';
      if(isOpen) d.open = true;
      d.innerHTML = '<summary>'
        + '<svg class="g-caret" width="12" height="8" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1.5L6 6.5L11 1.5"></path></svg>'
        + '<span>' + esc(listGroupLabel(k)) + '</span>'
        + '<span class="g-cnt">' + arr.length + '개' + (openN ? ' · 진행중 ' + openN : '') + '</span>'
        + '</summary><div class="g-body"></div>';
      var body = d.querySelector('.g-body');
      arr.forEach(function(s){ body.appendChild(listCard(s)); });
      d.addEventListener('toggle', function(){
        var cur = listOpenState() || {};
        cur[k] = d.open;
        listOpenSave(cur);
      });
      viewEl.appendChild(d);
    });
  }

  // 카드 한 장 만들기. 예전엔 renderList 안에서 바로 붙였지만, 이제 반별 묶음(.g-body) 밑에도 붙여야 해서 떼어냈다.
  function listCard(s){
      var card = document.createElement('div'); card.className = 'card';
      var h = '';
      h += '<div class="row1"><span class="nm">' + esc(s.title) + '</span>';
      h += '<span class="badge ' + s.status + '">' + (s.status==='open'?'진행중':s.status==='closed'?'종료':'초안') + '</span></div>';
      if(s.description) h += '<div class="desc">' + esc(s.description) + '</div>';
      h += '<div class="sub"><span class="badge aud">' + esc(AUD_LABEL[s.audience]||'전체') + '</span> ';
      (s.audAcademy||[]).forEach(function(a){ if(a) h += '<span class="badge tgt"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M4 20.5V9.5L12 4l8 5.5v11"></path><path d="M2.5 20.5h19M9.5 20.5v-6h5v6"></path></svg>' + esc(a) + '</span> '; });
      (s.audClass||[]).forEach(function(c){ if(c){ var pi = c.indexOf('|'); h += '<span class="badge tgt">' + esc(pi >= 0 ? (c.slice(0,pi) + ' › ' + c.slice(pi+1)) : c) + '</span> '; } });
      h += s.quiz ? '<span class="badge quiz">테스트</span> ' : '<span class="badge srv">설문</span> ';
      if(s.anonymous) h += '<span class="badge anon">익명</span> ';
      h += '· 질문 ' + (s.questions?s.questions.length:0) + '개 · 응답 <b>' + (s.responseCount||0) + '</b>명';
      if(s.createdAt) h += ' · ' + esc(fmt(s.createdAt));
      h += '</div>';
      h += '<div class="acts">';
      h += '<button class="b-pri" data-act="results">결과 ' + (s.responseCount||0) + '</button>';
      if(s.status === 'open') h += '<button class="b-sec" data-act="close">종료</button>';
      else h += '<button class="b-sec" data-act="open">' + (s.status==='closed'?'다시 열기':'열기(공개)') + '</button>';
      h += '<button class="b-ghost" data-act="edit">수정</button>';
      h += '<button class="b-del" data-act="del">삭제</button>';
      h += '</div>';
      card.innerHTML = h;

      card.querySelector('[data-act="results"]').addEventListener('click', function(){ loadResults(s.id); });
      card.querySelector('[data-act="edit"]').addEventListener('click', function(){ loadForEdit(s.id); });
      var st = card.querySelector('[data-act="open"], [data-act="close"]');
      if(st) st.addEventListener('click', function(){
        var next = (s.status === 'open') ? 'closed' : 'open';
        api('PATCH', '?id=' + s.id, { status: next }).then(function(r){
          if(r.ok){ var 무엇 = (s.quiz ? '테스트' : '설문'); toast(next==='open' ? (무엇+'을 공개했어요') : (무엇+'을 종료했어요')); loadList(); } else toast('변경 실패');
        }).catch(function(){ toast('변경 실패'); });
      });
      card.querySelector('[data-act="del"]').addEventListener('click', function(){ askDelete(s); });
      return card;
  }

  // ─────────────── 삭제 (성적표 점수 처리를 그때 고른다) ───────────────
  // 2026-08-02 §11 6번 · 관우T 확정(원문 "물어봐").
  //   테스트를 지우면 그 테스트로 성적표에 올라간 점수는 **기본으로 남는다**(예전 동작 그대로).
  //   점수가 실제로 있을 때만 한 번 더 여쭙고, 그때 「함께 삭제 / 남기기」를 고르시게 한다.
  //   ⚠️ 기본을 「남기기」로 둔 이유: 실수로 아이들 성적 이력이 통째로 날아가는 쪽이 훨씬 아프다.
  //   ⚠️ 성적 일괄 삭제는 원장 전용이다(서버도 403으로 막는다) — 조교는 이 물음을 보지 않는다.
  function askDelete(s){
    var 무엇 = (s.quiz ? '테스트' : '설문');
    // 성적표에 올라간 점수가 몇 명분인지 먼저 세어본다. 실패하면 안전하게 「남기기」로 간다.
    api('GET', '?admin=1&id=' + s.id + '&scoreCount=1')
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; })
      .then(function(d){
        var n = (d && typeof d.count === 'number') ? d.count : 0;
        var withScores = false;

        if(n > 0 && !isStaff){
          var who = (d.names || []).join(', ') + (d.more > 0 ? ' 외 ' + d.more + '명' : '');
          var ask = '「' + (s.title || '제목 없음') + '」 ' + 무엇 + '을 삭제합니다.\n\n'
            + '이 ' + 무엇 + '으로 성적표에 올라간 점수가 ' + n + '명분 있어요.\n'
            + (who ? '(' + who + ')\n' : '')
            + '\n이 점수도 함께 지울까요?\n\n'
            + '[확인] 성적표 점수도 함께 삭제\n'
            + '[취소] 성적표 점수는 그대로 남겨두기\n\n'
            + '※ 어느 쪽이든 ' + 무엇 + '과 응답은 삭제됩니다. 다음 창에서 최종 확인해요.';
          withScores = confirm(ask);
        }

        var last = '정말 삭제할까요? 되돌릴 수 없어요.\n\n'
          + '· ' + 무엇 + '과 모든 응답이 삭제돼요.\n'
          + (n > 0
            ? (withScores
              ? '· 성적표 점수 ' + n + '명분도 함께 삭제돼요.\n'
              : '· 성적표 점수 ' + n + '명분은 그대로 남아요.\n'
                + '  (원본 ' + 무엇 + '이 없어도 학생 성적표에는 계속 보여요. 나중에 성적 화면에서 한 줄씩 지울 수 있어요.)\n')
            : '');
        if(!confirm(last)) return;

        api('DELETE', '?id=' + s.id + (withScores ? '&deleteScores=1' : '')).then(function(r){
          if(!r.ok){ toast('삭제 실패'); return; }
          return r.json().then(function(x){
            toast(withScores && x && x.scoreRemoved
              ? '삭제했어요 — 성적표 점수 ' + x.scoreRemoved + '명분도 지웠어요'
              : '삭제했어요');
            loadList();
          }).catch(function(){ toast('삭제했어요'); loadList(); });
        }).catch(function(){ toast('삭제 실패'); });
      });
  }

  // ─────────────── 빌더 ───────────────
  function newQuestion(type, label){
    var t = type || 'short';   // 기본값 단답(관우T 확정: 답안지형 테스트)
    var q = { id:'q' + Date.now() + '_' + (_qseq++), type:t, label:label||'', required:false };
    if(t==='single'||t==='multi'||t==='dropdown') q.options = ['', ''];
    if(t==='scale'){ q.scaleMin=1; q.scaleMax=5; q.scaleMinLabel=''; q.scaleMaxLabel=''; }
    return q;
  }
  // 답안지형 테스트: 라벨을 위치 번호(1번·2번…)로. 빈칸/번호패턴만 갱신, 직접 쓴 제목은 보존.
  function renumberQuiz(){
    var i = 0;
    draft.questions.forEach(function(q){
      i++;
      var lb = (q.label||'').trim();
      if(lb==='' || /^\d+번$/.test(lb)) q.label = i + '번';
    });
  }
  // ── 대상 프리셋 (?acad=&cls=&new=1) ───────────────────────────
  //   학생 목록의 반 헤더 ⋯더보기 → 🗳️ 테스트에서 넘어오면 그 반을 대상으로 새 테스트를 바로 연다.
  //   new=1이 있어야 새로 만들기까지 진행한다(그냥 목록만 보러 온 경우와 구분).
  //   반 체크박스 값은 "학원|반" 쌍 형식이다(다른 학원의 같은 이름 반과 안 섞이게, 2026-07-16).
  var PRESET = (function(){
    try{ var q = new URLSearchParams(location.search);
         return { acad:q.get('acad'), cls:q.get('cls'), isNew:q.get('new')==='1' }; }
    catch(_){ return { acad:null, cls:null, isNew:false }; }
  })();

  function startNew(){
    // 상태 기본값 = 초안 (관우T 2026-07-09 확정: "초안 있는 게 낫겠다 — 미리 만들어두고 공개하게")
    // 2026-08-04 관우T "메인이 테스트다" → 새로 만들 때 기본 모드를 테스트로 바꿨다(전에는 원장만 설문으로 시작).
    //   설문은 수업 첫날·마지막날에만 쓰므로, 그때만 위쪽 「설문」 탭을 누르시면 된다.
    draft = { title:'', description:'', audience:'all', audAcademy:[], audClass:[], anonymous:false, quiz:true, useTwin:true, status:'draft', questions:[ newQuestion('short') ] };
    if(PRESET.acad){
      draft.audAcademy = [PRESET.acad];
      if(PRESET.cls) draft.audClass = [PRESET.acad + '|' + PRESET.cls];
      PRESET.acad = null; PRESET.cls = null;   // 한 번만 적용
    }
    renderBuilder();
  }
  function loadForEdit(id){
    api('GET', '?admin=1&id=' + id).then(function(r){ return r.json(); }).then(function(data){
      if(!data || !data.ok){ toast('불러오기 실패'); return; }
      var s = data.survey;
      draft = { id:s.id, title:s.title, description:s.description, audience:s.audience, audAcademy:s.audAcademy||[], audClass:s.audClass||[], anonymous:s.anonymous, quiz:!!s.quiz, useTwin:true, status:s.status, questions:(s.questions||[]).map(function(q){ return q; }) };
      if(!draft.questions.length) draft.questions = [ newQuestion('short') ];
      renderBuilder();
    }).catch(function(){ toast('불러오기 실패'); });
  }

  function renderBuilder(){
    setMode('build');
    viewEl.innerHTML = '';
    var box = document.createElement('div');

    var head = document.createElement('div'); head.className = 'card';
    head.innerHTML =
      // 2026-08-04 — 메인은 테스트다(설문은 수업 첫날·마지막날에만). 그래서 테스트 탭을 왼쪽에 둔다.
      '<div class="modeTabs" id="modeTabs">' +
        '<button type="button" class="modeTab" id="tabQuiz">테스트</button>' +
        '<button type="button" class="modeTab" id="tabSurvey">설문</button>' +
      '</div>' +
      '<label class="fld" id="fTitleLbl">제목</label>' +
      '<input type="text" id="fTitle" placeholder="예: 2학기 중간 대비 1차 테스트">' +
      '<label class="fld">설명 (선택)</label>' +
      '<textarea id="fDesc" placeholder="응답자에게 보여줄 안내문"></textarea>' +
      '<div class="inline">' +
        '<div><label class="fld">응답 대상</label>' +
          '<select id="fAud"><option value="all">전체(학생·학부모)</option><option value="student">학생만</option><option value="parent">학부모만</option></select></div>' +
        '<div><label class="fld">상태</label>' +
          '<select id="fStatus"><option value="draft">초안(저장만 · 학생에게 안 보임)</option><option value="open">공개(응답 받기)</option><option value="closed">종료(응답 마감)</option></select></div>' +
      '</div>' +
      '<label class="chk"><input type="checkbox" id="fAnon"> 익명 응답 (누가 답했는지 저장·표시 안 함)</label>' +
      '<div id="testKindRow" style="margin-top:10px;"><label class="fld">테스트 종류 <span style="font-weight:400;color:var(--muted);">(지정하면 채점 점수가 성적표에 자동 반영돼요)</span></label>' +
        '<select id="fTestKind"><option value="">없음 (일반 테스트)</option><option value="일일테스트">일일테스트</option><option value="주간테스트">주간테스트</option><option value="월말테스트">월말테스트</option></select></div>' +
      '<div id="twinRow" style="margin-top:10px;"><label class="chk"><input type="checkbox" id="fUseTwin"> 쌍둥이 문제(오답 재도전) 사용 <span style="font-weight:400;color:var(--muted);">— 끄면 이 시험은 재도전 없이 진행돼요</span></label></div>' +
      '<div class="qhint" id="quizHint"></div>' +
      '<div class="fld" style="margin-top:12px;">대상 학원·반 <span style="font-weight:400;color:var(--muted);">(아무것도 안 고르면 전체 대상)</span></div>' +
      '<div id="fTargetWrap" data-loaded="0" style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:0.85rem;color:var(--muted);">불러오는 중…</div>';
    box.appendChild(head);

    var qwrap = document.createElement('div'); qwrap.id = 'qwrap';
    box.appendChild(qwrap);

    var addBtn = document.createElement('button'); addBtn.className = 'addQ'; addBtn.textContent = '+ 질문 추가';
    addBtn.addEventListener('click', function(){ syncFromForm(); draft.questions.push(newQuestion('short')); if(draft.quiz) renumberQuiz(); renderQuestions(); });
    box.appendChild(addBtn);

    // ── 한번에 여러 문항 추가 (답안지형 테스트 전용) — N개를 '1번·2번…' 라벨·단답으로 생성 ──
    var bulkRow = document.createElement('div'); bulkRow.id = 'bulkRow';
    bulkRow.style.cssText = 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 0 4px;';
    bulkRow.innerHTML =
      '<input type="number" id="bulkN" value="30" min="1" max="100" inputmode="numeric" style="width:72px;padding:8px;border:1px solid var(--line);border-radius:8px;">' +
      '<button type="button" class="addQ" id="bulkAdd" style="margin:0;width:auto;">개 한번에 추가</button>' +
      '<button type="button" class="addQ" id="renumBtn" style="margin:0;width:auto;">번호 새로 매기기</button>' +
      '<div class="qhint" style="flex-basis:100%;margin:0;">답안지형 테스트: 문제는 종이(매쓰홀릭), 앱에는 <b>답만</b> 입력해요. 문항은 자동으로 <b>1번·2번…</b> 단답으로 만들어져요.</div>';
    box.appendChild(bulkRow);
    // ⚠️ box가 아직 문서(viewEl)에 붙기 전이라 document.getElementById는 null —
    //    반드시 bulkRow.querySelector로 찾아야 함(분리된 노드에서도 동작). (2026-07-16 버그픽스)
    bulkRow.querySelector('#bulkAdd').addEventListener('click', function(){
      syncFromForm();
      var n = parseInt(document.getElementById('bulkN').value, 10);
      if(!(n > 0)) n = 1;
      if(n > 100){ n = 100; toast('한번에 최대 100개까지 만들 수 있어요'); }
      for(var i = 0; i < n; i++) draft.questions.push(newQuestion('short'));
      renumberQuiz();
      renderQuestions();
    });
    bulkRow.querySelector('#renumBtn').addEventListener('click', function(){
      syncFromForm(); renumberQuiz(); renderQuestions(); toast('문항 번호를 다시 매겼어요');
    });

    viewEl.appendChild(box);

    document.getElementById('fTitle').value = draft.title || '';
    document.getElementById('fDesc').value = draft.description || '';
    document.getElementById('fAud').value = draft.audience || 'all';
    document.getElementById('fStatus').value = draft.status || 'draft';
    document.getElementById('fAnon').checked = !!draft.anonymous;
    document.getElementById('fTestKind').value = draft.testKind || '';
    if(draft.useTwin===undefined) draft.useTwin = true;
    var fUseTwin = document.getElementById('fUseTwin');
    if(fUseTwin){ fUseTwin.checked = !!draft.useTwin; fUseTwin.addEventListener('change', function(e){ draft.useTwin = e.target.checked; renderQuestions(); }); }
    if(isStaff){ draft.quiz = true; }  // 조교는 테스트 전용
    setupModeTabs();

    loadTargetOptions();
    if(draft.quiz) renumberQuiz();
    renderQuestions();
  }

  // 대상 학원·반 체크박스 로드 — /api/class-options(학원·반 목록) 기반. 아무것도 안 고르면 전체.
  function loadTargetOptions(){
    var wrap = document.getElementById('fTargetWrap');
    if(!wrap) return;
    var selA = (draft && draft.audAcademy) || [];
    var selC = (draft && draft.audClass) || [];
    var opts = { headers:{} };
    if(token) opts.headers['Authorization'] = 'Bearer ' + token;
    fetch('/api/class-options', opts).then(function(r){ return r.json(); }).then(function(data){
      var academies = (data && data.academies) || [];
      var classes = (data && data.classes) || {};
      if(!academies.length){ wrap.innerHTML = '<span style="color:var(--muted);">등록된 학원·반이 없어요. (학생 등록 후 표시됩니다)</span>'; wrap.dataset.loaded='1'; return; }
      var h = '';
      academies.forEach(function(ac){
        var acChk = selA.indexOf(ac) >= 0 ? ' checked' : '';
        h += '<div style="margin-bottom:8px;">'
          + '<label class="chk" style="font-weight:700;color:var(--text);"><input type="checkbox" class="fTargetAcademy" value="' + escAttr(ac) + '"' + acChk + '> <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M4 20.5V9.5L12 4l8 5.5v11"></path><path d="M2.5 20.5h19M9.5 20.5v-6h5v6"></path></svg>' + esc(ac) + '</label>';
        var cls = classes[ac] || [];
        if(cls.length){
          h += '<div style="padding-left:20px;display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;">';
          cls.forEach(function(cl){
            // 반 체크박스 값 = "학원|반" 쌍 — 다른 학원의 같은 이름 반과 안 섞이게 (2026-07-16)
            var pair = ac + '|' + cl;
            // 프리체크: 새 형식(쌍) 우선, 구형(반 이름만 저장된 옛 설문)도 체크 표시(하위호환)
            var clChk = (selC.indexOf(pair) >= 0 || selC.indexOf(cl) >= 0) ? ' checked' : '';
            h += '<label class="chk" style="font-weight:400;"><input type="checkbox" class="fTargetClass" value="' + escAttr(pair) + '"' + clChk + '> ' + esc(cl) + '</label>';
          });
          h += '</div>';
        }
        h += '</div>';
      });
      h += '<div style="font-size:0.75rem;color:var(--muted);margin-top:4px;">학원을 고르면 그 학원 학생만, 반을 고르면 <b>그 학원의 그 반</b> 학생만 대상이 됩니다(같은 이름 반이 다른 학원에 있어도 안 섞여요). 아무것도 안 고르면 전체.</div>';
      wrap.innerHTML = h;
      wrap.dataset.loaded = '1';
    }).catch(function(){ wrap.innerHTML = '<span style="color:var(--muted);">학원·반 목록을 불러오지 못했어요. (전체 대상으로 저장됩니다)</span>'; wrap.dataset.loaded='1'; });
  }

  // 설문/테스트 탭 — 체크박스 대신 상단 탭으로 모드 선택. 테스트면 응답 대상=학생 고정.
  function setupModeTabs(){
    var ts = document.getElementById('tabSurvey'), tq = document.getElementById('tabQuiz');
    if(!ts || !tq) return;
    ts.addEventListener('click', function(){ if(isStaff || !draft.quiz) return; draft.quiz = false; applyModeUI(); renderQuestions(); });
    tq.addEventListener('click', function(){ if(draft.quiz) return; draft.quiz = true; applyModeUI(); renderQuestions(); });
    if(isStaff){ ts.disabled = true; ts.title = '조교 계정은 테스트 전용입니다'; }  // 설문 탭 잠금
    applyModeUI();
  }
  function applyModeUI(){
    var ts = document.getElementById('tabSurvey'), tq = document.getElementById('tabQuiz');
    if(ts) ts.classList.toggle('on', !draft.quiz);
    if(tq) tq.classList.toggle('on', !!draft.quiz);
    // 제목 라벨·예시도 모드에 맞춰 부른다(표기 규칙: 항목 하나하나는 성격대로, 섞이는 자리만 '테스트·설문').
    var 무엇 = (isStaff || draft.quiz) ? '테스트' : '설문';
    if(hTitle) hTitle.textContent = draft.id ? (무엇 + ' 수정') : ('새 ' + 무엇);   // 탭을 바꾸면 상단 제목도 따라간다
    var tl = document.getElementById('fTitleLbl');
    if(tl) tl.textContent = draft.quiz ? '테스트 제목' : '설문 제목';
    var ti = document.getElementById('fTitle');
    if(ti) ti.placeholder = draft.quiz ? '예: 2학기 중간 대비 1차 테스트' : '예: 3월 수업 만족도 조사';
    var aud = document.getElementById('fAud');
    if(aud){
      if(draft.quiz){ draft.audience = 'student'; aud.value = 'student'; aud.disabled = true; }  // 테스트는 학생만 응답
      else { aud.disabled = false; }
    }
    var tkRow = document.getElementById('testKindRow');
    if(tkRow) tkRow.style.display = draft.quiz ? '' : 'none';  // 테스트 종류는 테스트에서만 노출
    var twRow = document.getElementById('twinRow');
    if(twRow) twRow.style.display = draft.quiz ? '' : 'none';  // 쌍둥이 토글도 테스트에서만
    var bkRow = document.getElementById('bulkRow');
    if(bkRow) bkRow.style.display = draft.quiz ? '' : 'none';  // 일괄 생성도 테스트에서만
    updateQuizHint();
  }
  function updateQuizHint(){
    var el = document.getElementById('quizHint'); if(!el) return;
    el.textContent = draft.quiz
      ? '정답(✔)만 표시하세요 — 배점은 자동 배분돼요(총 100점, 장문형은 다른 문항의 2배). 장문형은 결과 화면에서 O·X 채점하면 점수에 합산. (척도는 채점 제외)'
      : '';
  }
  // 자동 배점 계산 — 서버(sanitizeQuestions)와 동일 규칙: 총 100점, 장문형 가중 2배, 큰 나머지 우선 정수 배분
  function calcAutoPoints(){
    var idxs=[], ws=[];
    draft.questions.forEach(function(q,i){
      if(q.type==='long'){ idxs.push(i); ws.push(2); return; }
      var has = false;
      if(q.type==='single'||q.type==='dropdown') has = (typeof q._ci==='number' && q._ci>=0);
      else if(q.type==='multi') has = !!(q._cis && q._cis.length);
      else if(q.type==='short'||q.type==='math') has = !!((q._ct||'').trim());
      if(has){ idxs.push(i); ws.push(1); }
    });
    var units = ws.reduce(function(a,b){ return a+b; }, 0);
    var map = {};
    if(!units) return map;
    var raw = ws.map(function(w){ return w*100/units; });
    var base = raw.map(Math.floor);
    var left = 100 - base.reduce(function(a,b){ return a+b; }, 0);
    raw.map(function(v,i){ return { i:i, f:v-Math.floor(v) }; })
       .sort(function(a,b){ return b.f-a.f || a.i-b.i; })
       .forEach(function(o){ if(left>0){ base[o.i]++; left--; } });
    idxs.forEach(function(qi,k){ map[qi] = base[k]; });
    return map;
  }
  function refreshAutoPoints(){
    if(!draft || !draft.quiz) return;
    var map = calcAutoPoints();
    document.querySelectorAll('.autoPts').forEach(function(el){
      var i = parseInt(el.dataset.qi,10); var q = draft.questions[i]; if(!q) return;
      if(map[i]===undefined){ el.textContent = '정답(✔)을 표시하면 배점이 자동으로 매겨져요'; return; }
      el.innerHTML = '배점 <b>' + map[i] + '점</b> (자동 배분)'
        + (q.type==='long' ? ' · 2배 가중 — 제출 후 결과 화면에서 O·X 채점' : '');
    });
  }
  // 편집 로드 시 저장된 정답/배점 → 빌더 내부상태(_ci/_cis/_ct/_pts)로 복원
  function ensureQuizState(q){
    if(q.type==='single'||q.type==='dropdown'){
      if(q._ci===undefined) q._ci = (q.correct!=null && Array.isArray(q.options)) ? q.options.indexOf(q.correct) : -1;
    } else if(q.type==='multi'){
      if(!q._cis){
        var set=[];
        if(Array.isArray(q.correct) && Array.isArray(q.options)) q.correct.forEach(function(c){ var i=q.options.indexOf(c); if(i>=0) set.push(i); });
        q._cis = set;
      }
    } else if(q.type==='short'||q.type==='math'){
      if(q._ct===undefined) q._ct = (typeof q.correct==='string') ? q.correct : '';
    }
    // 쌍둥이 정답(오답 재도전용) — 모든 채점형 공통. 저장된 correctTwin 문자열을 빌더 상태로 복원.
    if(q._ctTwin===undefined) q._ctTwin = (typeof q.correctTwin==='string') ? q.correctTwin : '';
    // (배점 상태 _pts 폐지 — 배점은 자동 배분)
  }

  function renderQuestions(){
    var qwrap = document.getElementById('qwrap');
    qwrap.innerHTML = '';
    draft.questions.forEach(function(q, idx){
      if(draft.quiz) ensureQuizState(q);
      var gradable = (q.type==='single'||q.type==='multi'||q.type==='dropdown'||q.type==='short'||q.type==='math');
      var isOX = isOXQuestion(q);   // OX형 = single + 고정 선택지 O/X (표시만 'OX형')
      var qc = document.createElement('div'); qc.className = 'qcard';
      var dispType = isOX ? 'ox' : (q.type==='multi' ? 'single' : (q.type==='math' ? 'short' : q.type));  // multi→'객관식', 옛 math→'단답'(수식 통합)
      var typeOpts = Object.keys(QTYPE_LABEL).map(function(t){
        return '<option value="' + t + '"' + (dispType===t?' selected':'') + '>' + QTYPE_LABEL[t] + '</option>';
      }).join('');
      var h = '';
      h += '<div class="qhead"><span class="qn">Q' + (idx+1) + '</span>';
      h += '<select data-q="type">' + typeOpts + '</select><span class="sp"></span>';
      if(idx>0) h += '<button data-q="up">▲</button>';
      if(idx<draft.questions.length-1) h += '<button data-q="down">▼</button>';
      h += '<button data-q="rm" style="color:#B02A37;">삭제</button></div>';
      h += '<input type="text" data-q="label" placeholder="질문 내용" value="' + esc(q.label) + '">';
      qc.innerHTML = h;

      // 선택지 / 척도 영역
      var extra = document.createElement('div');

      // 테스트: 자동 배점 표시 (수동 입력 폐지 — 총 100점, 장문형 2배 가중)
      if(draft.quiz && (gradable || q.type==='long')){
        var pr = document.createElement('div'); pr.className = 'qhint'; pr.style.margin = '2px 0 6px';
        pr.innerHTML = '<span class="autoPts" data-qi="' + idx + '"></span>';
        extra.appendChild(pr);
      } else if(draft.quiz && q.type==='scale'){
        var nn = document.createElement('div'); nn.className = 'qhint'; nn.style.marginBottom = '6px';
        nn.textContent = '(척도 문항은 채점 대상이 아니에요)';
        extra.appendChild(nn);
      }

      if(isOX){
        // OX형 — 선택지 O/X 고정(수정·삭제·추가 불가), 테스트 모드면 ✔로 정답 표시
        q.options.forEach(function(opt, oi){
          var row = document.createElement('div'); row.className = 'opt';
          var markHtml = '';
          if(draft.quiz){
            var on = (q._ci===oi);
            markHtml = '<button class="ansmark' + (on?' on':'') + '" title="정답으로 표시">✔</button>';
          }
          row.innerHTML = markHtml + '<span style="flex:1;font-weight:800;padding:8px 4px;">' + esc(opt) + '</span>';
          if(draft.quiz){
            row.querySelector('.ansmark').addEventListener('click', function(){
              q._ci = (q._ci===oi) ? -1 : oi;
              renderQuestions();
            });
          }
          extra.appendChild(row);
        });
      } else if(q.type==='single'||q.type==='multi'||q.type==='dropdown'){
        (q.options||[]).forEach(function(opt, oi){
          var row = document.createElement('div'); row.className = 'opt';
          var markHtml = '';
          if(draft.quiz){
            var on = (q.type==='multi') ? (q._cis.indexOf(oi)>=0) : (q._ci===oi);
            markHtml = '<button class="ansmark' + (on?' on':'') + '" title="정답으로 표시">✔</button>';
          }
          row.innerHTML = markHtml + '<input type="text" placeholder="선택지 ' + (oi+1) + '" value="' + esc(opt) + '"><button>✕</button>';
          row.querySelector('input').addEventListener('input', function(e){ q.options[oi] = e.target.value; });
          var btns = row.querySelectorAll('button');
          var rmBtn = btns[btns.length-1];
          rmBtn.addEventListener('click', function(){
            q.options.splice(oi,1);
            if(draft.quiz){
              if(q.type==='multi'){
                q._cis = q._cis.filter(function(i){ return i!==oi; }).map(function(i){ return i>oi ? i-1 : i; });
              } else {
                if(q._ci===oi) q._ci = -1; else if(q._ci>oi) q._ci = q._ci-1;
              }
            }
            renderQuestions();
          });
          if(draft.quiz){
            var mk = row.querySelector('.ansmark');
            mk.addEventListener('click', function(){
              if(q.type==='multi'){
                var p = q._cis.indexOf(oi);
                if(p>=0) q._cis.splice(p,1); else q._cis.push(oi);
              } else {
                q._ci = (q._ci===oi) ? -1 : oi;
              }
              renderQuestions();
            });
          }
          extra.appendChild(row);
        });
        var add = document.createElement('button'); add.className = 'addopt'; add.textContent = '+ 선택지 추가';
        add.addEventListener('click', function(){ q.options.push(''); renderQuestions(); });
        extra.appendChild(add);
        // 객관식(single/multi)에서만 '복수 응답 허용' 토글 — 체크 시 multi, 해제 시 single (dropdown 제외)
        if(q.type==='single' || q.type==='multi'){
          var mlab = document.createElement('label'); mlab.className = 'qreq';
          mlab.innerHTML = '<input type="checkbox"' + (q.type==='multi'?' checked':'') + '> 복수 응답 허용 (여러 개 선택)';
          mlab.querySelector('input').addEventListener('change', function(e){
            if(e.target.checked){
              q.type = 'multi';
              if(draft.quiz){ q._cis = (typeof q._ci==='number' && q._ci>=0) ? [q._ci] : (q._cis||[]); }
            } else {
              q.type = 'single';
              if(draft.quiz){ q._ci = (q._cis && q._cis.length) ? q._cis[0] : (typeof q._ci==='number' ? q._ci : -1); }
            }
            renderQuestions();
          });
          extra.appendChild(mlab);
        }
      } else if(draft.quiz && (q.type==='short' || q.type==='math')){
        // 단답·수식 통합(2026-07-24 관우T): 정답칸은 기본 텍스트 + 키패드 아이콘 버튼으로 수식(math-field) 전환.
        //   저장은 _ct 문자열 1개(텍스트 수식 3/4·sqrt(2)도, 키패드 LaTeX도 서버가 값 동치로 채점).
        //   옛 'math' 문항은 type을 그대로 두고(하위호환) 이 칸만 수식모드로 시작 — 서버 math 채점 분기 유지.
        var cr = document.createElement('div'); cr.className = 'qcorrect';
        extra.appendChild(cr);
        (function(qq, host){
          var KBD = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="9" r="1.3"/><circle cx="15" cy="9" r="1.3"/><circle cx="9" cy="13" r="1.3"/><circle cx="15" cy="13" r="1.3"/><circle cx="9" cy="17" r="1.3"/><circle cx="15" cy="17" r="1.3"/></svg>';
          function kbShow(){ try{ if(window.mathVirtualKeyboard && !window.mathVirtualKeyboard.visible) window.mathVirtualKeyboard.show(); }catch(e){} }
          function mkBtn(html, title, onClick){
            var b = document.createElement('button'); b.type='button'; b.innerHTML=html; b.title=title; b.setAttribute('aria-label',title);
            b.style.cssText='flex:0 0 auto;min-width:46px;padding:0 11px;border:1px solid var(--line,#ddd);border-radius:10px;background:#fff;color:#333;font-weight:800;font-size:0.9rem;display:flex;align-items:center;justify-content:center;cursor:pointer;';
            b.addEventListener('click', function(ev){ ev.preventDefault(); onClick(); });
            return b;
          }
          function toText(){
            host.innerHTML='';
            var row=document.createElement('div'); row.style.cssText='display:flex;gap:6px;align-items:stretch;';
            var ip=document.createElement('input'); ip.type='text'; ip.placeholder='정답 (대소문자·공백 무시하고 채점)'; ip.value=qq._ct||''; ip.style.flex='1';
            ip.addEventListener('input', function(){ qq._ct=ip.value; refreshAutoPoints(); });
            row.appendChild(ip); row.appendChild(mkBtn(KBD,'수식 키패드로 입력',toMath)); host.appendChild(row);
            var h=document.createElement('div'); h.className='qhint'; h.style.margin='4px 0 0';
            h.textContent='분수·루트는 오른쪽 키패드 버튼, 또는 3/4·sqrt(2)·x^2처럼 입력';
            host.appendChild(h);
          }
          function toMath(){
            if(!(window.customElements && customElements.get('math-field'))){ toast('수식 키패드 준비 중 — 잠시 후 다시 눌러 주세요'); return; }
            host.innerHTML='';
            var row=document.createElement('div'); row.style.cssText='display:flex;gap:6px;align-items:stretch;';
            var mf=document.createElement('math-field'); mf.setAttribute('math-virtual-keyboard-policy','onfocus'); mf.style.flex='1';
            try{ mf.value=qq._ct||''; }catch(e){}
            mf.addEventListener('input', function(){ qq._ct=mf.value; refreshAutoPoints(); });
            mf.addEventListener('focusin', function(){ setTimeout(kbShow,60); });
            mf.addEventListener('pointerup', function(){ try{ mf.focus(); }catch(e){} setTimeout(kbShow,150); });
            row.appendChild(mf); row.appendChild(mkBtn('일반','일반 키보드로 입력',toText)); host.appendChild(row);
            var h=document.createElement('div'); h.className='qhint'; h.style.margin='4px 0 0';
            h.textContent='칸을 누르면 수학 키패드 · 형태가 달라도(2/4=1/2) 값 같으면 정답';
            host.appendChild(h);
            try{ mf.focus(); }catch(e){}
          }
          if(qq.type==='math' || /\\/.test(qq._ct||'')) toMath(); else toText();
        })(q, cr);
      }
      // ── 쌍둥이 정답(오답 재도전용) — 모든 채점형 문항에 선택 입력. 비우면 그 문항은 재도전 없음. ──
      //   재도전 때 학생은 쌍둥이 문제를 종이(매쓰홀릭)로 풀고 '답만' 입력하므로 문자열 1개.
      if(draft.quiz && draft.useTwin && gradable){
        var twr = document.createElement('div'); twr.className = 'qcorrect'; twr.style.marginTop = '6px';
        var tlab = document.createElement('div'); tlab.className = 'qhint'; tlab.style.margin = '0 0 4px';
        tlab.textContent = '쌍둥이 정답 (오답 재도전용 · 비우면 이 문항은 재도전 없음)';
        twr.appendChild(tlab);
        if(q.type==='math'){
          var tmf = document.createElement('math-field');
          tmf.setAttribute('math-virtual-keyboard-policy','onfocus');
          (function(mfEl, qq){
            customElements.whenDefined('math-field').then(function(){ try{ mfEl.value = qq._ctTwin || ''; }catch(_){} });
            mfEl.addEventListener('input', function(){ qq._ctTwin = mfEl.value; });
            // iOS 키패드 미표시 대비 — 탭하면 직접 show()
            mfEl.addEventListener('focusin', function(){ setTimeout(function(){ try{ if(window.mathVirtualKeyboard && !window.mathVirtualKeyboard.visible) window.mathVirtualKeyboard.show(); }catch(e){} }, 60); });
            mfEl.addEventListener('pointerup', function(){ try{ mfEl.focus(); }catch(e){} setTimeout(function(){ try{ if(window.mathVirtualKeyboard && !window.mathVirtualKeyboard.visible) window.mathVirtualKeyboard.show(); }catch(e){} }, 150); });
          })(tmf, q);
          twr.appendChild(tmf);
        } else {
          var tin = document.createElement('input');
          tin.type = 'text'; tin.placeholder = '쌍둥이 문제의 정답';
          tin.value = q._ctTwin || '';
          tin.addEventListener('input', function(e){ q._ctTwin = e.target.value; });
          twr.appendChild(tin);
        }
        extra.appendChild(twr);
      }
      if(q.type==='scale'){
        var sr = document.createElement('div'); sr.className = 'scaleRow';
        sr.innerHTML = '<span>최소</span><input type="text" inputmode="numeric" data-s="min" value="' + esc(q.scaleMin) + '">' +
                       '<span>~ 최대</span><input type="text" inputmode="numeric" data-s="max" value="' + esc(q.scaleMax) + '">';
        extra.appendChild(sr);
        var sl = document.createElement('div'); sl.style.marginTop='6px';
        sl.innerHTML = '<input type="text" data-s="minL" placeholder="최소값 설명 (예: 매우 불만족)" value="' + esc(q.scaleMinLabel||'') + '" style="margin-bottom:6px;">' +
                       '<input type="text" data-s="maxL" placeholder="최대값 설명 (예: 매우 만족)" value="' + esc(q.scaleMaxLabel||'') + '">';
        extra.appendChild(sl);
        sr.querySelector('[data-s="min"]').addEventListener('input', function(e){ q.scaleMin = e.target.value; });
        sr.querySelector('[data-s="max"]').addEventListener('input', function(e){ q.scaleMax = e.target.value; });
        sl.querySelector('[data-s="minL"]').addEventListener('input', function(e){ q.scaleMinLabel = e.target.value; });
        sl.querySelector('[data-s="maxL"]').addEventListener('input', function(e){ q.scaleMaxLabel = e.target.value; });
      }
      qc.appendChild(extra);

      var req = document.createElement('label'); req.className = 'qreq';
      req.innerHTML = '<input type="checkbox"' + (q.required?' checked':'') + '> 필수 응답';
      req.querySelector('input').addEventListener('change', function(e){ q.required = e.target.checked; });
      qc.appendChild(req);

      qc.querySelector('[data-q="type"]').addEventListener('change', function(e){
        var nt = e.target.value;
        if(nt==='ox'){
          // OX형 = single + 선택지 O/X 고정
          q.type = 'single'; q.options = ['O','X']; q._ci = -1; q._cis = [];
          renderQuestions(); return;
        }
        var wasOX = isOXQuestion(q);
        q.type = nt;
        if((nt==='single'||nt==='multi'||nt==='dropdown') && (!Array.isArray(q.options) || wasOX)) q.options = ['',''];
        if(nt==='scale' && q.scaleMin===undefined){ q.scaleMin=1; q.scaleMax=5; }
        renderQuestions();
      });
      qc.querySelector('[data-q="label"]').addEventListener('input', function(e){ q.label = e.target.value; });
      qc.querySelector('[data-q="rm"]').addEventListener('click', function(){
        if(draft.questions.length<=1){ toast('질문은 최소 1개 필요해요'); return; }
        draft.questions.splice(idx,1); if(draft.quiz) renumberQuiz(); renderQuestions();
      });
      var up = qc.querySelector('[data-q="up"]'); if(up) up.addEventListener('click', function(){ var t=draft.questions[idx-1]; draft.questions[idx-1]=q; draft.questions[idx]=t; if(draft.quiz) renumberQuiz(); renderQuestions(); });
      var dn = qc.querySelector('[data-q="down"]'); if(dn) dn.addEventListener('click', function(){ var t=draft.questions[idx+1]; draft.questions[idx+1]=q; draft.questions[idx]=t; if(draft.quiz) renumberQuiz(); renderQuestions(); });

      qwrap.appendChild(qc);
    });
    refreshAutoPoints();
  }

  function syncFromForm(){
    var t = document.getElementById('fTitle'); if(!t) return;
    draft.title = t.value;
    draft.description = document.getElementById('fDesc').value;
    draft.audience = document.getElementById('fAud').value;
    draft.status = document.getElementById('fStatus').value;
    draft.anonymous = document.getElementById('fAnon').checked;
    if(draft.quiz) draft.audience = 'student';  // draft.quiz는 설문/테스트 탭에서 관리 · 테스트면 대상은 학생 고정
    var tk = document.getElementById('fTestKind');
    draft.testKind = (draft.quiz && tk) ? (tk.value || '') : '';  // 테스트 종류는 테스트일 때만 유효
    // 대상 학원·반 — 옵션이 로드됐을 때만 읽어 draft 갱신(로드 전 syncFromForm이 초기화하는 것 방지)
    var tw = document.getElementById('fTargetWrap');
    if(tw && tw.dataset.loaded === '1'){
      draft.audAcademy = Array.prototype.slice.call(document.querySelectorAll('.fTargetAcademy:checked')).map(function(c){ return c.value; });
      draft.audClass = Array.prototype.slice.call(document.querySelectorAll('.fTargetClass:checked')).map(function(c){ return c.value; });
    }
  }

  function saveBuilder(){
    syncFromForm();
    if(!draft.title.trim()){ toast((draft.quiz ? '테스트' : '설문') + ' 제목을 입력해 주세요'); return; }
    // 질문 정리 — 라벨 빈 것/선택지 빈 것 제거
    var qs = draft.questions.map(function(q){
      var o = { id:q.id, type:q.type, label:(q.label||'').trim(), required:!!q.required };
      if(q.type==='single'||q.type==='multi'||q.type==='dropdown') o.options = (q.options||[]).map(function(x){return (x||'').trim();}).filter(Boolean);
      if(q.type==='scale'){ o.scaleMin=parseInt(q.scaleMin,10)||1; o.scaleMax=parseInt(q.scaleMax,10)||5; o.scaleMinLabel=(q.scaleMinLabel||'').trim(); o.scaleMaxLabel=(q.scaleMaxLabel||'').trim(); }
      // 테스트: 정답만 실어보내기 — 배점은 서버가 자동 배분(총 100점, 장문형 2배)
      if(draft.quiz){
        if(q.type==='single'||q.type==='dropdown'){
          var c = (typeof q._ci==='number' && q._ci>=0 && q.options) ? (q.options[q._ci]||'').trim() : '';
          if(c) o.correct = c;
        } else if(q.type==='multi'){
          var cs = (q._cis||[]).map(function(i){ return (q.options[i]||'').trim(); }).filter(Boolean);
          if(cs.length) o.correct = cs;
        } else if(q.type==='short'||q.type==='math'){
          var ct = (q._ct||'').trim();
          if(ct) o.correct = ct;
        }
        // 쌍둥이 정답 — 원본 정답이 있는 채점형에만 유효. 쌍둥이 미사용(useTwin=false)이면 직렬화 생략.
        if(draft.useTwin && o.correct !== undefined){
          var ctw = (q._ctTwin||'').trim();
          if(ctw) o.correctTwin = ctw;
        }
      }
      return o;
    }).filter(function(q){
      if(!q.label) return false;
      if((q.type==='single'||q.type==='multi'||q.type==='dropdown') && (!q.options || !q.options.length)) return false;
      return true;
    });
    if(!qs.length){ toast('질문과 선택지를 채워 주세요'); return; }

    var payload = { title:draft.title.trim(), description:draft.description.trim(), audience:draft.audience, audAcademy:draft.audAcademy||[], audClass:draft.audClass||[], anonymous:draft.anonymous, quiz:!!draft.quiz, status:draft.status, testKind:(draft.quiz ? (draft.testKind||'') : ''), questions:qs };
    var saving = draft.id ? api('PATCH', '?id=' + draft.id, payload) : api('POST', '', payload);
    saving.then(function(r){ return r.json(); }).then(function(data){
      if(data && data.ok){ toast('저장했어요'); draft = null; loadList(); }
      else toast((data && data.error) || '저장 실패');
    }).catch(function(){ toast('저장 실패'); });
  }

  // ─────────────── 결과 ───────────────
  var _openResp = [];   // 응답자별 점수에서 펼쳐둔 응답 id (재렌더 시 유지)
  var _editResp = null; // ✏️ 답 수정 중인 응답 id (재렌더 시 폼 유지)
  var _clsFilter = '*'; // 지금 보고 있는 반. '*' = 전체 · '' = 반 미확인 · 그 밖엔 '학원|반'
  var _clsMap = null;   // 응답 id → 반 키 (학생 명단과 맞춰본 결과)
  var _allResp = [];    // 반 필터를 걸기 전 전체 응답 — 재렌더·응답 삭제·반 목록은 늘 이걸 기준으로
  var _students = null; // /api/students 캐시 (결과 화면을 여러 번 열어도 한 번만 받는다)

  // ── 반 묶기 ─────────────────────────────────────────────────────────────
  //  응답 행에는 반이 없다(survey_responses = 전화·이름·답·점수뿐). 그래서 학생 명단을 받아
  //  「응답한 번호(없으면 이름) → 그 학생의 반」으로 되짚는다. 못 되짚은 응답은 「반 미확인」에 모은다.
  function loadStudents(){
    if(_students) return Promise.resolve(_students);
    var opts = { headers:{} };
    if(token) opts.headers['Authorization'] = 'Bearer ' + token;
    return fetch('/api/students', opts)
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(list){ _students = Array.isArray(list) ? list : []; return _students; })
      .catch(function(){ _students = []; return _students; });   // 못 받아도 결과 화면은 열려야 한다 (반 고르기만 빠짐)
  }
  function onlyDigits(v){ return String(v==null?'':v).replace(/\D/g,''); }
  function buildClassIndex(responses){
    var byPhone = {}, byName = {};
    (_students||[]).forEach(function(s){
      // 학생이 자기 번호로 냈을 수도, 학부모 번호로 로그인해 냈을 수도 있다 — 서버 조회와 같게 둘 다 건다.
      [s.studentPhone, s.parentPhone].forEach(function(p){
        var d = onlyDigits(p); if(!d) return;
        (byPhone[d] = byPhone[d] || []).push(s);
      });
      var n = String(s.name||'').trim();
      if(n) (byName[n] = byName[n] || []).push(s);
    });
    var map = {};
    responses.forEach(function(r){
      var st = null;
      var cand = byPhone[onlyDigits(r.respondentPhone)] || [];
      if(cand.length === 1) st = cand[0];
      else if(cand.length > 1){
        // 형제가 학부모 번호 하나를 같이 쓰면 후보가 여럿 → 응답에 적힌 이름으로 가른다.
        var nm = String(r.respondentName||'').trim();
        var hit = cand.filter(function(s){ return String(s.name||'').trim() === nm; });
        if(hit.length === 1) st = hit[0];
      }
      if(!st){
        // 조교 계정엔 학생 목록의 연락처가 가려져 온다(students.js STAFF_HIDDEN) → 번호로는 영영 못 맞춘다. 이름으로 한 번 더.
        var byn = byName[String(r.respondentName||'').trim()] || [];
        if(byn.length === 1) st = byn[0];   // 동명이인이면 아무도 고르지 않는다 — 엉뚱한 반에 넣느니 미확인이 낫다.
      }
      map[r.id] = (st && st.className) ? ((st.academy||'') + '|' + st.className) : '';
    });
    return map;
  }
  function clsKeyOf(r){ return (_clsMap && _clsMap[r.id]) || ''; }
  function clsNameOf(k){ var i = k.indexOf('|'); return i < 0 ? k : k.slice(i+1); }
  function clsAcaOf(k){ var i = k.indexOf('|'); return i < 0 ? '' : k.slice(0, i); }
  // 실제로 응답이 나온 반만 모은다(가나다순 · 「반 미확인」은 늘 맨 끝).
  // 다른 학원에 같은 이름 반이 있으면 그 둘만 학원 이름을 덧붙인다(대상 지정과 같은 규칙 — 2026-07-16).
  function classGroups(responses){
    var cnt = {}, order = [];
    responses.forEach(function(r){
      var k = clsKeyOf(r);
      if(cnt[k] === undefined){ cnt[k] = 0; order.push(k); }
      cnt[k]++;
    });
    var nameCnt = {};
    order.forEach(function(k){ if(k){ var n = clsNameOf(k); nameCnt[n] = (nameCnt[n]||0) + 1; } });
    order.sort(function(a,b){
      if(!a) return 1;
      if(!b) return -1;
      return clsNameOf(a).localeCompare(clsNameOf(b), 'ko');
    });
    return order.map(function(k){
      var nm = clsNameOf(k);
      return { key:k, label:(k ? (nm + (nameCnt[nm] > 1 ? (' · ' + clsAcaOf(k)) : '')) : '반 미확인'), n:cnt[k] };
    });
  }

  function loadResults(id){
    setMode('results');
    _openResp = [];
    _editResp = null;
    _clsFilter = '*';   // 새로 열면 늘 전체부터 (2026-08-14 관우T)
    _clsMap = null;
    viewEl.innerHTML = '<div class="state">불러오는 중…</div>';
    Promise.all([
      api('GET', '?admin=1&id=' + id).then(function(r){ return r.json(); }),
      loadStudents()
    ]).then(function(out){
      var data = out[0];
      if(!data || !data.ok){ viewEl.innerHTML = '<div class="state">' + esc((data&&data.error)||'불러오지 못했어요.') + '</div>'; return; }
      renderResults(data.survey, data.responses || []);
    }).catch(function(){ viewEl.innerHTML = '<div class="state">네트워크 오류로 불러오지 못했어요.</div>'; });
  }

  function renderResults(survey, responses){
    var qs = survey.questions || [];
    // ── 반 고르기 — 여기 한 곳에서만 거른다 ──
    //   아래 전 구간(오답률 순위·분모·평균·채점 대기·응답자별 점수·문항별 집계·CSV)이 이 responses 하나를 쓰므로,
    //   고른 반만 남겨서 넘기면 화면 전체가 그 반 기준으로 다시 계산된다. 전체 목록은 _allResp 에 남겨 둔다.
    //   ⚠️ 이 함수를 다시 부를 땐 반드시 renderResults(survey, _allResp) — 걸러진 배열을 되먹이면 다른 반이 사라진다.
    _allResp = responses;
    _clsMap = buildClassIndex(responses);
    var groups = (survey.anonymous || !responses.length) ? [] : classGroups(responses);
    var hasPick = groups.length >= 2;   // 반이 하나뿐이면(또는 익명이라 못 가리면) 고를 게 없으니 안 띄운다
    var pickOk = false, pickLabel = '';
    groups.forEach(function(g){ if(g.key === _clsFilter){ pickOk = true; pickLabel = g.label; } });
    if(!hasPick || (_clsFilter !== '*' && !pickOk)){ _clsFilter = '*'; pickLabel = ''; }   // 고르던 반의 응답이 다 지워진 경우
    if(_clsFilter !== '*') responses = responses.filter(function(r){ return clsKeyOf(r) === _clsFilter; });
    viewEl.innerHTML = '';
    var top = document.createElement('div'); top.className = 'card';
    var th = '<div class="row1"><span class="nm">' + esc(survey.title) + '</span>';
    th += '<span class="badge ' + survey.status + '">' + (survey.status==='open'?'진행중':survey.status==='closed'?'종료':'초안') + '</span></div>';
    th += '<div class="rsummary">응답 <b>' + responses.length + '</b>명';
    if(survey.quiz) th += ' · <span class="badge quiz">테스트</span>';
    if(survey.anonymous) th += (survey.quiz ? ' · 익명 테스트' : ' · 익명 설문');
    // 테스트: 평균 점수
    if(survey.quiz && responses.length){
      var maxS = null, sumS = 0, cntS = 0;
      responses.forEach(function(r){
        if(typeof r.score==='number'){ sumS += r.score; cntS++; if(typeof r.maxScore==='number') maxS = r.maxScore; }
      });
      if(cntS) th += '<br>평균 점수 <b>' + (sumS/cntS).toFixed(1) + '</b>' + (maxS!=null?(' / ' + maxS + '점'):'점');
    }
    th += '</div>';
    // 반이 떠 있고, 누르면 반 목록이 쫙 펼쳐진다 — 고르면 아래 결과 전체가 그 반만으로 다시 계산 (2026-08-14 관우T)
    if(hasPick){
      th += '<div class="clsPick"><span class="lb">반</span><select id="clsSel" aria-label="반 고르기">'
          + '<option value="*"' + (_clsFilter==='*' ? ' selected' : '') + '>전체 (' + _allResp.length + '명)</option>';
      groups.forEach(function(g){
        th += '<option value="g:' + escAttr(g.key) + '"' + (_clsFilter===g.key ? ' selected' : '') + '>' + esc(g.label) + ' (' + g.n + '명)</option>';
      });
      th += '</select></div>';
    }
    th += '<div class="acts"><button class="b-ghost" id="csvBtn">CSV 내려받기</button></div>';
    top.innerHTML = th;
    viewEl.appendChild(top);
    top.querySelector('#csvBtn').addEventListener('click', function(){ downloadCsv(survey, responses, pickLabel); });
    if(hasPick){
      top.querySelector('#clsSel').addEventListener('change', function(){
        var v = this.value;
        _clsFilter = (v === '*') ? '*' : v.slice(2);
        _openResp = []; _editResp = null;   // 반을 바꾸면 펼쳐둔 답안·수정 폼은 닫는다 (다른 반 것이 남으면 헷갈린다)
        var y = window.scrollY;
        renderResults(survey, _allResp);
        window.scrollTo(0, y);
      });
    }

    if(!responses.length){
      var e = document.createElement('div'); e.className = 'state'; e.textContent = '아직 응답이 없어요.';
      viewEl.appendChild(e); return;
    }

    // ── 🎯 오답률 순위 (테스트 전용) — 자동채점 문항(객관식·단답·수식)만 · 미제출=오답 · 분모=전체 응시 인원 ──
    //    서술형은 수동 O/X·채점대기가 섞여 오답률 개념이 애매해 제외(2026-07-29 관우T · 2026-08-04 재확인).
    //    2026-08-04 관우T 지시로 「Top 5」 → 「전 문항」. 다 맞힌 문항(오답률 0%)도 맨 아래에 흐리게 남긴다.
    //    문항이 많으면 결과 화면이 밀리므로 기본은 제목줄만 보이는 접힘(<details class="wrank">), 펼치면 전부.
    if(survey.quiz){
      var wstat = qs.map(function(q, i){ return { q:q, i:i }; })
        .filter(function(o){
          var q = o.q;
          return q.correct!=null && (q.type==='single'||q.type==='multi'||q.type==='dropdown'||q.type==='short'||q.type==='math');
        }).map(function(o){
          var q = o.q, ok = 0;
          responses.forEach(function(r){ if(isRight(q, (r.answers||{})[q.id])===true) ok++; });
          var wrong = responses.length - ok;
          // 라벨의 「문항 N」은 원본 문항 순서(o.i)로 만든다 — 서술형이 섞여 있어도 번호가 밀리지 않게.
          return { label:(q.label||('문항 '+(o.i+1))), wrong:wrong, rate: responses.length?Math.round(wrong/responses.length*100):0, idx:o.i, ans:answerBadge(q) };
        });
      // 정렬: 오답률 높은 순 → 같으면 「문항 번호 내림차순」(2026-08-12 관우T: 보통 뒤로 갈수록 어려우니
      //       오답률이 같으면 뒷번호를 위에 둔다). rate는 반올림값이라 동률 판정 전 실제 오답 수로 한 번 더 가른다.
      wstat.sort(function(a,b){ return (b.rate-a.rate) || (b.wrong-a.wrong) || (b.idx-a.idx); });
      if(wstat.length){
        var wrongQn = wstat.filter(function(s){ return s.wrong>0; }).length;
        var wc = document.createElement('div'); wc.className='card';
        var wh = '<details class="wrank"><summary>'
               + '<span style="font-size:1.02rem;font-weight:800;color:var(--text);"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="4"></circle></svg>오답률 순위</span>'
               + '<span class="badge quiz">테스트</span>'
               + '<span class="wrank-tog"><span class="wrank-open">전 ' + wstat.length + '문항 보기 ▾</span><span class="wrank-close">접기 ▴</span></span>'
               + '</summary>'
               + '<div class="rsummary" style="margin:11px 0 13px;font-size:0.82rem;color:var(--text-light);">많이 틀린 순 · 미제출도 오답으로 셈 (분모 ' + responses.length + '명) · 틀린 사람이 있는 문항 ' + wrongQn + '개</div>';
        wstat.forEach(function(s, i){
          var zero = (s.wrong === 0);
          wh += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:11px;' + (zero?'opacity:0.5;':'') + '">'
              +   '<span style="flex:0 0 22px;height:22px;border-radius:7px;background:' + (zero?'var(--text-light,#8a807a)':(i===0?'var(--danger,#C5221F)':'var(--primary)')) + ';color:#fff;font-weight:800;font-size:0.8rem;display:flex;align-items:center;justify-content:center;">' + (i+1) + '</span>'
              +   '<div style="flex:1;min-width:0;">'
              +     '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:0.86rem;margin-bottom:4px;">'
              +       '<span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;">' + esc(s.label) + '</span>'
              +       (s.ans ? '<span class="wr-ans">정답 ' + s.ans + '</span>' : '')
              +       '<span style="flex:0 0 auto;margin-left:auto;font-weight:800;color:' + (zero?'var(--text-light)':'#C5221F') + ';">' + s.rate + '%<span style="color:var(--text-light);font-weight:600;font-size:0.8rem;"> (' + s.wrong + '/' + responses.length + ')</span></span>'
              +     '</div>'
              +     '<div style="background:var(--bg);border-radius:6px;height:8px;overflow:hidden;"><div style="width:' + s.rate + '%;height:100%;border-radius:6px;background:linear-gradient(90deg,#E8746F,#C5221F);"></div></div>'
              +   '</div>'
              + '</div>';
        });
        wh += '</details>';
        wc.innerHTML = wh;
        viewEl.appendChild(wc);
      }
    }

    // 장문형(배점 있는) 문항 — 수동 O·X 채점 대상
    var longQs = survey.quiz ? qs.filter(function(q){ return q.type==='long' && q.points!=null; }) : [];
    function pendingCount(r){
      var n = 0;
      longQs.forEach(function(q){ var m = r.manual || {}; if(m[q.id]!==0 && m[q.id]!==1) n++; });
      return n;
    }

    // ── math(수식) 동치 판정 — surveys.js(서버)와 동일 로직의 클라 복제본 ──
    //   교사 결과뷰(정답률·개별 O/X)를 서버 채점과 일치시키기 위함. 2/4=1/2, √8=2√2 등.
    function normTextLatex(s){
      var t = String(s==null?'':s)
        .replace(/[−‒–—―]/g,'-')   // 유니코드 마이너스/대시 → ASCII '-'
        .replace(/\\left|\\right/g,'')
        .replace(/\\dfrac|\\tfrac/g,'\\frac')
        .replace(/\\cdot|\\times/g,'*')
        .replace(/\s+/g,'')
        .toLowerCase();
      // MathLive(0.110)는 한 글자 인수의 중괄호를 생략해 내보낸다: \frac{1}{2} → \frac12.
      // '한 글자만 감싼 중괄호'만 벗긴다({12} 같은 두 글자 이상은 건드리지 않음).
      var prev;
      do { prev = t; t = t.replace(/\{([^{}])\}/g,'$1'); } while (t !== prev);
      return t;
    }
    function latexToNumber(src){
      if(src==null) return null;
      var s=String(src), tokens=[], i=0;
      while(i<s.length){
        var ch=s[i];
        if(ch===' '||ch==='\t'||ch==='\n'){ i++; continue; }
        if(ch==='\\'){
          var j=i+1, name='';
          while(j<s.length && /[a-zA-Z]/.test(s[j])){ name+=s[j]; j++; }
          if(name===''){ if(s[j]===','||s[j]===' '||s[j]===';'||s[j]==='!'){ i=j+1; continue; } return null; }
          i=j;
          switch(name){
            case 'left': case 'right': continue;
            case 'frac': case 'dfrac': case 'tfrac': tokens.push({type:'frac'}); continue;
            case 'sqrt': tokens.push({type:'sqrt'}); continue;
            case 'cdot': case 'times': tokens.push({type:'*'}); continue;
            case 'div': tokens.push({type:'/'}); continue;
            case 'lparen': tokens.push({type:'('}); continue;
            case 'rparen': tokens.push({type:')'}); continue;
            case 'pi': tokens.push({type:'num', value:Math.PI}); continue;
            default: return null;
          }
        }
        // raw(원문 자릿수) 보관 — \frac12처럼 중괄호가 생략된 인수를 한 글자씩 떼기 위해 필요.
        if(/[0-9.]/.test(ch)){ var num=''; while(i<s.length && /[0-9.]/.test(s[i])){ num+=s[i]; i++; } var nv=parseFloat(num); if(!isFinite(nv)) return null; tokens.push({type:'num', value:nv, raw:num}); continue; }
        if('+-*/^(){}[]'.indexOf(ch)>=0){ tokens.push({type:ch}); i++; continue; }
        if(/[a-zA-Z]/.test(ch)) return null;
        return null;
      }
      var p=0, failed=false;
      function peek(){ return tokens[p]; }
      function nextT(){ return tokens[p++]; }
      var NUM_START={num:true,'(':true,'{':true,frac:true,sqrt:true};
      function fail(){ failed=true; return 0; }
      function parseExpr(){ var v=parseTerm(); while(peek() && (peek().type==='+'||peek().type==='-')){ var op=nextT().type; var r=parseTerm(); v=(op==='+')?v+r:v-r; } return v; }
      function parseTerm(){ var v=parseFactor(); while(peek()){ var t=peek().type; if(t==='*'||t==='/'){ nextT(); var r=parseFactor(); v=(t==='*')?v*r:v/r; } else if(NUM_START[t]===true){ var r2=parseFactor(); v=v*r2; } else break; } return v; }
      function parseFactor(){ var sign=1; while(peek() && (peek().type==='-'||peek().type==='+')){ if(nextT().type==='-') sign=-sign; } var base=parseAtom(); if(peek() && peek().type==='^'){ nextT(); var exp=parseFactor(); base=Math.pow(base,exp); } return sign*base; }
      function parseAtom(){
        var t=peek(); if(!t) return fail();
        if(t.type==='num'){ nextT(); return t.value; }
        if(t.type==='('){ nextT(); var v=parseExpr(); if(peek() && peek().type===')') nextT(); else return fail(); return v; }
        if(t.type==='{'){ nextT(); var v2=parseExpr(); if(peek() && peek().type==='}') nextT(); else return fail(); return v2; }
        if(t.type==='frac'){ nextT(); var fa=parseGroup(true); var fb=parseGroup(true); return fa/fb; }
        if(t.type==='sqrt'){ nextT(); if(peek() && peek().type==='['){ nextT(); var n=parseExpr(); if(peek() && peek().type===']') nextT(); else return fail(); var sa=parseGroup(); return Math.pow(sa, 1/n); } var sa2=parseGroup(); return Math.sqrt(sa2); }
        return fail();
      }
      // single=true면 중괄호 없는 인수를 LaTeX 규칙대로 '한 글자'만 취한다(\frac12 = 1/2).
      // \sqrt에는 적용하지 않음 — 평문 'sqrt12'(=√12)를 깨뜨리지 않기 위해.
      function parseGroup(single){
        var t=peek();
        if(t && t.type==='{'){ nextT(); var v=parseExpr(); if(peek() && peek().type==='}') nextT(); else return fail(); return v; }
        if(single && t && t.type==='num' && /^[0-9]{2,}$/.test(t.raw||'')){
          var head=parseFloat(t.raw[0]);
          t.raw=t.raw.slice(1); t.value=parseFloat(t.raw);
          return head;
        }
        return parseAtom();
      }
      var result=parseExpr();
      if(failed) return null;
      if(p!==tokens.length) return null;
      if(typeof result!=='number' || !isFinite(result)) return null;
      return result;
    }
    // 일반 키보드 수식 표기 → LaTeX 동의어(서버 preLatex와 동일 — 표시용 정오 판정 일치, 2026-07-22)
    function preLatex(s){
      return String(s==null?'':s)
        .replace(/√/g,'\\sqrt').replace(/π/g,'\\pi')
        .replace(/[−‒–—―]/g,'-')   // 유니코드 마이너스/대시 → ASCII '-' (MathLive 키패드가 U+2212 삽입)
        .replace(/⁄/g,'/')          // 분수 슬래시 ⁄(U+2044) → /
        .replace(/\{([^{}]*)\}\s*\\over\s*\{([^{}]*)\}/g,'\\frac{$1}{$2}')  // {a}\over{b} → \frac{a}{b}
        .replace(/×/g,'*').replace(/÷/g,'/')
        .replace(/(^|[^\\a-zA-Z])sqrt/gi,'$1\\sqrt')
        .replace(/(^|[^\\a-zA-Z])pi($|[^a-zA-Z])/gi,'$1\\pi$2');
    }
    function mathEqual(studentLatex, correctLatex){
      if(studentLatex==null || String(studentLatex).trim()==='') return false;
      var a=latexToNumber(preLatex(studentLatex)), b=latexToNumber(preLatex(correctLatex));
      if(a!=null && b!=null){ var scale=Math.max(1, Math.abs(a), Math.abs(b)); return Math.abs(a-b) <= 1e-9*scale; }
      var na=normTextLatex(studentLatex), nb=normTextLatex(correctLatex);
      return na!=='' && na===nb;
    }
    // math 정답을 예쁘게(read-only 수식) 표시 — MathLive 미로드 시 원본 문자열
    function fmtMathA(v){
      var s=(v==null)?'':(''+v);
      if(s==='') return '<span class="sub">(무응답)</span>';
      if(window.customElements && customElements.get('math-field')) return '<math-field read-only>'+esc(s)+'</math-field>';
      return esc(s);
    }
    // 🎯 오답률 순위에 붙는 「정답」 뱃지 (2026-08-12 관우T — 오답률 보면서 바로 수업하려고).
    //   객관식은 선택지 번호만(①②③) 보여 달라는 선택. 단답·수식은 답을 그대로.
    //   correct 저장 형태는 saveBuilder(1034~1043) 기준: single·dropdown = 선택지 '문자열', multi = 문자열 배열,
    //   short·math = 문자열. 번호는 options.indexOf 로 되찾고, 못 찾으면(선택지를 나중에 고친 경우 등) 글자 그대로.
    function circNo(n){ return (n>=1 && n<=15) ? String.fromCharCode(0x245F + n) : ('(' + n + ')'); }
    function optNo(q, v){
      var i = Array.isArray(q.options) ? q.options.indexOf(v) : -1;
      return i>=0 ? circNo(i+1) : esc(String(v));
    }
    function answerBadge(q){
      if(q.correct==null || q.correct==='') return '';
      // OX형(single + 고정 선택지 O/X)만은 번호(②)가 아니라 글자 그대로 — 「정답 ②」는 읽어도 뜻이 안 통한다.
      if(isOXQuestion(q)) return esc(String(q.correct));
      if(q.type==='single' || q.type==='dropdown') return optNo(q, q.correct);
      if(q.type==='multi'){
        var cs = Array.isArray(q.correct) ? q.correct : [q.correct];
        if(!cs.length) return '';
        return cs.map(function(v){ return optNo(q, v); }).join('·');
      }
      // 단답·수식은 입력칸이 통합돼 있어 type이 'short'여도 LaTeX가 들어 있을 수 있다 → 역슬래시가 보이면 수식으로 렌더.
      if(q.type==='math' || (q.type==='short' && /\\/.test(String(q.correct)))) return fmtMathA(q.correct);
      return esc(String(q.correct));
    }

    // ── 테스트 공통 헬퍼: 정오 판정(표시용) · O/X 버튼 · 채점 저장 ──
    function normA(s){ return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' '); }
    function isRight(q, a){   // true/false/null(판정불가·무응답)
      if(!survey.quiz || q.correct==null) return null;
      if(q.type==='multi'){
        var c = (Array.isArray(q.correct)?q.correct:[q.correct]).map(String).slice().sort();
        var v = (Array.isArray(a)?a:(a!=null&&a!==''?[a]:[])).map(String).slice().sort();
        if(!v.length) return null;
        return c.length===v.length && c.every(function(x,i){ return x===v[i]; });
      }
      if(a==null || String(a).trim()==='') return null;
      if(q.type==='math') return mathEqual(a, q.correct);
      // 단답도 수식 입력 허용(서버 채점과 동일 규칙, 2026-07-22)
      if(q.type==='short') return normA(a)===normA(q.correct) || mathEqual(a, q.correct);
      return normA(a)===normA(q.correct);
    }
    function essaySplit(r){   // 서버 점수에서 서술형만 떼어내기 (총점=자동+서술 이므로 역산)
      var eScore=0, eMax=0;
      longQs.forEach(function(q){ eMax += q.points; if((r.manual||{})[q.id]===1) eScore += q.points; });
      var t = (typeof r.score==='number') ? r.score : 0;
      var tm = (typeof r.maxScore==='number') ? r.maxScore : 0;
      return { aScore:t-eScore, aMax:tm-eMax, eScore:eScore, eMax:eMax };
    }
    function oxBtns(r, q){
      var m = (r.manual||{})[q.id];
      var bBase = 'border:1px solid var(--line);border-radius:8px;padding:4px 13px;cursor:pointer;font-weight:800;margin-left:5px;background:#fff;color:var(--muted);';
      var bO = bBase + (m===1 ? 'background:#E6F4EA;color:#137333;border-color:#137333;' : '');
      var bX = bBase + (m===0 ? 'background:#FCE8E6;color:#C5221F;border-color:#C5221F;' : '');
      return '<button class="oxbtn" data-rid="' + r.id + '" data-qid="' + escAttr(q.id) + '" data-v="1" style="' + bO + '">O</button>'
           + '<button class="oxbtn" data-rid="' + r.id + '" data-qid="' + escAttr(q.id) + '" data-v="0" style="' + bX + '">X</button>';
    }
    function attachOx(el){
      el.querySelectorAll('.oxbtn').forEach(function(b){
        b.addEventListener('click', function(ev){
          ev.stopPropagation();   // 학생 행 펼침 토글과 겹치지 않게
          var rid = parseInt(b.dataset.rid,10), qid = b.dataset.qid, v = (b.dataset.v==='1');
          var r = null;
          responses.forEach(function(x){ if(x.id===rid) r = x; });
          if(!r) return;
          var cur = (r.manual||{})[qid];
          var next = (cur === (v?1:0)) ? null : v;   // 같은 판정 다시 누르면 취소
          var marks = {}; marks[qid] = next;
          api('PATCH', '?id=' + survey.id + '&grade=1', { responseId: rid, marks: marks })
            .then(function(x){ return x.json(); }).then(function(d){
              if(!d || !d.ok){ toast((d && d.error) || '채점 저장 실패'); return; }
              r.manual = d.manual || {}; r.score = d.score; r.maxScore = d.maxScore;
              var y = window.scrollY;
              renderResults(survey, _allResp);
              window.scrollTo(0, y);
            }).catch(function(){ toast('채점 저장 실패'); });
        });
      });
    }
    function whoOf(r, i){ return survey.anonymous ? ('응답 ' + (i+1)) : (esc(r.respondentName) || ('응답 ' + (i+1))); }

    // ── 테스트: ✍️ 채점 대기 — 서술형 미채점 답안만 모아서 (채점 끝나면 목록에서 빠짐) ──
    if(survey.quiz && longQs.length){
      var pendList = [];
      responses.forEach(function(r, i){ if(pendingCount(r) > 0) pendList.push({ r:r, i:i }); });
      var gc = document.createElement('div'); gc.className = 'qres';
      if(!pendList.length){
        gc.innerHTML = '<h4><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M4 20l1.2-4.2L16.4 4.6a2 2 0 0 1 2.8 2.8L8 18.6 4 20z"></path><path d="M14.5 6.5l2.8 2.8"></path></svg>채점 대기</h4><div class="sub" style="color:#137333;font-weight:700;">서술형 채점이 모두 끝났어요 🎉</div>';
      } else {
        var gh = '<h4><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M4 20l1.2-4.2L16.4 4.6a2 2 0 0 1 2.8 2.8L8 18.6 4 20z"></path><path d="M14.5 6.5l2.8 2.8"></path></svg>채점 대기 <span style="color:#B26A00;">' + pendList.length + '명</span></h4>'
          + '<div class="sub" style="margin:-4px 0 8px;">O·X를 누르면 바로 저장돼요 (O=배점 합산 · X=0점 · 같은 버튼 다시 누르면 취소). 채점이 끝난 학생은 이 목록에서 빠져요.</div>';
        pendList.forEach(function(p){
          gh += '<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;">'
            + '<div style="font-weight:800;margin-bottom:6px;">' + whoOf(p.r, p.i) + '</div>';
          longQs.forEach(function(q){
            var m = (p.r.manual||{})[q.id];
            if(m===0 || m===1) return;   // 이미 채점된 문항은 안 보임
            var a = p.r.answers[q.id];
            var aTxt = (a && String(a).trim()) ? esc(a) : '<span class="sub">(무응답)</span>';
            gh += '<div class="textans" style="display:flex;align-items:flex-start;gap:8px;">'
              + '<span style="flex:1;"><span class="who">' + esc(q.label) + ' (' + q.points + '점)</span>' + aTxt + '</span>'
              + '<span style="white-space:nowrap;">' + oxBtns(p.r, q) + '</span></div>';
          });
          gh += '</div>';
        });
        gc.innerHTML = gh;
      }
      viewEl.appendChild(gc);
      attachOx(gc);
    }

    // ── 응답자별 (테스트=점수·답안 / 일반 설문=답변) — 이름 클릭 펼침 · ✏️답 수정 · 🔄재제출 허용 ──
    if(responses.length){
      function respDetail(r){
        var s = '';
        qs.forEach(function(q){
          var a = r.answers[q.id];
          var aTxt = Array.isArray(a) ? a.join(', ') : (a==null?'':String(a));
          var mark = '', ox = '';
          if(q.type==='long' && q.points!=null){
            var m = (r.manual||{})[q.id];
            mark = (m===1) ? '<span class="ok">✔ O (+' + q.points + '점)</span>'
                 : (m===0) ? '<span class="no">✕ X</span>'
                 : '<span style="color:#B26A00;font-weight:700;">⏳ 채점 대기</span>';
            ox = '<span style="white-space:nowrap;margin-left:6px;">' + oxBtns(r, q) + '</span>';
          } else {
            var rt = isRight(q, a);
            if(rt===true) mark = '<span class="ok">✔</span>';
            else if(rt===false) mark = '<span class="no">✗</span>';
          }
          s += '<div style="padding:6px 2px;border-bottom:1px solid #f0e6e9;font-size:0.85rem;display:flex;align-items:flex-start;gap:8px;">'
            + '<span style="flex:1;"><span class="who">' + esc(q.label) + ((q.points!=null)?(' (' + q.points + '점)'):'') + '</span>'
            + ((q.type==='math' || (!Array.isArray(a) && /\\/.test(aTxt))) ? fmtMathA(a) : (aTxt.trim() ? esc(aTxt) : '<span class="sub">(무응답)</span>')) + ' ' + mark + '</span>' + ox + '</div>';
        });
        return s;
      }
      // ── ✏️ 관리자 답 수정 폼 — 문항 타입별 입력으로 학생 답을 직접 고침(저장 시 서버가 재채점) ──
      function editForm(r){
        var inp = 'width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:0.85rem;font-family:inherit;background:#fff;';
        var s = '<div data-editwrap="' + r.id + '">'
          + '<div style="font-weight:800;color:var(--primary);margin:4px 0 8px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M4 20l1.2-4.2L16.4 4.6a2 2 0 0 1 2.8 2.8L8 18.6 4 20z"></path><path d="M14.5 6.5l2.8 2.8"></path></svg>답 수정 — 저장하면 즉시 재채점돼요'
          + (survey.testKind ? ' (성적표에도 반영)' : '') + '</div>';
        qs.forEach(function(q){
          var a = r.answers[q.id];
          s += '<div style="padding:6px 2px;border-bottom:1px solid #f0e6e9;font-size:0.85rem;">'

          } else if(q.type==='long'){
            s += '<textarea class="ansEdit" data-qid="' + escAttr(q.id) + '" rows="3" style="' + inp + 'resize:vertical;">' + esc(a==null?'':String(a)) + '</textarea>'
              + '<div class="sub" style="font-size:0.72rem;">답을 고치면 기존 O·X 판정은 취소되고 다시 채점 대기가 돼요.</div>';
          } else if(q.type==='math' || q.type==='short'){
            // 단답·수식 통합 — 아래 host를 append 후 '텍스트 ↔ 수식(math-field) 키패드' 토글 위젯으로 채움(빌더와 동일 패턴)
            s += '<div class="ansEditHost" data-qid="' + escAttr(q.id) + '" data-atype="' + escAttr(q.type) + '" data-init="' + escAttr(a==null?'':String(a)) + '"></div>';
          } else {   // (혹시 모를 기타 타입) 일반 텍스트 입력
            s += '<input type="text" class="ansEdit" data-qid="' + escAttr(q.id) + '" value="' + escAttr(a==null?'':String(a)) + '" style="' + inp + '">';
          }
          s += '</div>';
        });
        s += '<div style="display:flex;gap:8px;margin-top:10px;">'
          + '<button data-editsave="' + r.id + '" style="border:none;border-radius:8px;padding:8px 18px;cursor:pointer;font-weight:800;background:var(--primary);color:#fff;">저장</button>'
          + '<button data-editcancel="1" class="b-ghost" style="padding:8px 14px;">취소</button></div></div>';
        return s;
      }
      // 펼침 하단 액션 — ✏️답 수정 · 🔄재제출 허용(응답 삭제)
      function actionBar(r){
        return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">'
          + '<button data-editstart="' + r.id + '" class="b-ghost" style="font-size:0.82rem;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M4 20l1.2-4.2L16.4 4.6a2 2 0 0 1 2.8 2.8L8 18.6 4 20z"></path><path d="M14.5 6.5l2.8 2.8"></path></svg>답 수정</button>'
          + '<button data-resub="' + r.id + '" class="b-ghost" style="font-size:0.82rem;color:#C5221F;border-color:#C5221F;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M20 12a8 8 0 1 1-2.6-5.9"></path><path d="M20 4v4h-4"></path></svg>재제출 허용 (응답 삭제)</button></div>';
      }
      var sc = document.createElement('div'); sc.className = 'qres';
      var sch = '<h4>' + (survey.quiz ? '응답자별 점수' : '응답자별 답변') + ' <span class="sub" style="font-weight:400;">— 이름을 누르면 답안이 펼쳐져요 · 답 수정과 재제출 허용도 여기서</span></h4>';
      responses.forEach(function(r, i){
        var pd = longQs.length ? pendingCount(r) : 0;
        var open = _openResp.indexOf(r.id) >= 0;
        var sTxt = survey.quiz
          ? ((typeof r.score==='number') ? ('<b>' + r.score + (typeof r.maxScore==='number'?(' / ' + r.maxScore):'') + '점</b>') : '-')
          : '<span class="sub" style="font-size:0.78rem;">' + fmt(r.createdAt) + '</span>';
        if(longQs.length && typeof r.score==='number'){
          var sp = essaySplit(r);
          sTxt += '<br><span class="sub" style="font-size:0.74rem;">단답 ' + sp.aScore + '/' + sp.aMax + ' · 서술 ' + sp.eScore + '/' + sp.eMax + '</span>';
        }
        sch += '<div class="scoreItem" data-toggle="' + r.id + '" style="cursor:pointer;"><span>' + (open?'▾':'▸') + ' ' + whoOf(r, i)
          + (pd ? ' <span style="font-size:0.76rem;color:#B26A00;font-weight:700;">서술 채점 전 ' + pd + '</span>' : '')
          + '</span><span style="text-align:right;">' + sTxt + '</span></div>';
        if(open) sch += '<div style="padding:6px 10px 12px;background:#FBF7F2;border-radius:0 0 10px 10px;margin-bottom:4px;">'
          + (_editResp===r.id ? editForm(r) : (respDetail(r) + actionBar(r))) + '</div>';
      });
      sc.innerHTML = sch;
      viewEl.appendChild(sc);
      // ✏️ 답 수정 폼의 단답·수식 칸 — '텍스트 ↔ 수식(math-field) 키패드' 토글(빌더 653~694와 동일 패턴)
      //   저장 핸들러는 .ansEdit 의 .value 를 읽으므로, 어느 모드든 .ansEdit + data-qid 를 정확히 1개 유지한다.
      sc.querySelectorAll('.ansEditHost').forEach(function(host){
        (function(host){
          var qid = host.getAttribute('data-qid');
          var atype = host.getAttribute('data-atype') || 'short';
          var cur = host.getAttribute('data-init') || '';   // 텍스트↔수식 전환 시 값 이어받기
          var inpCss = 'width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:0.85rem;font-family:inherit;background:#fff;';
          var KBD = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="9" r="1.3"/><circle cx="15" cy="9" r="1.3"/><circle cx="9" cy="13" r="1.3"/><circle cx="15" cy="13" r="1.3"/><circle cx="9" cy="17" r="1.3"/><circle cx="15" cy="17" r="1.3"/></svg>';
          function kbShow(){ try{ if(window.mathVirtualKeyboard && !window.mathVirtualKeyboard.visible) window.mathVirtualKeyboard.show(); }catch(e){} }
          function mkBtn(html, title, onClick){
            var b = document.createElement('button'); b.type='button'; b.innerHTML=html; b.title=title; b.setAttribute('aria-label',title);
            b.style.cssText='flex:0 0 auto;min-width:46px;padding:0 11px;border:1px solid var(--line,#ddd);border-radius:10px;background:#fff;color:#333;font-weight:800;font-size:0.9rem;display:flex;align-items:center;justify-content:center;cursor:pointer;';
            b.addEventListener('click', function(ev){ ev.preventDefault(); onClick(); });
            return b;
          }
          function toText(){
            host.innerHTML='';
            var row=document.createElement('div'); row.style.cssText='display:flex;gap:6px;align-items:stretch;';
            var ip=document.createElement('input'); ip.type='text'; ip.className='ansEdit'; ip.setAttribute('data-qid',qid); ip.value=cur; ip.style.cssText=inpCss+'flex:1;';
            ip.addEventListener('input', function(){ cur=ip.value; });
