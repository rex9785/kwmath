<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>수업 &amp; 클리닉 총평 | 이관우 수학연구소</title>
<link rel="manifest" href="/manifest.json?v=2">
<meta name="theme-color" content="#862633">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=6">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;600;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--primary:#862633;--primary-mid:#A83040;--primary-light:#F9ECED;--text:#241318;--text-light:#9A8C85;--bg:#FFF;--bg2:#FAF9F6;--border:#E9E1D9;--hairline:#F1EAE2;--gold:#A8863D;--gold-line:#DEC98F;--gold-bright:#E3B655;--serif:'Noto Serif KR',serif;}
  body{font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif;letter-spacing:-0.01em;color:var(--text);background:var(--bg2);min-height:100vh;word-break:keep-all;overflow-wrap:break-word;line-break:strict;}

  .topbar{background:var(--primary);color:#fff;padding:max(14px,env(safe-area-inset-top,14px)) 20px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
  .topbar-title{font-size:0.95rem;font-weight:900;letter-spacing:-0.3px;display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;}
  .topbar-title .logo-mark{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:#fff;border-radius:6px;overflow:hidden;padding:0;}
  .topbar-title .logo-mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .topbar-btn{background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.28);color:#fff;padding:6px 12px;border-radius:8px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;}
  .kwnav{ display:flex; align-items:center; gap:8px; }
  .kwnav-home{ display:inline-flex; align-items:center; gap:5px; background:var(--primary); color:#fff; font-weight:800; font-size:0.84rem; text-decoration:none; padding:8px 13px; border-radius:9px; font-family:inherit; white-space:nowrap; line-height:1; }
  .kwnav-mw{ position:relative; }
  .kwnav-toggle{ display:inline-flex; align-items:center; gap:5px; background:#fff; color:var(--primary); border:1.5px solid var(--primary); font-weight:800; font-size:0.84rem; padding:6px 13px; border-radius:9px; cursor:pointer; font-family:inherit; white-space:nowrap; line-height:1.25; }
  .kwnav-pop{ position:absolute; right:0; top:calc(100% + 6px); background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,0.16); padding:6px; min-width:200px; z-index:200; display:none; }
  .kwnav-pop.show{ display:block; }
  .kwnav-pop a{ display:block; text-decoration:none; color:var(--text); font-weight:700; font-size:0.86rem; padding:9px 12px; border-radius:8px; white-space:nowrap; }
  .kwnav-pop a:hover{ background:var(--primary-light); }
  .kwnav-pop a.cur{ background:var(--primary-light); color:var(--primary); cursor:default; }
  .kwnav--light .kwnav-home{ background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.28); color:#fff; }
  .kwnav--light .kwnav-toggle{ background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.28); color:#fff; }
  .topbar-btn:hover{background:rgba(255,255,255,0.26);}

  .page{max-width:560px;margin:0 auto;padding:22px 18px 80px;}

  /* 자녀 선택 bar */
  .child-bar{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .child-bar label{font-size:0.78rem;font-weight:700;color:var(--text-light);}
  .child-bar select{padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:0.86rem;font-family:inherit;background:#fff;outline:none;font-weight:600;}

  /* 페이지 인트로 */
  .intro{margin-bottom:14px;}
  .intro h1{font-family:var(--serif);font-size:1.15rem;font-weight:700;color:var(--primary);letter-spacing:-0.3px;display:flex;align-items:center;gap:7px;margin-bottom:5px;}
  .intro h1 svg{color:var(--primary);flex-shrink:0;}
  .intro p{font-size:0.8rem;color:var(--text-light);line-height:1.6;}

  /* 총평 카드 */
  .rev-card{background:#fff;border-radius:14px;border:1px solid var(--border);padding:15px 17px;margin-bottom:11px;box-shadow:0 1px 3px rgba(36,19,24,0.03);}
  .rev-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--hairline);}
  .rev-date{font-family:var(--serif);font-weight:700;font-size:0.94rem;color:var(--primary);}
  .rev-badge{margin-left:auto;font-size:0.68rem;font-weight:700;color:var(--gold);border:1px solid var(--gold-line);border-radius:999px;padding:2px 9px;white-space:nowrap;}
  .rev-body{font-size:0.9rem;line-height:1.75;color:var(--text);}

  .state-box{text-align:center;padding:48px 24px;color:var(--text-light);}
  .state-box .state-icon{color:var(--text-light);margin-bottom:12px;display:flex;justify-content:center;}
  .state-box p{font-size:0.88rem;line-height:1.7;}
</style>
<!-- 로그인돼 있으면 이 화면으로 곧장 들어와도 알림 등록을 보충한다 (session-keep.js의 KWPush.ensure) -->
<script src="/session-keep.js?v=1"></script>
</head>
<body>

<div class="topbar">
  <a href="/portal" class="topbar-title">
    <span class="logo-mark"><img src="/icons/icon-192.png?v=6" alt="이관우 수학연구소"></span>
    <span>수업 &amp; 클리닉 총평</span>
  </a>
  <div class="kwnav kwnav--light" id="kwnav">
    <a class="kwnav-home" id="kwnavHome" href="/portal">🏠 홈</a>
    <div class="kwnav-mw">
      <button class="kwnav-toggle" type="button" id="kwnavToggle" aria-haspopup="true" aria-expanded="false">☰ 메뉴</button>
      <div class="kwnav-pop" id="kwnavPop" role="menu">
        <a role="menuitem" href="/report" data-p="/report">📋 수업·레포트</a>
        <a role="menuitem" href="/test-results" data-p="/test-results">📊 테스트 결과</a>
        <a role="menuitem" href="/attendance" data-p="/attendance">📅 출석 현황</a>
        <a role="menuitem" href="/materials" data-p="/materials">📚 수업 자료실</a>
        <a role="menuitem" href="/study" data-p="/study">🏆 KW-Study</a>
        <a role="menuitem" href="/reviews" data-p="/reviews">✏️ 수강 후기</a>
        <a role="menuitem" href="/homework" data-p="/homework">📸 과제 제출</a>
        <a role="menuitem" href="/qna" data-p="/qna">💬 질문/문의방</a>
        <a role="menuitem" href="/me" data-p="/me">🙋 내 정보</a>
      </div>
    </div>
  </div>
</div>

<div class="page">
  <!-- 자녀 선택 (학부모면 표시) -->
  <div id="childBar" class="child-bar" style="display:none;">
    <label>자녀 선택</label>
    <select id="childSelect" onchange="onChildChange()"></select>
  </div>

  <div class="intro">
    <h1><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4.5" width="12" height="16" rx="2"/><path d="M9 4.5V3.5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 3.5v1"/><path d="M9 11h6M9 15h4"/></svg>수업 &amp; 클리닉 총평</h1>
    <p>관우T가 보내드린 총평을 최신순으로 모았어요.</p>
  </div>

  <div id="content">
    <div class="state-box"><div class="state-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></div><p>총평을 불러오는 중...</p></div>
  </div>
</div>

<script>
  const TOKEN_KEY = 'kwmath_portal_token';
  const SEL_KEY   = 'kwmath_selected_student';

  let currentToken = '';
  let currentStudents = [];
  let selectedStudent = null;
  let allReviews = [];

  function $(id){ return document.getElementById(id); }
  function escapeHtml(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function authHeaders(){ return { 'Authorization': 'Bearer ' + currentToken }; }
  function redirectToPortal(){ window.location.replace('/portal'); }
  function nsid(v){ return String(v==null?'':v).trim().replace(/\.0+$/,''); }   // "24.0"→"24" 방어

  const WD = ['일','월','화','수','목','금','토'];

  function renderChildBar(){
    if (currentStudents.length > 1) {
      const sel = $('childSelect');
      sel.innerHTML = currentStudents.map((s,i) => '<option value="'+i+'">'+escapeHtml(s.name)+'</option>').join('');
      const idx = currentStudents.findIndex(s => selectedStudent && s.id === selectedStudent.id);
      sel.value = String(idx >= 0 ? idx : 0);
      $('childBar').style.display = 'flex';
    } else {
      $('childBar').style.display = 'none';
    }
  }

  function onChildChange(){
    const idx = parseInt($('childSelect').value, 10) || 0;
    selectedStudent = currentStudents[idx];
    sessionStorage.setItem(SEL_KEY, JSON.stringify(selectedStudent));
    renderReviews();
  }

  function renderReviews(){
    if (!selectedStudent) return;
    const mine = (allReviews || []).filter(r => nsid(r.studentId) === nsid(selectedStudent.id));
    if (!mine.length) {
      $('content').innerHTML = '<div class="state-box"><div class="state-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4.5" width="12" height="16" rx="2"/><path d="M9 4.5V3.5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 3.5v1"/><path d="M9 11h6M9 15h4"/></svg></div><p>아직 도착한 총평이 없습니다.<br>총평이 도착하면 이곳에 최신순으로 쌓여요.</p></div>';
      return;
    }
    const cards = mine.map(function(r){
      const dot = (r.date || '').replace(/-/g, '.');
      let wd = ''; try { const dt = new Date((r.date||'') + 'T00:00:00'); wd = WD[dt.getDay()] || ''; } catch (_) {}
      const body = escapeHtml(r.sentBody || '').replace(/\n/g, '<br>');
      return '<div class="rev-card">'
        + '<div class="rev-head"><span class="rev-date">' + escapeHtml(dot) + (wd ? (' (' + wd + ')') : '') + '</span>'
        + '<span class="rev-badge">' + escapeHtml(selectedStudent.name || '') + '</span></div>'
        + '<div class="rev-body">' + body + '</div>'
        + '</div>';
    }).join('');
    $('content').innerHTML = cards;
  }

  async function init(){
    // 🔑 2026-07-30 — 기기 신뢰 해제 시 포털이 sessionStorage에만 저장하므로 둘 다 본다 (홈 튕김 수정)
    currentToken = sessionStorage.getItem(TOKEN_KEY) || localStorage.getItem(TOKEN_KEY);
    if (!currentToken) return redirectToPortal();
    try {
      const [mRes, cRes] = await Promise.all([
        fetch('/api/auth/me', { headers: authHeaders() }),
        fetch('/api/clinic-review', { headers: authHeaders() }),
      ]);
      const mData = await mRes.json();
      if (!mRes.ok || !mData.ok) { localStorage.removeItem(TOKEN_KEY); return redirectToPortal(); }
      currentStudents = Array.isArray(mData.students) ? mData.students : [];
      if (!currentStudents.length) {
        $('content').innerHTML = '<div class="state-box"><div class="state-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5 2.8 19.5h18.4z"/><path d="M12 10.5v4M12 17.2h.01"/></svg></div><p>이 휴대폰에 연결된 학생이 없습니다.<br>관우T께 문의해주세요.</p></div>';
        return;
      }
      const saved = sessionStorage.getItem(SEL_KEY);
      if (saved) {
        try {
          const s = JSON.parse(saved);
          selectedStudent = currentStudents.find(x => x.id === s.id || x.name === s.name) || currentStudents[0];
        } catch (_) { selectedStudent = currentStudents[0]; }
      } else { selectedStudent = currentStudents[0]; }
      sessionStorage.setItem(SEL_KEY, JSON.stringify(selectedStudent));

      try { const cData = await cRes.json(); allReviews = (cData && Array.isArray(cData.reviews)) ? cData.reviews : []; } catch (_) { allReviews = []; }

      renderChildBar();
      renderReviews();
    } catch (e) {
      $('content').innerHTML = '<div class="state-box"><div class="state-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5 2.8 19.5h18.4z"/><path d="M12 10.5v4M12 17.2h.01"/></svg></div><p>총평을 불러오지 못했습니다.<br>잠시 후 다시 시도해주세요.</p></div>';
    }
  }

  document.addEventListener('DOMContentLoaded', init);
</script>

<script>
(function(){
  try{
    var path = (location.pathname || '').replace(/\.html$/,''); if(path.length > 1){ path = path.replace(/\/+$/,''); }
    var pop = document.getElementById('kwnavPop');
    if(pop){
      var links = pop.querySelectorAll('a[data-p]');
      for(var i=0;i<links.length;i++){
        if(links[i].getAttribute('data-p') === path){ links[i].className = 'cur'; links[i].removeAttribute('href'); }
      }
    }
    var tog = document.getElementById('kwnavToggle');
    if(tog && pop){
      tog.addEventListener('click', function(e){
        e.stopPropagation();
        var open = pop.classList.toggle('show');
        tog.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', function(ev){
        if(!pop.contains(ev.target) && ev.target !== tog){ pop.classList.remove('show'); tog.setAttribute('aria-expanded','false'); }
      });
    }
  }catch(_){}
})();
</script>
</body>
</html>
