<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>클리닉 명단 · 이관우 수학연구소</title>
<link rel="manifest" href="/manifest.json?v=3">
<meta name="theme-color" content="#862633">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--primary:#862633;--primary-light:#F9ECED;--ink:#1E1E1E;--muted:#777;--border:#EDE0E3;--bg:#FAF7F8;
    --clinic:#1f6f78;--clinic-light:#E3F1F2;--att:#1F7A33;--late:#B07A00;--abs:#B02347;}
  body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;word-break:keep-all;}
  .topbar{background:var(--primary);color:#fff;padding:max(14px,env(safe-area-inset-top,14px)) 18px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
  .topbar-title{font-size:0.95rem;font-weight:900;display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;}
  .topbar-btn{background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.28);color:#fff;padding:6px 12px;border-radius:8px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;}
  .page{max-width:640px;margin:0 auto;padding:20px 16px 80px;}

  .datebar{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 10px;margin-bottom:12px;gap:6px;}
  .datebar button{background:none;border:none;font-size:1.2rem;color:var(--primary);cursor:pointer;padding:2px 8px;font-family:inherit;}
  .datebar input[type=date]{border:1.5px solid var(--border);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:0.9rem;outline:none;}
  .datebar .today{font-size:0.76rem;font-weight:700;border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--muted);}

  /* 📌 2026-07-31 모델 반전 — "그날 클리닉 있는 반 전원 기본 포함, 뺄 사람만 고른다" */
  .note{background:var(--clinic-light);border:1px solid #CBE3E5;border-radius:11px;padding:9px 12px;margin-bottom:11px;
        font-size:0.78rem;line-height:1.55;color:#14545B;}
  .note b{font-weight:800;}

  .summary{display:flex;gap:6px;margin-bottom:12px;}
  .sbox{flex:1 1 0;min-width:0;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 5px;text-align:center;}
  .sbox .n{font-size:1.4rem;font-weight:900;}
  .sbox .l{font-size:0.7rem;color:var(--muted);margin-top:1px;white-space:nowrap;}
  .sbox.req .n{color:var(--primary);} .sbox.ok .n{color:var(--att);} .sbox.miss .n{color:var(--abs);}
  .sbox.ex .n{color:var(--muted);}

  /* 반별 묶음 — 전원 포함이라 목록이 길어진다. 반 단위로 접고 한 번에 빼기 위한 구조. */
  .grp{margin-bottom:16px;}
  .grp-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 2px 7px;}
  .grp-h .gt{font-weight:900;font-size:0.92rem;}
  .grp-h .gs{font-size:0.72rem;color:var(--muted);font-weight:700;}
  .grp-h .ga{margin-left:auto;display:flex;gap:5px;}
  .grp-h .pri-c{font-size:0.7rem;font-weight:800;color:var(--abs);background:#FBE6E6;padding:2px 8px;border-radius:9px;}

  .filterbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:0.8rem;color:var(--muted);}
  .filterbar label{display:flex;align-items:center;gap:5px;cursor:pointer;}

  .card{background:#fff;border:1px solid var(--border);border-radius:13px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .card.attended{opacity:0.62;}
  .card.pri{border-left:4px solid var(--abs);}                      /* 결석·지각·숙제 미흡 = 꼭 남겨야 할 학생 */
  .card.excluded{opacity:0.5;background:#FBFAFA;border-style:dashed;}
  .card.excluded .nm{text-decoration:line-through;color:var(--muted);}
  .card .main{flex:1;min-width:150px;}
  .card .nm{font-weight:800;font-size:1.0rem;}
  .card .cls{font-size:0.72rem;color:var(--primary);font-weight:700;background:var(--primary-light);padding:1px 8px;border-radius:9px;margin-left:6px;}
  .reasons{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;}
  .rb{font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:9px;background:#F2EDEE;color:var(--ink);}
  .rb.abs{background:#FBE6E6;color:var(--abs);} .rb.late{background:#FFF3DB;color:var(--late);}
  .rb.hw{background:var(--primary-light);color:var(--primary);} .rb.manual{background:var(--clinic-light);color:var(--clinic);}
  .status{font-size:0.82rem;font-weight:800;white-space:nowrap;}
  .status.ok{color:var(--att);} .status.miss{color:var(--abs);}
  .acts{display:flex;gap:6px;}
  button.mini{background:#fff;color:var(--muted);border:1px solid var(--border);border-radius:7px;padding:6px 11px;font-size:0.76rem;font-weight:700;cursor:pointer;font-family:inherit;}
  button.mini:hover{border-color:var(--primary);color:var(--primary);}
  button.mini.notify{color:var(--abs);border-color:#F0C9CF;}
  button.mini.notify:hover{border-color:var(--abs);background:#FBE6E6;color:var(--abs);}
  button.mini.back{color:var(--clinic);border-color:#BFDCDE;}
  button.mini.back:hover{border-color:var(--clinic);background:var(--clinic-light);color:var(--clinic);}

  .addbox{background:#fff;border:1px dashed var(--clinic);border-radius:12px;padding:12px 14px;margin-top:14px;}
  .addbox .h{font-weight:800;font-size:0.84rem;color:var(--clinic);margin-bottom:8px;}
  .addrow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .addrow input,.addrow select{border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:0.86rem;outline:none;background:#fff;color:var(--ink);}
  .addrow input:focus,.addrow select:focus{border-color:var(--clinic);}
  .addrow .nmin{flex:1;min-width:120px;} .addrow .rsn{flex:1;min-width:110px;}
  .addrow select{flex:1;min-width:104px;max-width:100%;}
  .addrow select:disabled{background:#F4F1F2;color:var(--muted);}
  .addrow button{background:var(--clinic);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:0.84rem;font-weight:700;cursor:pointer;font-family:inherit;}

  /* (.exbox/.exrow — 제외 학생 별도 상자는 2026-07-31에 없앴다. 이제 각 반 안에 흐리게 남는다.) */

  .empty{background:#fff;border:1px dashed var(--border);border-radius:13px;padding:34px 18px;text-align:center;color:var(--muted);font-size:0.9rem;line-height:1.7;}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(30,30,30,0.92);color:#fff;padding:11px 18px;border-radius:9px;font-size:0.84rem;font-weight:600;z-index:100;display:none;}
  .toast.show{display:block;}
  /* 상단 통합 네비 (홈 + 메뉴 드롭다운) */
  .kwnav{ display:flex; align-items:center; gap:8px; }
  .kwnav-home{ display:inline-flex; align-items:center; gap:5px; background:var(--primary); color:#fff; font-weight:800; font-size:0.84rem; text-decoration:none; padding:8px 13px; border-radius:9px; font-family:inherit; white-space:nowrap; line-height:1; }
  .kwnav-mw{ position:relative; }
  .kwnav-toggle{ display:inline-flex; align-items:center; gap:5px; background:#fff; color:var(--primary); border:1.5px solid var(--primary); font-weight:800; font-size:0.84rem; padding:6px 13px; border-radius:9px; cursor:pointer; font-family:inherit; white-space:nowrap; line-height:1.25; }
  .kwnav-pop{ position:absolute; right:0; top:calc(100% + 6px); background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,0.16); padding:6px; min-width:196px; z-index:200; display:none; }
  .kwnav-pop.show{ display:block; }
  .kwnav-pop a{ display:block; text-decoration:none; color:var(--ink); font-weight:700; font-size:0.86rem; padding:9px 12px; border-radius:8px; white-space:nowrap; }
  .kwnav-pop a:hover{ background:var(--primary-light); }
  .kwnav-pop a.cur{ background:var(--primary-light); color:var(--primary); cursor:default; }
  .kwnav-pop a.kwnav-logout{ color:var(--muted); border-top:1px solid var(--border); margin-top:4px; }
  .kwnav-pop a.kwnav-logout:hover{ background:#FBE6E6; color:#b3261e; }
  .kwnav--light .kwnav-home{ background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.28); color:#fff; }
  .kwnav--light .kwnav-toggle{ background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.28); color:#fff; }
</style>
<!-- 🔄 2026-07-29 원장·조교 로그인 유지(슬라이딩 갱신) 수신부 -->
<script src="/session-keep.js?v=1"></script>
</head>
<body>

<div class="topbar">
  <div class="topbar-title"><span>🩺 클리닉 명단</span></div>
  <div class="kwnav kwnav--light" id="kwnav">
    <a class="kwnav-home" id="kwnavHome" href="/staff-home">🏠 홈</a>
    <div class="kwnav-mw">
      <button class="kwnav-toggle" type="button" id="kwnavToggle" aria-haspopup="true" aria-expanded="false">☰ 메뉴</button>
      <div class="kwnav-pop" id="kwnavPop" role="menu">
        <a role="menuitem" href="/admin-qna" data-p="/admin-qna">💬 질문 답변</a>
        <a role="menuitem" href="/staff-students" data-p="/staff-students">🎓 학생</a>
        <a role="menuitem" href="/clinic-roster" data-p="/clinic-roster">🩺 클리닉 명단</a>
        <a role="menuitem" href="/clinic-review" data-p="/clinic-review">📝 클리닉 총평</a>
        <a role="menuitem" href="/admin-scores" data-p="/admin-scores">📈 성적</a>
        <a role="menuitem" href="/staff-reports" data-p="/staff-reports">📋 리포트</a>
        <a role="menuitem" href="/staff-materials" data-p="/staff-materials">📚 수업자료</a>
        <a role="menuitem" href="/admin-surveys" data-p="/admin-surveys">📝 테스트</a>
        <a role="menuitem" href="/staff-worklog" data-p="/staff-worklog">🗓️ 근무기록</a>
        <a role="menuitem" href="#" class="kwnav-logout" id="kwnavLogout">🚪 로그아웃</a>
      </div>
    </div>
  </div>
</div>

<div class="page">
  <div class="datebar">
    <button onclick="shiftDate(-1)">‹</button>
    <input type="date" id="datePick" onchange="onDateChange()">
    <button onclick="shiftDate(1)">›</button>
    <button class="today" onclick="goToday()">오늘</button>
  </div>

  <div class="note">
    <b>그날 클리닉이 있는 반은 전원 기본 포함</b>입니다. 안 와도 되는 학생만 <b>제외</b>해 주세요.<br>
    빨간 줄이 그어진 학생(결석·지각·숙제 미흡)은 되도록 남겨두세요.
  </div>

  <div class="summary" id="summary"></div>

  <div class="filterbar">
    <label><input type="checkbox" id="missOnly" onchange="renderList()"> 미참석만</label>
    <label><input type="checkbox" id="hideEx" onchange="renderList()"> 제외한 학생 숨기기</label>
    <span id="hint" style="margin-left:auto;font-size:0.72rem;"></span>
  </div>

  <div id="content"><div class="empty">불러오는 중…</div></div>

  <div class="addbox">
    <div class="h">➕ 수동 추가 (그날 클리닉 대상이 아닌 학생 넣기)</div>
    <div class="addrow">
      <select id="addAcad" onchange="onAcadChange()"><option value="">학원 선택…</option></select>
      <select id="addCls" onchange="onClsChange()"><option value="">반 선택…</option></select>
      <select id="addStu"><option value="">학원·반을 먼저 고르세요</option></select>
    </div>
    <div class="addrow" style="margin-top:8px;">
      <input class="rsn" id="addReason" placeholder="사유 (선택)">
      <button onclick="doAdd()">추가</button>
    </div>
  </div>

  <!-- 제외한 학생은 별도 상자로 빼지 않고 각자 반 안에 흐리게 남긴다(어느 반에서 뺐는지가 바로 보이게). -->
</div>

<div class="toast" id="toast"></div>

<script>
  function readToken(){
    var keys = ['kwmath_admin_token','kwmath_admin_pw'];
    for (var i=0;i<keys.length;i++){
      var v = sessionStorage.getItem(keys[i]) || localStorage.getItem(keys[i]);
      if (v) return v;
    }
    return '';
  }
  var token = readToken();
  if(!token){ location.replace('/portal?next=/clinic-roster'); }

  var roster = [], excluded = [], allStudents = [];
  var isOwner = false;   // 원장만 true(서버 clinic-roster GET). 조교앱에서는 학부모 클리닉결석 알림 발송 버튼을 숨김.
  var threshold = 50;    // 숙제 이 % 이하면 ⚠️ 우선 (서버가 내려줌)
  var clinicClasses = null;      // 🩺 클리닉 시간이 설정된 반 수(서버가 내려줌). null=아직 모름
  var schedulesFailed = false;   // 반 시간표 로드 실패 — 빈 명단의 원인을 구분해 안내하려고 받는다
  var _groups = [];      // renderList가 만드는 반별 묶음 — '반 전체 제외' 버튼이 인덱스로 참조한다
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  // onclick="doX('...')" 속성 안에 들어가는 JS 문자열 인자.
  //   이름·반에 ' " \ < 가 있어도 안 깨지게 JS 이스케이프 → HTML 이스케이프 순으로 처리한다.
  //   (예전엔 작은따옴표만 바꿔서, 큰따옴표가 든 이름이면 onclick 속성 자체가 끊겼다)
  function jsArg(s){
    return String(s==null?'':s)
      .replace(/\\/g,'\\\\').replace(/'/g,"\\'")
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function showToast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},2400); }

  function pad(n){ return ('0'+n).slice(-2); }
  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  var viewDate = todayStr();

  async function api(path, opts){
    opts=opts||{}; opts.headers=opts.headers||{};
    if(token) opts.headers['Authorization']='Bearer '+token;
    opts.credentials='same-origin';
    var r=await fetch(path,opts);
    if(r.status===401){ location.replace('/portal?next=/clinic-roster'); throw new Error('401'); }
    return r;
  }

  function shiftDate(delta){
    var d=new Date(viewDate+'T00:00:00'); d.setDate(d.getDate()+delta);
    viewDate=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    $('datePick').value=viewDate; load();
  }
  function onDateChange(){ var v=$('datePick').value; if(v){ viewDate=v; load(); } }
  function goToday(){ viewDate=todayStr(); $('datePick').value=viewDate; load(); }

  function attended(cs){ return cs==='출석' || cs==='지각'; }

  function reasonBadges(reasons){
    return (reasons||[]).map(function(rz){
      var cls='rb';
      if(rz==='결석') cls='rb abs';
      else if(rz==='지각') cls='rb late';
      else if(rz.indexOf('숙제')===0) cls='rb hw';
      else if(rz.indexOf('수동')===0) cls='rb manual';
      return '<span class="'+cls+'">'+esc(rz)+'</span>';
    }).join('');
  }

  // isEx=true → 제외된 학생. 별도 상자로 빼지 않고 원래 반 자리에 흐리게 남긴다(어느 반에서 뺐는지 바로 보이게).
  function cardHtml(e, isEx){
    var sid = jsArg(e.studentId), nm = jsArg(e.name);
    if(isEx){
      return ''+
      '<div class="card excluded">'+
        '<div class="main">'+
          '<span class="nm">'+esc(e.name)+'</span>'+nmeta_line(e)+
          '<div class="reasons"><span class="rb">클리닉 제외</span></div>'+
        '</div>'+
        '<div class="acts"><button class="mini back" onclick="doClear(\''+sid+'\',\''+nm+'\')">↩︎ 되돌리기</button></div>'+
      '</div>';
    }
    var did = attended(e.clinicStatus);
    var statusHtml = did
      ? '<span class="status ok">✅ 참석'+(e.clinicStatus==='지각'?'(지각)':'')+'</span>'
      : '<span class="status miss">⚠️ 미참석</span>';
    return ''+
    '<div class="card'+(did?' attended':'')+(e.priority?' pri':'')+'">'+
      '<div class="main">'+
        '<span class="nm">'+esc(e.name)+'</span>'+
        (nmeta_line(e))+
        ((e.reasons&&e.reasons.length)?'<div class="reasons">'+reasonBadges(e.reasons)+'</div>':'')+
      '</div>'+
      statusHtml+
      '<div class="acts">'+
        ((did||!isOwner)?'':'<button class="mini notify" onclick="doNotify(\''+sid+'\',\''+nm+'\')">📞 연락</button>')+
        '<button class="mini" onclick="doExclude(\''+sid+'\',\''+nm+'\')">제외</button>'+
      '</div>'+
    '</div>';
  }
  function nmeta_line(e){ return e.grade?('<span style="font-size:0.74rem;color:var(--muted);margin-left:6px;">'+esc(e.grade)+'</span>'):''; }

  function renderSummary(){
    var req=roster.length, ok=roster.filter(function(e){return attended(e.clinicStatus);}).length;
    var miss=req-ok;
    $('summary').innerHTML =
      '<div class="sbox req"><div class="n">'+req+'</div><div class="l">대상</div></div>'+
      '<div class="sbox ok"><div class="n">'+ok+'</div><div class="l">참석</div></div>'+
      '<div class="sbox miss"><div class="n">'+miss+'</div><div class="l">미참석</div></div>'+
      '<div class="sbox ex"><div class="n">'+excluded.length+'</div><div class="l">제외</div></div>';
  }

  // 전원 기본 포함이라 목록이 길다 → 학원·반으로 묶어야 훑고 뺄 수 있다.
  function buildGroups(){
    var map={}, list=[];
    function push(e,isEx){
      // 학원+반 합친 키. 반 이름에 '/'나 '|'가 들어갈 수 있어서(예: "반이름에 / 슬래시")
      // 학원 이름 길이를 앞에 붙여 절대 겹치지 않게 만든다. 제어문자를 파일에 직접 넣지 않는다.
      var _a=(e.academy||''), _c=(e.className||'');
      var k=_a.length+':'+_a+_c, g=map[k];
      if(!g){ g=map[k]={academy:e.academy||'', className:e.className||'', inc:[], exc:[]}; list.push(g); }
      (isEx?g.exc:g.inc).push(e);
    }
    roster.forEach(function(e){ push(e,false); });
    excluded.forEach(function(e){ push(e,true); });
    list.sort(function(a,b){
      return String(a.academy).localeCompare(String(b.academy),'ko')
          || String(a.className).localeCompare(String(b.className),'ko');
    });
    return list;
  }

  function renderList(){
    renderSummary();
    var missOnly=$('missOnly').checked, hideEx=$('hideEx').checked;
    _groups=buildGroups();
    if(!roster.length && !excluded.length){
      // 빈 명단의 원인이 셋인데 화면에서는 똑같이 "아무도 없음"으로 보인다 → 원인별로 다르게 말해 준다.
      var msg;
      if(schedulesFailed){
        msg='반 시간표를 불러오지 못했어요. 새로고침해 보시고, 계속 그러면 알려주세요.'
          + '<br><span style="font-size:0.78rem;">(명단이 빈 게 아니라 판정 근거를 못 읽은 상태입니다.)</span>';
      }else if(clinicClasses===0){
        msg='아직 🩺 클리닉 시간이 설정된 반이 없어요.'
          + '<br><span style="font-size:0.78rem;">관리자 → 🏫 학원·반 관리에서 클리닉 하는 반에 🩺 클리닉 시간을 넣어 주세요. 넣으면 그 요일에 반 전원이 자동으로 뜹니다.</span>';
      }else{
        msg='이 날짜엔 클리닉이 없어요.'
          + '<br><span style="font-size:0.78rem;">'
          + (typeof clinicClasses==='number' ? '클리닉 시간이 설정된 반 '+clinicClasses+'개 중 오늘 해당하는 반이 없습니다. ' : '')
          + '아래에서 학생을 직접 추가할 수는 있어요.</span>';
      }
      $('content').innerHTML='<div class="empty">'+msg+'</div>';
      $('hint').textContent='';
      return;
    }
    var html='';
    for(var i=0;i<_groups.length;i++){
      var g=_groups[i];
      var inc=g.inc.filter(function(e){ return missOnly ? !attended(e.clinicStatus) : true; });
      var exc=hideEx?[]:g.exc;
      if(!inc.length && !exc.length) continue;
      var pri=g.inc.filter(function(e){ return e.priority; }).length;
      html += '<div class="grp">'+
        '<div class="grp-h">'+
          '<span class="gt">'+esc(g.className||'(반 없음)')+'</span>'+
          '<span class="gs">'+esc(g.academy||'(미지정)')+' · '+g.inc.length+'명'+(g.exc.length?' · 제외 '+g.exc.length:'')+'</span>'+
          (pri?'<span class="pri-c">⚠️ 우선 '+pri+'</span>':'')+
          '<span class="ga">'+
            (g.inc.length?'<button class="mini" onclick="bulkGroup('+i+',\'exclude\')">반 전체 제외</button>':'')+
            (g.exc.length?'<button class="mini back" onclick="bulkGroup('+i+',\'clear\')">전체 되돌리기</button>':'')+
          '</span>'+
        '</div>'+
        inc.map(function(e){ return cardHtml(e,false); }).join('')+
        exc.map(function(e){ return cardHtml(e,true); }).join('')+
      '</div>';
    }
    if(!html) html='<div class="empty">'+(missOnly?'미참석 학생이 없어요. 모두 클리닉에 왔어요! 🎉':'표시할 학생이 없어요.')+'</div>';
    $('content').innerHTML=html;
    $('hint').textContent='결석·지각·숙제 '+threshold+'% 이하 = ⚠️ 우선';
  }

  async function load(){
    $('content').innerHTML='<div class="empty">불러오는 중…</div>';
    try{
      var r=await api('/api/clinic-roster?date='+encodeURIComponent(viewDate));
      var j=await r.json();
      roster=(j&&j.roster)||[]; excluded=(j&&j.excluded)||[];
      isOwner=!!(j&&j.isOwner);
      if(j && typeof j.threshold==='number') threshold=j.threshold;
      clinicClasses=(j && typeof j.clinicClasses==='number') ? j.clinicClasses : null;
      schedulesFailed=!!(j&&j.schedulesFailed);
      renderList();
    }catch(e){ if(String(e.message)!=='401') $('content').innerHTML='<div class="empty">명단을 불러오지 못했어요.</div>'; }
  }

  async function loadStudents(){
    try{
      var r=await api('/api/students'); var j=await r.json();
      allStudents=Array.isArray(j)?j:[];
      buildAcadSelect();
    }catch(e){}
  }

  // 학원 → 반 → 학생 캐스케이드 (다른 관리 화면과 동일). 빈 학원/반은 '(미지정)'·'(반 없음)'으로 묶어 누락 방지.
  var ACAD_NONE='(미지정)', CLS_NONE='(반 없음)';
  function acadOf(s){ return (String(s.academy||'').trim())||ACAD_NONE; }
  function clsOf(s){ return (String(s.className||'').trim())||CLS_NONE; }
  function buildAcadSelect(){
    var seen={}, list=[];
    allStudents.forEach(function(s){ var a=acadOf(s); if(!seen[a]){ seen[a]=1; list.push(a); } });
    list.sort(function(a,b){ return a.localeCompare(b,'ko'); });
    $('addAcad').innerHTML='<option value="">학원 선택…</option>'+
      list.map(function(a){ return '<option value="'+esc(a)+'">'+esc(a)+'</option>'; }).join('');
    buildClsSelect();
  }
  function buildClsSelect(){
    var acad=$('addAcad').value, seen={}, list=[];
    if(acad){
      allStudents.forEach(function(s){ if(acadOf(s)===acad){ var c=clsOf(s); if(!seen[c]){ seen[c]=1; list.push(c); } } });
      list.sort(function(a,b){ return a.localeCompare(b,'ko'); });
    }
    $('addCls').innerHTML='<option value="">반 선택…</option>'+
      list.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join('');
    buildStuSelect();
  }
  function buildStuSelect(){
    var acad=$('addAcad').value, cls=$('addCls').value;
    var list=(acad&&cls)?allStudents.filter(function(s){ return acadOf(s)===acad&&clsOf(s)===cls; }):[];
    list.sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','ko'); });
    $('addStu').innerHTML='<option value="">'+(acad&&cls?'학생 선택…':'학원·반을 먼저 고르세요')+'</option>'+
      list.map(function(s){ return '<option value="'+esc(String(s.id==null?'':s.id))+'">'+esc(s.name||'')+'</option>'; }).join('');
  }
  function onAcadChange(){ buildClsSelect(); }
  function onClsChange(){ buildStuSelect(); }

  async function post(studentId, action, reason, name){
    var body={date:viewDate, action:action};
    if(studentId) body.studentId=String(studentId);   // id 우선(동명이인 안전)
    if(name) body.name=name;                            // 폴백
    if(reason) body.reason=reason;
    try{
      var r=await api('/api/clinic-roster',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      var j=await r.json().catch(function(){return {};});
      if(!r.ok){ showToast(j.error||'저장에 실패했어요.'); return false; }
      return true;
    }catch(e){ if(String(e.message)!=='401') showToast('저장 중 오류가 났어요.'); return false; }
  }

  async function doNotify(sid, name){
    try{
      var r=await api('/api/notifications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create',type:'clinic_absent',id:sid,date:viewDate})});
      var j=await r.json().catch(function(){return {};});
      if(!r.ok){ showToast(j.error||'연락에 실패했어요.'); return; }
      if(j.created===false){ showToast(name+' 학부모님께 이미 연락했어요.'); }
      else { showToast('📨 '+name+' 학부모님께 미참석 연락을 보냈어요.'); }
    }catch(e){ if(String(e.message)!=='401') showToast('연락 중 오류가 났어요.'); }
  }
  async function doExclude(sid, name){ if(await post(sid,'exclude','',name)){ showToast(name+' 제외했어요.'); load(); } }
  async function doClear(sid, name){ if(await post(sid,'clear','',name)){ showToast(name+' 되돌렸어요.'); load(); } }

  // ── 반 단위 일괄 (전원 기본 포함이라 한 명씩 빼면 오히려 더 번거로움) ──
  //   서버 POST가 studentIds 배열을 받는다. 요청 1번으로 반 전체를 처리.
  async function postBulk(ids, action){
    try{
      var r=await api('/api/clinic-roster',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({date:viewDate, action:action, studentIds:ids})});
      var j=await r.json().catch(function(){return {};});
      if(!r.ok){ showToast(j.error||'저장에 실패했어요.'); return null; }
      return j;
    }catch(e){ if(String(e.message)!=='401') showToast('저장 중 오류가 났어요.'); return null; }
  }
  async function bulkGroup(i, action){
    var g=_groups[i]; if(!g) return;
    var src=(action==='clear')?g.exc:g.inc;
    var ids=src.map(function(e){ return String(e.studentId==null?'':e.studentId); }).filter(Boolean);
    if(!ids.length) return;
    var label=(g.academy?g.academy+' ':'')+(g.className||'(반 없음)');
    if(action==='exclude' && !confirm(label+' 학생 '+ids.length+'명을 '+viewDate+' 클리닉 명단에서 모두 뺄까요?\n\n(되돌릴 수 있어요 — 이 날짜에만 적용됩니다)')) return;
    var j=await postBulk(ids, action);
    if(!j) return;
    showToast(label+' '+(j.done||0)+'명 '+(action==='exclude'?'제외했어요.':'되돌렸어요.')
      + ((j.skipped)?(' (건너뜀 '+j.skipped+')'):''));
    load();
  }
  async function doAdd(){
    var sid=($('addStu').value||'').trim();
    if(!sid){ showToast('학원·반·학생을 골라주세요.'); return; }
    var st=allStudents.filter(function(s){ return String(s.id)===sid; })[0];
    var name=st?(st.name||''):'';
    var reason=($('addReason').value||'').trim();
    if(await post(sid,'add',reason,name)){ showToast((name||'학생')+' 추가했어요.'); $('addStu').value=''; $('addReason').value=''; load(); }
  }

  $('datePick').value=viewDate;
  loadStudents();
  load();
  ('serviceWorker' in navigator) && navigator.serviceWorker.register('/sw.js').catch(function(){});
</script>
<!-- 조교/원장 공통 상단 네비: 홈(역할별) + 메뉴 드롭다운 -->
<script>
(function(){
  try{
    var pw = sessionStorage.getItem('kwmath_admin_pw') || localStorage.getItem('kwmath_admin_pw') || '';
    var home = /^ast_/.test(pw) ? '/staff-home' : '/admin';
    var h = document.getElementById('kwnavHome'); if(h){ h.setAttribute('href', home); }
    var tt = document.getElementById('kwnavTitleHome'); if(tt){ tt.setAttribute('href', home); }
    var path = (location.pathname || '').replace(/\.html$/,''); if(path.length > 1){ path = path.replace(/\/+$/,''); }
    var pop = document.getElementById('kwnavPop');
    if(pop){
      var links = pop.querySelectorAll('a[data-p]');
      for(var i=0;i<links.length;i++){
        if(links[i].getAttribute('data-p') === path){ links[i].className = 'cur'; links[i].removeAttribute('href'); }
      }
    }
    var tog = document.getElementById('kwnavToggle');
    if(tog && pop){
      tog.addEventListener('click', function(e){
        e.stopPropagation();
        var open = pop.classList.toggle('show');
        tog.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', function(ev){
        if(!pop.contains(ev.target) && ev.target !== tog){ pop.classList.remove('show'); tog.setAttribute('aria-expanded','false'); }
      });
    }
    var lo = document.getElementById('kwnavLogout');
    if(lo){
      lo.addEventListener('click', function(e){
        e.preventDefault();
        try{ sessionStorage.removeItem('kwmath_admin_pw'); localStorage.removeItem('kwmath_admin_pw'); localStorage.removeItem('kwmath_admin_token'); }catch(_){}
        location.href = '/portal';
      });
    }
  }catch(_){}
})();
</script>
