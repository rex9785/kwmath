<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>출석 | 이관우 수학연구소</title>
<link rel="manifest" href="/manifest.json?v=3">
<meta name="theme-color" content="#862633">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=6">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;600;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--primary:#862633;--primary-light:#F9ECED;--primary-mid:#A83040;--text:#241318;--text-light:#9A8C85;--bg:#FFF;--bg2:#FAF9F6;--border:#E9E1D9;--hairline:#F1EAE2;--gold:#A8863D;--gold-line:#DEC98F;--gold-bright:#E3B655;--serif:'Noto Serif KR',serif;
    --att:#1F7A33;--late:#B07A00;--abs:#B02347;--sick:#5060B0;--off:#6A6A6A;--clinic:#1f6f78;--clinic-light:#E3F1F2;}
  body{font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif;letter-spacing:-0.01em;color:var(--text);background:var(--bg2);min-height:100vh;word-break:keep-all;overflow-wrap:break-word;line-break:strict;}
  .topbar{background:var(--primary);color:#fff;padding:max(14px,env(safe-area-inset-top,14px)) 20px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
  .topbar-title{font-size:0.95rem;font-weight:900;letter-spacing:-0.3px;display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;}
  .topbar-title .logo-mark{display:inline-flex;align-items:center;justify-content:center;width:30px;height:26px;background:#fff;border-radius:6px;overflow:hidden;padding:0;}
  .topbar-title .logo-mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .topbar-btn{background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.28);color:#fff;padding:6px 12px;border-radius:8px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;}
  /* 상단 통합 네비 (홈 + 메뉴 드롭다운) */
  .kwnav{ display:flex; align-items:center; gap:8px; }
  .kwnav-home{ display:inline-flex; align-items:center; gap:5px; background:var(--primary); color:#fff; font-weight:800; font-size:0.84rem; text-decoration:none; padding:8px 13px; border-radius:9px; font-family:inherit; white-space:nowrap; line-height:1; }
  .kwnav-mw{ position:relative; }
  .kwnav-toggle{ display:inline-flex; align-items:center; gap:5px; background:#fff; color:var(--primary); border:1.5px solid var(--primary); font-weight:800; font-size:0.84rem; padding:6px 13px; border-radius:9px; cursor:pointer; font-family:inherit; white-space:nowrap; line-height:1.25; }
  .kwnav-pop{ position:absolute; right:0; top:calc(100% + 6px); background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,0.16); padding:6px; min-width:200px; z-index:200; display:none; }
  .kwnav-pop.show{ display:block; }
  .kwnav-pop a{ display:block; text-decoration:none; color:var(--text); font-weight:700; font-size:0.86rem; padding:9px 12px; border-radius:8px; white-space:nowrap; }
  .kwnav-pop a:hover{ background:var(--primary-light); }
  .kwnav-pop a.cur{ background:var(--primary-light); color:var(--primary); cursor:default; }
  .kwnav--light .kwnav-home{ background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.28); color:#fff; }
  .kwnav--light .kwnav-toggle{ background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.28); color:#fff; }

  .page{max-width:640px;margin:0 auto;padding:24px 18px 80px;}

  .student-bar{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .student-bar .info{font-size:0.92rem;font-weight:700;color:var(--text);}
  .student-bar .info .meta{display:block;font-size:0.75rem;font-weight:500;color:var(--text-light);margin-top:2px;}
  .student-bar select{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:0.85rem;font-family:inherit;background:#fff;outline:none;}

  /* 수업/클리닉 전환 */
  .modebar{display:flex;gap:8px;margin-bottom:14px;}
  .modebtn{flex:1;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px;font-size:0.88rem;font-weight:700;color:var(--text-light);cursor:pointer;font-family:inherit;}
  .modebtn.on{border-color:var(--primary);background:var(--primary-light);color:var(--primary);}
  .modebtn[data-mode="clinic"].on{border-color:var(--clinic);background:var(--clinic-light);color:var(--clinic);}
  .cli-stat{background:#fff;border:1.5px solid var(--clinic);grid-column:span 4;padding:10px 14px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;}
  .cli-stat .lbl{font-size:0.78rem;color:var(--clinic);font-weight:700;}
  .cli-stat .val{font-size:1.05rem;font-weight:900;color:var(--clinic);font-family:var(--serif);}
  .cli-stat .sub{font-size:0.7rem;color:var(--text-light);}

  /* 월간 요약 카드 */
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
  .stat-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;}
  .stat-num{font-size:1.4rem;font-weight:900;font-family:var(--serif);}
  .stat-label{font-size:0.72rem;color:var(--text-light);margin-top:2px;}

  /* 월 선택 헤더 */
  .month-nav{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:14px;}
  .month-nav button{background:none;border:none;font-size:1.2rem;color:var(--primary);cursor:pointer;padding:4px 10px;font-family:inherit;}
  .month-label{font-size:1rem;font-weight:800;color:var(--text);font-family:var(--serif);}

  /* 캘린더 */
  .calendar{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;overflow:hidden;}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
  .cal-week .dow{text-align:center;font-size:0.74rem;font-weight:700;color:var(--text-light);padding:4px 0;}
  .cal-week .dow.sun{color:var(--abs);}
  .cal-week .dow.sat{color:#3a6fb0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-cell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:0.78rem;border:1px solid transparent;background:var(--bg2);position:relative;}
  .cal-cell.empty{background:transparent;}
  .cal-cell .d{font-weight:700;color:var(--text);}
  .cal-cell .s{font-size:0.62rem;margin-top:2px;font-weight:700;}
  .cal-cell.today{border-color:var(--primary);}
  .cal-cell.att{background:#E5F5E8;}.cal-cell.att .s{color:var(--att);}
  .cal-cell.late{background:#FFF4D6;}.cal-cell.late .s{color:var(--late);}
  .cal-cell.abs{background:#FBE5E9;}.cal-cell.abs .s{color:var(--abs);}
  .cal-cell.sick{background:#E8ECFB;}.cal-cell.sick .s{color:var(--sick);}
  .cal-cell.off{background:#EDEDED;}.cal-cell.off .s{color:var(--off);}

  .cal-cell .hw{position:absolute;top:2px;right:3px;font-size:0.55rem;font-weight:800;color:var(--primary);background:#fff;border:1px solid var(--primary);border-radius:6px;padding:0 4px;line-height:1.2;}
  /* 🎬 인강 표시 — 좌상단. 숙제 배지(.hw)는 우상단이라 겹치지 않는다. */
  .cal-cell .mk{position:absolute;top:2px;left:3px;font-size:0.6rem;line-height:1.2;}
  .cal-cell.mk-can{cursor:pointer;}
  .cal-cell.mk-can:active{transform:scale(0.95);}
  .cal-cell.hw-0{box-shadow:inset 0 -3px 0 #c0392b;}
  .cal-cell.hw-25{box-shadow:inset 0 -3px 0 #e67e22;}
  .cal-cell.hw-50{box-shadow:inset 0 -3px 0 #f1c40f;}
  .cal-cell.hw-75{box-shadow:inset 0 -3px 0 #27ae60;}
  .cal-cell.hw-100{box-shadow:inset 0 -3px 0 #1F7A33;}
  .hw-stat{background:#fff;border:1.5px solid var(--primary);grid-column:span 4;padding:10px 14px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;}
  .hw-stat .lbl{font-size:0.78rem;color:var(--primary);font-weight:700;}
  .hw-stat .val{font-size:1.1rem;font-weight:900;color:var(--primary);font-family:var(--serif);}
  .hw-stat .sub{font-size:0.7rem;color:var(--text-light);}

  .legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;font-size:0.76rem;color:var(--text-light);justify-content:center;}
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;}

  .empty-state{background:#fff;border:1px dashed var(--border);border-radius:14px;padding:36px 18px;text-align:center;color:var(--text-light);font-size:0.88rem;line-height:1.7;}
</style>
<!-- 로그인돼 있으면 이 화면으로 곧장 들어와도 알림 등록을 보충한다 (session-keep.js의 KWPush.ensure) -->
<script src="/session-keep.js?v=1"></script>
</head>
<body>

<div class="topbar">
  <a href="/portal" class="topbar-title">
    <span class="logo-mark"><img src="/icons/icon-192.png?v=6" alt="이관우 수학연구소"></span>
    <span>출석 현황</span>
  </a>
  <div class="kwnav kwnav--light" id="kwnav">
    <a class="kwnav-home" id="kwnavHome" href="/portal">🏠 홈</a>
    <div class="kwnav-mw">
      <button class="kwnav-toggle" type="button" id="kwnavToggle" aria-haspopup="true" aria-expanded="false">☰ 메뉴</button>
      <div class="kwnav-pop" id="kwnavPop" role="menu">
        <a role="menuitem" href="/report" data-p="/report">📋 수업·레포트</a>
        <a role="menuitem" href="/test-results" data-p="/test-results">📊 테스트 결과</a>
        <a role="menuitem" href="/attendance" data-p="/attendance">📅 출석 현황</a>
        <a role="menuitem" href="/materials" data-p="/materials">📚 수업 자료실</a>
        <a role="menuitem" href="/study" data-p="/study">🏆 KW-Study</a>
        <a role="menuitem" href="/reviews" data-p="/reviews">✏️ 수강 후기</a>
        <a role="menuitem" href="/homework" data-p="/homework">📸 과제 제출</a>
        <a role="menuitem" href="/qna" data-p="/qna">💬 질문/문의방</a>
        <a role="menuitem" href="/me" data-p="/me">🙋 내 정보</a>
      </div>
    </div>
  </div>
</div>

<div class="page">
  <div id="loading" class="empty-state">불러오는 중...</div>

  <div id="content" style="display:none;">
    <div class="student-bar">
      <div class="info" id="studentInfo"></div>
      <select id="childSelect" style="display:none;" onchange="onChildChange()"></select>
    </div>

    <div class="modebar">
      <button class="modebtn on" data-mode="class" onclick="setMode('class')">수업 출결</button>
      <button class="modebtn" data-mode="clinic" onclick="setMode('clinic')">클리닉</button>
    </div>

    <div class="summary" id="summary"></div>

    <div class="month-nav">
      <button onclick="prevMonth()">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button onclick="nextMonth()">›</button>
    </div>

    <div class="calendar">
      <div class="cal-week">
        <div class="dow sun">일</div><div class="dow">월</div><div class="dow">화</div>
        <div class="dow">수</div><div class="dow">목</div><div class="dow">금</div><div class="dow sat">토</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="legend">
        <span><span class="dot" style="background:#E5F5E8;"></span>출석</span>
        <span><span class="dot" style="background:#FFF4D6;"></span>지각</span>
        <span><span class="dot" style="background:#FBE5E9;"></span>결석</span>
        <span><span class="dot" style="background:#E8ECFB;"></span>병결</span>
        <span><span class="dot" style="background:#EDEDED;"></span>공결</span>
        <span id="legendHint" style="width:100%;text-align:center;color:var(--text-light);font-size:0.7rem;margin-top:4px;">하단 색띠 = 숙제 완료율 (빨강 0% → 초록 100%)</span>
      </div>
    </div>

    <!-- 🎬 이 달 인강 — "언제 못 왔고, 그날 영상이 열렸나"를 글로도 남긴다.
         캘린더 배지만으로는 지난 달을 훑기 어렵고, 학부모가 보기에도 이 목록이 분명하다. -->
    <div id="mkPanel" style="display:none;background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-top:14px;"></div>
  </div>
</div>

<script>
  const TOKEN_KEY = 'kwmath_portal_token';
  let token = '';
  try { token = sessionStorage.getItem(TOKEN_KEY) || localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
  if (!token) { location.replace('/portal?next=/attendance'); }

  let students = [];
  let selected = null;
  let viewMonth = new Date(); viewMonth.setDate(1);
  let allRecords = {};
  let mode = 'class';   // 'class'(수업 출결) | 'clinic'(클리닉)

  // 🎬 인강 — 결석·병결·공결인 날은 그날 수업영상·수업자료가 잠긴다(2026-07-21 정책B).
  //   신청하면 requested, 선생님이 승인하면 approved 가 되어 열린다.
  //   ⚠️ BLOCK_ST 는 서버 _makeup.js 의 BLOCK_STATUS 와 같은 목록이어야 한다. 여기만 고치면 화면과 실제가 어긋난다.
  let grants = {};                                    // { 'YYYY-MM-DD': 'requested' | 'approved' }
  const BLOCK_ST = { '결석': 1, '병결': 1, '공결': 1 };
  function isDateStr(d){ return /^\d{4}-\d{2}-\d{2}$/.test(String(d || '')); }

  function setMode(md){
    if (mode === md) return;
    mode = md;
    document.querySelectorAll('.modebtn').forEach(function(b){ b.classList.toggle('on', b.dataset.mode === mode); });
    loadRecords();
  }

  async function loadMe() {
    try {
      const res = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        try { localStorage.removeItem(TOKEN_KEY); } catch(e){}
        location.replace('/portal?next=/attendance');
        return;
      }
      students = Array.isArray(data.students) ? data.students : [];
      if (!students.length) {
        document.getElementById('loading').textContent = '연결된 학생이 없습니다.';
        return;
      }
      let initIdx = 0;
      try {
        const saved = JSON.parse(sessionStorage.getItem('kwmath_selected_student') || 'null');
        if (saved && saved.name) {
          const i = students.findIndex(s => s.name === saved.name);
          if (i >= 0) initIdx = i;
        }
      } catch(e){}
      selected = students[initIdx];
      renderStudentBar(initIdx);
      await loadRecords();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    } catch (e) {
      document.getElementById('loading').textContent = '오류: ' + e.message;
    }
  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function renderStudentBar(idx) {
    const s = students[idx];
    document.getElementById('studentInfo').innerHTML =
      esc(s.name) + ' 학생' + (s.school ? ' <span class="meta">' + esc(s.school) + (s.grade ? ' · ' + esc(s.grade) : '') + (s.className ? ' / ' + esc(s.className) : '') + '</span>' : '');
    const sel = document.getElementById('childSelect');
    if (students.length > 1) {
      sel.innerHTML = students.map(function(st, i) { return '<option value="' + i + '"' + (i === idx ? ' selected' : '') + '>' + esc(st.name) + '</option>'; }).join('');
      sel.style.display = 'inline-block';
    }
  }

  function onChildChange() {
    const idx = parseInt(document.getElementById('childSelect').value, 10) || 0;
    selected = students[idx];
    sessionStorage.setItem('kwmath_selected_student', JSON.stringify(selected));
    renderStudentBar(idx);
    loadRecords();
  }

  async function loadRecords() {
    const ep = mode === 'clinic' ? '/api/clinic' : '/api/attendance';
    try {
      const res = await fetch(ep + '?name=' + encodeURIComponent(selected.name), {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      allRecords = (data && data.records) || {};
    } catch (e) {
      allRecords = {};
    }
    await loadGrants();
    renderMonth();
  }

  // 인강 신청/해제 현황. 클리닉엔 인강이 없다(잠금 판정은 수업 출결만 본다).
  //   ?name= 은 서버(_auth.requireStudentAccess)가 받아 준다 — 자녀가 둘이어도 고른 아이 것만 온다.
  async function loadGrants() {
    grants = {};
    if (mode === 'clinic') return;
    try {
      const res = await fetch('/api/makeup?name=' + encodeURIComponent(selected.name), {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const j = await res.json();
      const arr = (j && Array.isArray(j.grants)) ? j.grants : [];
      arr.forEach(function(g){ if (g && isDateStr(g.date)) grants[g.date] = g.status; });
    } catch (e) { /* 인강을 못 불러와도 출결 달력은 그대로 보여준다 */ }
  }

  // 잠긴 날짜를 눌러 인강 신청. 승인은 선생님이 한다(여기서 바로 열리지 않는다).
  async function askMakeup(date) {
    if (!selected || !isDateStr(date)) return;
    if (!confirm(date + ' 인강을 신청할까요?\n선생님이 승인하면 그날 수업영상과 수업자료가 열립니다.')) return;
    try {
      const res = await fetch('/api/makeup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ name: selected.name, date: date })
      });
      const j = await res.json();
      if (!res.ok || !j.ok) { alert((j && j.error) || '신청에 실패했습니다.'); return; }
      grants[date] = j.status || 'requested';
      renderMonth();
      alert(j.status === 'approved' ? '이미 열려 있는 날짜입니다.' : '인강을 신청했습니다. 승인되면 영상이 열립니다.');
    } catch (e) { alert('신청에 실패했습니다.'); }
  }

  function prevMonth() { viewMonth.setMonth(viewMonth.getMonth() - 1); renderMonth(); }
  function nextMonth() { viewMonth.setMonth(viewMonth.getMonth() + 1); renderMonth(); }

  // 옛 string 레코드와 새 object 레코드 둘 다 호환
  function recStatus(r) { return (typeof r === 'string') ? r : (r && r.status) || ''; }
  function recHomework(r) { return (typeof r === 'object' && r && typeof r.homework === 'number') ? r.homework : null; }
  function recAchieve(r) { return (typeof r === 'object' && r && typeof r.achieve === 'number') ? r.achieve : null; }
  function recMinutes(r) { return (typeof r === 'object' && r && typeof r.minutes === 'number') ? r.minutes : null; }
  function fmtMin(min) { var h = Math.floor(min/60), m = min%60; var s = (h?h+'시간':'') + (m?(h?' ':'')+m+'분':''); return s || '0분'; }
  function hwBucketClass(p) {
    if (p === 0)   return 'hw-0';
    if (p <= 25)   return 'hw-25';
    if (p <= 50)   return 'hw-50';
    if (p <= 75)   return 'hw-75';
    return 'hw-100';
  }

  function renderMonth() {
    const y = viewMonth.getFullYear();
    const m = viewMonth.getMonth();
    const monthStr = y + '-' + String(m + 1).padStart(2, '0');
    document.getElementById('monthLabel').textContent = y + '년 ' + (m + 1) + '월';

    const isClinic = mode === 'clinic';
    let cnt = { '출석': 0, '지각': 0, '결석': 0, '병결': 0, '공결': 0 };
    let aSum = 0, aN = 0, minSum = 0;
    for (const [date, r] of Object.entries(allRecords)) {
      if (!date.startsWith(monthStr)) continue;
      const st = recStatus(r);
      if (cnt.hasOwnProperty(st)) cnt[st]++;
      if (isClinic) {
        const a = recAchieve(r); if (a !== null) { aSum += a; aN++; }
        const mn = recMinutes(r); if (mn !== null) minSum += mn;
      } else {
        const hp = recHomework(r); if (hp !== null) { aSum += hp; aN++; }
      }
    }
    const avg = aN ? Math.round(aSum / aN) : null;

    let statBoxes =
      '<div class="stat-box"><div class="stat-num" style="color:var(--att);">' + cnt['출석'] + '</div><div class="stat-label">출석</div></div>' +
      '<div class="stat-box"><div class="stat-num" style="color:var(--late);">' + cnt['지각'] + '</div><div class="stat-label">지각</div></div>' +
      '<div class="stat-box"><div class="stat-num" style="color:var(--abs);">' + cnt['결석'] + '</div><div class="stat-label">결석</div></div>' +
      '<div class="stat-box"><div class="stat-num" style="color:var(--sick);">' + (cnt['병결'] + cnt['공결']) + '</div><div class="stat-label">병·공결</div></div>';
    if (isClinic) {
      statBoxes += (avg !== null || minSum > 0)
        ? '<div class="cli-stat"><div><div class="lbl">이번 달 클리닉</div><div class="sub">' + (aN ? aN + '회 성취도 기록' : '성취도 기록 없음') + '</div></div><div style="text-align:right;"><div class="val">' + (avg !== null ? '성취도 ' + avg : '시간 기록') + '</div><div class="sub">시간 합계 ' + fmtMin(minSum) + '</div></div></div>'
        : '<div class="cli-stat"><div class="lbl">이번 달 클리닉 기록 없음</div></div>';
    } else {
      statBoxes += (avg !== null)
        ? '<div class="hw-stat"><div><div class="lbl">이번 달 숙제 평균</div><div class="sub">' + aN + '회 기록</div></div><div class="val">' + avg + '%</div></div>'
        : '<div class="hw-stat"><div class="lbl">이번 달 숙제 기록 없음</div></div>';
    }
    document.getElementById('summary').innerHTML = statBoxes;

    const firstDow = new Date(y, m, 1).getDay();
    const lastDate = new Date(y, m + 1, 0).getDate();
    const today = new Date(); today.setHours(0,0,0,0);
    const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');

    let html = '';
    for (let i = 0; i < firstDow; i++) html += '<div class="cal-cell empty"></div>';
    const cls = { '출석': 'att', '지각': 'late', '결석': 'abs', '병결': 'sick', '공결': 'off' };
    for (let d = 1; d <= lastDate; d++) {
      const ds = monthStr + '-' + String(d).padStart(2, '0');
      const r = allRecords[ds];
      const status = recStatus(r);
      const band = isClinic ? recAchieve(r) : recHomework(r);
      const cc = status ? cls[status] || '' : '';
      const bandCls = (band !== null) ? ' ' + hwBucketClass(band) : '';
      const isToday = ds === todayStr ? ' today' : '';
      const badge = (band !== null) ? '<div class="hw">' + band + '</div>' : '';
      const mn = isClinic ? recMinutes(r) : null;
      const minLine = (mn !== null && mn > 0) ? '<div class="s" style="color:var(--clinic);font-weight:800;">' + fmtMin(mn) + '</div>' : '';

      // 🎬 인강 배지 — 못 온 날(결석·병결·공결)과, 이미 신청/해제된 날에만 붙인다.
      //   기록 없는 날까지 🔒 를 붙이면 수업 없는 날에도 자물쇠가 깔려 달력이 자물쇠밭이 된다.
      let mkBadge = '', mkCls = '', mkTap = '';
      if (!isClinic) {
        const gst = grants[ds];
        if (BLOCK_ST[status] || gst) {
          if (gst === 'approved')       mkBadge = '<div class="mk" title="인강 열림">🔓</div>';
          else if (gst === 'requested') mkBadge = '<div class="mk" title="인강 신청함 · 승인 대기">🙋</div>';
          else {
            mkBadge = '<div class="mk" title="인강 잠김 — 눌러서 신청">🔒</div>';
            mkCls = ' mk-can';
            mkTap = ' onclick="askMakeup(\'' + ds + '\')"';
          }
        }
      }

      html += '<div class="cal-cell ' + cc + bandCls + isToday + mkCls + '"' + mkTap + '>' + badge + mkBadge + '<div class="d">' + d + '</div>' + (status ? '<div class="s">' + status + '</div>' : '') + minLine + '</div>';
    }
    document.getElementById('calGrid').innerHTML = html;
    renderMakeupPanel(monthStr, isClinic);

    const hint = document.getElementById('legendHint');
    if (hint) hint.textContent = isClinic
      ? '하단 색띠·우상단 배지 = 클리닉 성취도 (빨강 0 → 초록 100) · 셀 안 시간 = 클리닉 시간'
      : '하단 색띠 = 숙제 완료율 (빨강 0% → 초록 100%) · 좌상단 🔒 잠김 · 🙋 신청함 · 🔓 인강 열림';
  }

  // 🎬 이 달 인강 — 못 온 날과 그날 영상이 열렸는지를 목록으로 남긴다.
  //   「열림」은 선생님이 열어줬다는 뜻이다. 실제로 봤는지까지는 여기서 세지 않는다.
  function renderMakeupPanel(monthStr, isClinic) {
    const el = document.getElementById('mkPanel');
    if (!el) return;
    if (isClinic) { el.style.display = 'none'; return; }

    const dates = [];
    for (const [date, r] of Object.entries(allRecords)) {
      if (!date.startsWith(monthStr)) continue;
      if (BLOCK_ST[recStatus(r)]) dates.push(date);
    }
    // 출결이 아직 안 들어온 날인데 인강만 열린 경우도 빠뜨리지 않는다.
    Object.keys(grants).forEach(function(d){
      if (!d.startsWith(monthStr) || dates.indexOf(d) >= 0) return;
      dates.push(d);
    });
    if (!dates.length) { el.style.display = 'none'; return; }
    dates.sort();

    const 열림 = dates.filter(function(d){ return grants[d] === 'approved'; }).length;
    const rows = dates.map(function(d){
      const st = recStatus(allRecords[d]) || '기록 없음';
      const g = grants[d];
      let mark;
      if (g === 'approved')       mark = '<span style="color:var(--att);font-weight:700;">🔓 인강 열림</span>';
      else if (g === 'requested') mark = '<span style="color:var(--late);font-weight:700;">🙋 신청함 · 승인 대기</span>';
      else                        mark = '<span onclick="askMakeup(\'' + d + '\')" style="color:var(--abs);font-weight:700;cursor:pointer;text-decoration:underline;">🔒 잠김 — 신청하기</span>';
      return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--hairline);font-size:0.83rem;">' +
        '<span><b>' + esc(d.slice(5).replace('-', '/')) + '</b> <span style="color:var(--text-light);font-size:0.76rem;">' + esc(st) + '</span></span>' +
        mark +
      '</div>';
    }).join('');

    el.style.display = 'block';
    el.innerHTML =
      '<div style="font-weight:800;font-size:0.9rem;color:var(--primary);">🎬 이 달 인강</div>' +
      '<div style="font-size:0.75rem;color:var(--text-light);margin:3px 0 6px;line-height:1.6;">' +
        '못 온 날 ' + dates.length + '일 중 <b>' + 열림 + '일</b> 열림 · 잠긴 날짜를 누르면 인강을 신청합니다.' +
      '</div>' + rows;
  }

  loadMe();
  ('serviceWorker' in navigator) && navigator.serviceWorker.register('/sw.js').catch(function(e){console.error('SW register fail:', e);});
</script>
<!-- 학생 상단 네비: 홈(포털) + 메뉴 드롭다운 -->
<script>
(function(){
  try{
    var path = (location.pathname || '').replace(/\.html$/,''); if(path.length > 1){ path = path.replace(/\/+$/,''); }
    var pop = document.getElementById('kwnavPop');
    if(pop){
      var links = pop.querySelectorAll('a[data-p]');
      for(var i=0;i<links.length;i++){
        if(links[i].getAttribute('data-p') === path){ links[i].className = 'cur'; links[i].removeAttribute('href'); }
      }
    }
    var tog = document.getElementById('kwnavToggle');
    if(tog && pop){
      tog.addEventListener('click', function(e){
        e.stopPropagation();
        var open = pop.classList.toggle('show');
        tog.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', function(ev){
        if(!pop.contains(ev.target) && ev.target !== tog){ pop.classList.remove('show'); tog.setAttribute('aria-expanded','false'); }
      });
    }
  }catch(_){}
})();
</script>
