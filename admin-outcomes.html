<style>

  /* 학생 목록 '퇴원생' 탭 안에 iframe으로 임베드될 때 — 자체 헤더/여백 제거 */

  /* ══════════════════════════════════════════════════════════════════════

     기능이 한눈에 · 바로 처리. 기존 규칙·DOM·JS는 그대로 두고 여기서만 덮어쓴다.

  body{ font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;

    font-size:0.78rem; font-weight:700; text-decoration:none; cursor:pointer; font-family:inherit; }

  /* ── 상단 바 ② : <header><div class="headInner"> 패턴 ───────────────── */
  header{ position:sticky; top:0; z-index:30; background:var(--primary) !important;

  /* header 바로 뒤에 붙은 네비 줄(admin-surveys)도 같은 바로 합친다 */

  /* ── 상단 바 ③ : .topbar 패턴 (이미 와인) ─────────────────────────── */
  .topbar{ position:sticky; top:0; z-index:30; padding:max(12px,env(safe-area-inset-top,12px)) 16px 12px; }
  .topbar-title{ font-size:1rem; font-weight:800; letter-spacing:-0.02em;

  /* ── 상단 바 ④ : .wrap 첫 자식이 .kwnav 인 패턴 (makeup·notify·stats) ─ */
  .wrap > .kwnav:first-child{
    background:var(--primary); position:sticky; top:0; z-index:30;
    margin:0 -16px 16px; padding:max(11px,env(safe-area-inset-top,11px)) 16px 10px;
    justify-content:flex-end; }
  /* 이 패턴에서 제목은 바 아래 크림 배경에 온다 */
  .wrap > .kwnav:first-child ~ h1{ font-size:1.12rem; font-weight:800; color:var(--primary);
    margin:0 0 5px; letter-spacing:-0.02em; display:flex; align-items:center; gap:8px; }
  .wrap > .kwnav:first-child ~ .sub{ font-size:0.82rem; line-height:1.55; margin:0 0 16px; }
  /* stats: kwnav 바 다음의 .top 은 평범한 제목 줄로 (와인 바 중복 방지) */
  .wrap > .kwnav:first-child + .top{
    background:transparent; position:static; margin:0 0 16px; padding:0;
    display:flex; align-items:flex-end; gap:12px; }
  .wrap > .kwnav:first-child + .top h1{ color:var(--primary); font-size:1.12rem; font-weight:800; margin:0;
    display:inline-flex; align-items:center; gap:8px; }
  .wrap > .kwnav:first-child + .top .sub{ color:var(--text-light,var(--muted)); font-size:0.8rem; margin:4px 0 0 !important; }
  .wrap > .kwnav:first-child + .top > button{ margin-left:auto; background:#fff; color:var(--primary);
    border:1.5px solid var(--primary); border-radius:9px; padding:7px 13px; font-size:0.8rem; font-weight:700; }

  /* 와인 바 안의 공유 네비는 반투명 흰색으로 */
  .wrap > .top:first-child .kwnav-home, .wrap > .top:first-child .kwnav-toggle,
  body > .top .kwnav-home, body > .top .kwnav-toggle,
  header .kwnav-home, header .kwnav-toggle,
  header + div[style*="flex-end"] .kwnav-home, header + div[style*="flex-end"] .kwnav-toggle,
  .wrap > .kwnav:first-child .kwnav-home, .wrap > .kwnav:first-child .kwnav-toggle,
  .topbar .kwnav-home, .topbar .kwnav-toggle{
    background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28); color:#fff; padding:7px 12px; }
  .wrap > .top:first-child .kwnav-home:hover, body > .top .kwnav-home:hover, header .kwnav-home:hover,
  .wrap > .kwnav:first-child .kwnav-home:hover, .topbar .kwnav-home:hover,
  .wrap > .top:first-child .kwnav-toggle:hover, body > .top .kwnav-toggle:hover, header .kwnav-toggle:hover,
  .wrap > .kwnav:first-child .kwnav-toggle:hover, .topbar .kwnav-toggle:hover{ background:rgba(255,255,255,0.24); }

  /* ── 카드·면 ── */
  .card, .msg, .note, .box, .cfg, .intro, .summary, .state-box, .grid-card, .batch, .detail{
    border-color:var(--border,var(--line)) !important; box-shadow:0 1px 3px rgba(70,20,35,.04) !important; }

  /* ── 숫자는 세리프 — 처리할 개수가 먼저 보이게 ── */
  .count, .cnt, .big, .num, .avg, .score-big, .stat .v, .summary .v, .pill, .badge, .cbadge,
  .b-cnt, .nft-count, .bar-val, .cmin, .sm{ font-family:var(--serif); }

  /* ── 입력 — 터치 타깃 · 포커스 와인 링 ── */
  input, select, textarea, button{ font-family:inherit; }
  input[type=text], input[type=password], input[type=number], input[type=date], input[type=month],
  input[type=tel], input[type=search], select, textarea, .search, .login-input{
    border:1.5px solid var(--border,var(--line)); border-radius:10px; outline:none;
    transition:border-color .12s, box-shadow .12s; }
  input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, input[type=date]:focus,
  input[type=month]:focus, input[type=tel]:focus, input[type=search]:focus, select:focus, textarea:focus,
  .search:focus, .login-input:focus{ border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }

  /* ── 버튼 — 아이콘+라벨 한 줄, 눌린 상태 확실히 ── */
  .mini, .ghost, .btn-primary, .b-pri, .b-sec, .save, .aisave, .bp-save, .bp-all, .listbtn,
  .pushbtn, .b-reopen, .b-done, .b-del, .b-ghost, .restore, .del, .up, .hide, .act, .dl, .jump{
    display:inline-flex !important; align-items:center; justify-content:center; gap:6px;

  .tab-btn, .tabs button, .mtab, .seg button, .chip, .nft-btn, .bp-mode, .modeTabs button{
    border-radius:9px; font-family:inherit; white-space:nowrap; }
  .tab-btn.active, .tabs .on, .mtab.on, .seg .on, .chip.on, .nft-btn.on, .bp-mode.on{
    box-shadow:0 1px 4px rgba(134,38,51,.22); }

  /* ── 텍스트 라벨은 flex로 만들지 않는다 (문장이 조각나 gap이 끼어든다) ── */
  .sechead, .paynote, .section-label, .panel-title, .menu-sec-t, .cardHead, .stHead, .section-title{
    display:block !important; }
  .badge, .pill, .cbadge, .tag{ display:inline-flex !important; align-items:center; gap:5px; white-space:nowrap; }

  /* ── 표 ── */
  table{ border-collapse:collapse; }
  th{ font-weight:700; color:var(--text-light,var(--muted)); font-size:0.78rem; }
  td, th{ border-color:var(--hairline,var(--border)) !important; }
  td.num, td.n, .num{ text-align:right; font-family:var(--serif); }

  /* ── 반응형 (반드시 마지막) — 위 블록과 동일 특이도라 소스 순서로 이겨야 한다 ── */
  @media (max-width:640px){
    .wrap > .top:first-child, body > .top{ flex-wrap:wrap; gap:8px 10px; align-items:flex-start; }
    .wrap > .top:first-child > div:first-child, body > .top > div:first-child{ flex:1 1 100%; }
    .wrap > .top:first-child .kwnav, body > .top .kwnav{ margin-left:0; }
    .wrap > .top:first-child .sub, body > .top .sub{ white-space:normal; overflow:visible; text-overflow:clip; }
    header .headInner{ flex-wrap:wrap; }
  }

  /* 빈 배지·개수 칩은 다시 숨긴다 — 위 !important 규칙에 눌려 있던 원본 동작 복원 */
  .badge:empty, .pill:empty, .cbadge:empty, .tag:empty, .bdg:empty, .b-cnt:empty, .cnt:empty, .count:empty{
    display:none !important; }
</style>

<div class="wrap">
  <div class="top">
    <div><h1><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;"><path d="M12 3.5v10"></path><path d="m8 7.5 4-4 4 4"></path><path d="M4.5 14v4.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V14"></path></svg>퇴원생 기록</h1><div class="sub">퇴원·탈퇴한 학생의 성적·출결·학습 보관 (관리자 전용)</div></div>
    <a class="back" href="/admin">← 관리자</a>
  </div>
  <div id="content"><div class="msg">불러오는 중…</div></div>
  <div class="note" id="footnote" style="display:none;">
    ※ 퇴원·탈퇴한 학생의 <b>이름·전화·성적·출결·학습 전체</b>를 보관합니다(관리자 전용, 앱에는 노출 안 됨).<br>
    ※ <span class="badge out">퇴원</span> 관리자가 퇴원 처리 · <span class="badge self">앱탈퇴</span> 학생이 앱에서 직접 탈퇴(앱에서는 삭제, 기록만 보존).
  </div>
</div>
<script>
  var token = sessionStorage.getItem('kwmath_admin_pw') || localStorage.getItem('kwmath_admin_pw') || localStorage.getItem('kwmath_admin_token') || null;
  var rows = [], openIdx = null, q = '', showHidden = false;

  // '학생 목록 > 퇴원생' 탭 안에 iframe으로 들어올 때(?embed=1): 자체 헤더 감추고, 렌더할 때마다 부모창에 높이 알림
  var EMBED = /[?&]embed=1/.test(location.search);
  if (EMBED) { try { document.body.classList.add('embed'); } catch (_) {} }
  function notifyHeight(){
    if (!EMBED) return;
    try { parent.postMessage({ kwmathOutcomesHeight: document.body.scrollHeight }, location.origin); } catch (_) {}
  }
  window.addEventListener('resize', notifyHeight);

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function fmtYM(iso){ if(!iso) return '-'; var d=new Date(iso); if(isNaN(d)) return '-'; return d.getFullYear()+'.'+('0'+(d.getMonth()+1)).slice(-2); }
  function fmtDate(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return esc(iso); return (d.getMonth()+1)+'/'+d.getDate(); }
  function months(a,b){ if(!a||!b) return null; var d1=new Date(a),d2=new Date(b); if(isNaN(d1)||isNaN(d2)) return null; var m=(d2.getFullYear()-d1.getFullYear())*12+(d2.getMonth()-d1.getMonth()); return m<=0?null:m; }
  function period(o){ var s=fmtYM(o.enrolled_at),e=fmtYM(o.left_at),m=months(o.enrolled_at,o.left_at); return s+' ~ '+e+(m?(' <span class="muted">(약 '+m+'개월)</span>'):''); }
  function hrs(min){ min=Number(min)||0; if(!min) return '0'; var h=Math.floor(min/60),m=min%60; return (h?h+'시간':'')+(m?(' '+m+'분'):'')||'0'; }
  function fmtScore(s){
    if(s.rawScore!=null && s.grade!=null) return s.rawScore+'<span class="muted">('+s.grade+')</span>';
    if(s.rawScore!=null) return ''+s.rawScore;
    if(s.grade!=null) return '('+s.grade+'등급)';
    return '-';
  }
  function jp(str){ try{ var a=JSON.parse(str||'[]'); return Array.isArray(a)?a:[]; }catch(_){ return []; } }

  async function api(path, opts){
    opts = opts || {}; opts.headers = opts.headers || {};
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    opts.credentials = 'same-origin';
    var r = await fetch(path, opts);
    if (r.status === 401){ sessionStorage.removeItem('kwmath_admin_pw'); var had=token; token=null; showLogin(had?'비밀번호가 틀렸습니다':''); throw new Error('401'); }
    return r;
  }
  function showLogin(err){
    $('footnote').style.display='none';
    $('content').innerHTML =
      '<div class="login"><div style="font-weight:700;">관리자 비밀번호</div>'+
      '<input type="password" id="pw" placeholder="비밀번호" onkeydown="if(event.key===\'Enter\')doLogin()">'+
      (err?'<div class="err">'+esc(err)+'</div>':'')+
      '<button onclick="doLogin()">확인</button></div>';
    var p=$('pw'); if(p) p.focus();
  }
  function doLogin(){ token=($('pw').value||'').trim(); if(!token) return; sessionStorage.setItem('kwmath_admin_pw',token); boot(); }

  async function boot(){
    $('content').innerHTML = '<div class="msg">퇴원생 기록 불러오는 중…</div>';
    try{
      var r = await api('/api/outcomes?t='+Date.now());
      var data = await r.json();
      rows = (data && data.outcomes) || [];
      render();
    }catch(e){ if(String(e.message)!=='401') $('content').innerHTML='<div class="msg">네트워크 오류. 다시 시도해 주세요.</div>'; }
  }

  function hiddenCount(){ var n=0; for(var i=0;i<rows.length;i++){ if(Number(rows[i].hidden)) n++; } return n; }
  function filtered(){
    var s=(q||'').trim();
    return rows.map(function(o,i){ return {o:o,i:i}; }).filter(function(x){
      // 숨김 보기 On이면 hidden=1 행만, Off(기본)면 hidden=0 행만
      if(showHidden !== !!Number(x.o.hidden)) return false;
      if(!s) return true;
      return String(x.o.name||'').indexOf(s)>-1 || String(x.o.school||'').indexOf(s)>-1
          || String(x.o.parent_phone||'').indexOf(s)>-1 || String(x.o.student_phone||'').indexOf(s)>-1;
    });
  }

  function render(){
    $('footnote').style.display='block';
    var list = filtered();
    var hc = hiddenCount();
    var head =
      '<div class="bar">'+
        '<div class="count">'+(showHidden?'숨긴 기록 ':'퇴원생 ')+'<b>'+list.length+'</b>명'+
          (q?(' <span class="muted">/ 전체 '+(showHidden?hc:(rows.length-hc))+'</span>'):'')+'</div>'+
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">'+
          '<button class="viewtoggle'+(showHidden?' on':'')+'" onclick="toggleHiddenView()">'+
            (showHidden ? '← 목록으로' : ('🗂 숨김 보기'+(hc?(' ('+hc+')'):'')))+'</button>'+
          '<div class="search"><input id="q" type="text" placeholder="이름·학교 검색" value="'+esc(q)+'" oninput="onSearch(this.value)"><span class="ic">🔍</span></div>'+
        '</div>'+
      '</div>';

    if(!rows.length){ $('content').innerHTML = head + '<div class="msg">아직 퇴원생 기록이 없습니다.<br><span class="muted">학생을 퇴원 처리하면 이 목록에 전체 기록이 자동 보관됩니다.</span></div>'; wireSearch(); notifyHeight(); return; }
    if(!list.length){
      var emptyMsg = showHidden ? '숨긴 기록이 없습니다.' : (q ? '검색 결과가 없습니다.' : '표시할 퇴원생 기록이 없습니다.');
      $('content').innerHTML = head + '<div class="msg">'+emptyMsg+'</div>'; wireSearch(); notifyHeight(); return;
    }

    var body = list.map(function(x){
      var o=x.o, i=x.i;
      var sum = o.summary ? esc(o.summary).replace(/→/g,'<span class="up">→</span>') : '<span class="muted">성적 기록 없음</span>';
      var chips = '<span>성적 '+(o.score_count||0)+'</span>'+
                  '<span>출결 '+(o.attendance_count||0)+'</span><span>공부 '+hrs(o.study_minutes)+'</span>';
      var stBadge = o.via==='app' ? '<span class="badge self">앱탈퇴</span>' : '<span class="badge out">퇴원</span>';
      var phones = [];
      if(o.parent_phone) phones.push('학부모 '+esc(o.parent_phone));
      if(o.student_phone) phones.push('학생 '+esc(o.student_phone));
      var phoneLine = phones.length ? '<div class="ph">'+phones.join('<br>')+'</div>' : '';
      var acts = '<button class="mini" onclick="toggle('+i+')">'+(openIdx===i?'닫기':'상세보기')+'</button>';
      if(showHidden){
        acts += ' <button class="mini restore" onclick="doHide('+o.id+',false)">복구</button>'+
                ' <button class="mini del" onclick="doDelete('+o.id+')">완전삭제</button>';
      } else {
        acts += ' <button class="mini hide" onclick="doHide('+o.id+',true)">숨김</button>';
      }
      var main =
        '<tr class="main'+(showHidden?' hiddenrow':'')+'">'+
          '<td class="gr">'+esc(o.grade_level||'-')+'</td>'+
          '<td>'+stBadge+'</td>'+
          '<td class="nm">'+esc(o.name||'-')+phoneLine+'</td>'+
          '<td>'+esc(o.school||'-')+'</td>'+
          '<td class="muted" style="white-space:nowrap;">'+period(o)+'</td>'+
          '<td class="sum">'+sum+'<div class="chips" style="margin-top:4px;">'+chips+'</div></td>'+
          '<td class="acts">'+acts+'</td>'+
        '</tr>';
      var detail = (openIdx===i) ? ('<tr class="detail"><td colspan="7"><div class="detail-inner">'+ detailHtml(o) +'</div></td></tr>') : '';
      return main + detail;
    }).join('');

    $('content').innerHTML = head +
      '<div class="card"><table>'+
        '<thead><tr><th>학년</th><th>상태</th><th>학생 이름</th><th>학교</th><th>수강기간</th><th>기록 요약</th><th>상세</th></tr></thead>'+
        '<tbody>'+body+'</tbody>'+
      '</table></div>';
    wireSearch();
    notifyHeight();
  }

  function detailHtml(o){
    return scoreSection(o) + attSection(o) + studySection(o);
  }
  function scoreSection(o){
    var scores = jp(o.scores_json);
    var inner;
    if(!scores.length){ inner = '<div class="emptyrec">성적 기록 없음</div>'; }
    else{
      inner = ['내신','모의'].map(function(type){
        var g = scores.filter(function(s){ return s.examType===type; });
        if(!g.length) return '';
        var trs = g.map(function(s){
          return '<tr><td>'+esc(s.gradeLevel||'-')+'</td><td>'+esc(s.label||'-')+'</td><td class="pill">'+fmtScore(s)+'</td><td class="muted">'+esc(s.examDate||'')+'</td></tr>';
        }).join('');
        return '<div class="sub2">'+type+'</div><table class="stbl"><thead><tr><th>학년</th><th>시기</th><th>원점수(등급)</th><th>날짜</th></tr></thead><tbody>'+trs+'</tbody></table>';
      }).join('');
    }
    return '<div class="grp"><h4 class="s-score">📈 성적 <span class="cnt">('+scores.length+'개)</span></h4>'+inner+'</div>';
  }
  function attSection(o){
    var att = jp(o.attendance_json);
    var inner;
    if(!att.length){ inner = '<div class="emptyrec">출결 기록 없음</div>'; }
    else{
      var trs = att.map(function(a){
        var hw = (a.homework===1||a.homework===true)?'완료':((a.homework===0||a.homework===false)?'미완':'');
        return '<tr><td>'+esc(a.date||'')+'</td><td>'+esc(a.status||'')+'</td><td>'+esc(hw)+'</td><td class="muted">'+esc(a.note||'')+'</td><td class="muted">'+esc(a.method||'')+'</td></tr>';
      }).join('');
      inner = '<table class="stbl"><thead><tr><th>날짜</th><th>출결</th><th>숙제</th><th>비고</th><th>방식</th></tr></thead><tbody>'+trs+'</tbody></table>';
    }
    return '<div class="grp"><h4 class="s-att">📅 출결 <span class="cnt">('+att.length+'회)</span></h4>'+inner+'</div>';
  }
  function studySection(o){
    var st = jp(o.study_json);
    var inner;
    if(!st.length){ inner = '<div class="emptyrec">학습 기록 없음</div>'; }
    else{
      var trs = st.map(function(s){
        return '<tr><td>'+esc(s.date||fmtDate(s.startedAt))+'</td><td class="pill">'+hrs(s.minutes)+'</td></tr>';
      }).join('');
      inner = '<div class="muted" style="font-size:0.8rem;margin-bottom:4px;">총 '+st.length+'회 · '+hrs(o.study_minutes)+'</div>'+
              '<table class="stbl"><thead><tr><th>날짜</th><th>공부시간</th></tr></thead><tbody>'+trs+'</tbody></table>';
    }
    return '<div class="grp"><h4 class="s-study">📚 학습 <span class="cnt">('+st.length+'회)</span></h4>'+inner+'</div>';
  }

  function toggle(i){ openIdx = (openIdx===i? null : i); render(); }
  function onSearch(v){ q=v; render(); }
  function wireSearch(){ var el=$('q'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }

  function toggleHiddenView(){ showHidden = !showHidden; openIdx = null; q=''; render(); }

  async function doHide(id, hide){
    try{
      await api('/api/outcomes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action: hide?'hide':'unhide', id: id }) });
      for(var k=0;k<rows.length;k++){ if(rows[k].id===id){ rows[k].hidden = hide?1:0; break; } }
      openIdx = null; render();
    }catch(e){ if(String(e.message)!=='401') alert('처리 중 오류가 발생했어요.'); }
  }

  async function doDelete(id){
    var nm=''; for(var k=0;k<rows.length;k++){ if(rows[k].id===id){ nm=rows[k].name||''; break; } }
    if(!confirm('⚠️ "'+(nm||'이 학생')+'" 기록을 완전 삭제할까요?\n\n퇴원생의 마지막 백업(실명·전화·성적·출결·학습)이 영구 삭제되며 복구할 수 없습니다.')) return;
    try{
      await api('/api/outcomes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'delete', id: id }) });
      rows = rows.filter(function(r){ return r.id!==id; });
      openIdx = null; render();
    }catch(e){ if(String(e.message)!=='401') alert('삭제 중 오류가 발생했어요.'); }
  }

  if(token) boot(); else showLogin('');
</script>
</body>
</html>
