  .aist{ display:flex; gap:5px; flex-wrap:wrap; }
  .aibtn{ background:#fff; color:var(--muted); border:1.5px solid var(--border); border-radius:8px; padding:6px 11px; font-size:0.8rem; font-weight:700; cursor:pointer; font-family:inherit; }

  .attsum{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px; }

  .aih:focus,.aim:focus,.aidate:focus{ border-color:var(--primary); }
  .cliwrap{ margin-top:8px; background:#fff; border:1px dashed var(--ai); border-radius:9px; padding:10px 11px; font-size:0.8rem; display:none; }
  .cliwrap.show{ display:block; }
  .cliwrap .ailabel{ color:var(--ai); }
  .cliwrap .aibtn.on{ background:var(--ai); color:#fff; border-color:var(--ai); }
  .cliwrap .aibtn:hover{ border-color:var(--ai); }
  .cliwrap .aih:focus,.cliwrap .aim:focus,.cliwrap .aidate:focus{ border-color:var(--ai); }
  .cliwrap .aisave{ background:var(--ai); }
  .msg{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:30px 18px; text-align:center; color:var(--muted); }
  .toast{ position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(30,30,30,0.92); color:#fff; padding:11px 18px; border-radius:9px; font-size:0.84rem; font-weight:600; z-index:100; display:none; }
  .toast.show{ display:block; }
  /* 반별 일괄 출석/클리닉 패널 */
  .batch{ background:#fff; border:1px solid var(--border); border-radius:13px; padding:13px 14px; margin-bottom:14px; box-shadow:0 2px 8px rgba(134,38,51,0.04); }
  .bp-head{ font-weight:800; font-size:0.92rem; margin-bottom:9px; }
  .bp-ctrl{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:9px; }
  .bp-ctrl select,.bp-ctrl input{ flex:1; min-width:130px; padding:8px 10px; border:1.5px solid var(--border); border-radius:9px; font-family:inherit; font-size:0.86rem; outline:none; background:#fff; color:var(--ink); }
  .bp-ctrl select:focus,.bp-ctrl input:focus{ border-color:var(--primary); }
  .bp-modes{ display:flex; gap:7px; margin-bottom:11px; }
  .bp-mode{ flex:1; background:#fff; color:var(--muted); border:1.5px solid var(--border); border-radius:9px; padding:8px; font-size:0.84rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .bp-mode.on{ background:var(--primary); color:#fff; border-color:var(--primary); }
  #bpMC.on{ background:var(--ai); border-color:var(--ai); }
  .bp-row{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--border); }
  .bp-row:last-child{ border-bottom:none; }
  .bp-nm{ flex:0 0 84px; width:84px; font-weight:700; font-size:0.86rem; }
  .bp-st{ display:flex; gap:5px; flex-wrap:wrap; flex:1; }
  .bp-b{ background:#fff; color:var(--muted); border:1.5px solid var(--border); border-radius:8px; padding:6px 10px; font-size:0.8rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .bp-b:hover{ border-color:var(--primary); }
  .bp-b.on{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .batch.cli .bp-b.on{ background:var(--ai); border-color:var(--ai); }
  .bp-empty{ color:var(--muted); font-size:0.82rem; padding:12px 0; text-align:center; }
  .bp-foot{ display:flex; gap:8px; margin-top:11px; }
  .bp-all{ background:#E5F5E8; color:#1F7A33; border:1.5px solid #1F7A33; border-radius:9px; padding:9px 14px; font-size:0.83rem; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .bp-save{ flex:1; background:var(--primary); color:#fff; border:none; border-radius:9px; padding:10px; font-size:0.88rem; font-weight:800; cursor:pointer; font-family:inherit; }
  .batch.cli .bp-save{ background:var(--ai); }
  .bp-save:disabled{ opacity:0.5; cursor:default; }
  /* 상단 통합 네비 (홈 + 메뉴 드롭다운) */
  .kwnav{ display:flex; align-items:center; gap:8px; }
  .kwnav-home{ display:inline-flex; align-items:center; gap:5px; background:var(--primary); color:#fff; font-weight:800; font-size:0.84rem; text-decoration:none; padding:8px 13px; border-radius:9px; font-family:inherit; white-space:nowrap; line-height:1; }
  .kwnav-mw{ position:relative; }
  .kwnav-toggle{ display:inline-flex; align-items:center; gap:5px; background:#fff; color:var(--primary); border:1.5px solid var(--primary); font-weight:800; font-size:0.84rem; padding:6px 13px; border-radius:9px; cursor:pointer; font-family:inherit; white-space:nowrap; line-height:1.25; }
  .kwnav-pop{ position:absolute; right:0; top:calc(100% + 6px); background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,0.16); padding:6px; min-width:196px; z-index:200; display:none; }
  .kwnav-pop.show{ display:block; }
  .kwnav-pop a{ display:block; text-decoration:none; color:var(--ink); font-weight:700; font-size:0.86rem; padding:9px 12px; border-radius:8px; white-space:nowrap; }
  .kwnav-pop a:hover{ background:var(--primary-light); }
  .kwnav-pop a.cur{ background:var(--primary-light); color:var(--primary); cursor:default; }
  .kwnav-pop a.kwnav-logout{ color:var(--muted); border-top:1px solid var(--border); margin-top:4px; }
  .kwnav-pop a.kwnav-logout:hover{ background:#FBE6E6; color:#b3261e; }
  .kwnav--light .kwnav-home{ background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.28); color:#fff; }
  .kwnav--light .kwnav-toggle{ background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.28); color:#fff; }

  /* ══════════════════════════════════════════════════════════════════
     2026-08-04 조교 콘솔 정렬 (디자인가이드_조교관리자.md)
     기능이 한눈에 · 바로 처리. 기존 규칙은 남기고 여기서만 덮어쓴다(CSS 전용).
     ══════════════════════════════════════════════════════════════════ */
  body{ font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
        letter-spacing:-0.01em; background:var(--bg); word-break:keep-all; overflow-wrap:break-word; }
  .wrap{ max-width:880px; padding:0 16px 60px; }

  /* 상단 고정 바 — 제목·부제·네비를 와인 바에 모으고 스크롤해도 남긴다 */
  .top{ display:flex; align-items:center; gap:12px; flex-wrap:nowrap;
        background:var(--primary); color:#fff; position:sticky; top:0; z-index:30;
        margin:0 -16px 18px; padding:max(12px,env(safe-area-inset-top,12px)) 16px 11px; }
  .top > div:first-child{ min-width:0; display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
  h1{ font-size:1rem; font-weight:800; margin:0; color:#fff; letter-spacing:-0.02em;
      display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  h1 svg{ opacity:.85; }
  .sub{ font-size:0.76rem; color:rgba(255,255,255,0.66); margin:0 !important; font-weight:500; }
  .top .kwnav{ margin-left:auto; flex:0 0 auto; }
  .top .kwnav-home{ background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28); color:#fff; padding:7px 12px; }
  .top .kwnav-toggle{ background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28); color:#fff; padding:6px 12px; }
  .top .kwnav-home:hover, .top .kwnav-toggle:hover{ background:rgba(255,255,255,0.24); }
  .top .back{ margin-left:auto; color:#fff; background:rgba(255,255,255,0.14);
              border:1px solid rgba(255,255,255,0.28); border-radius:9px; padding:7px 12px; }

  /* 카드·면 — 그림자 줄이고 헤어라인으로 */
  .card, .batch, .msg, .box, .sec-card{ border-color:var(--border) !important; box-shadow:0 1px 3px rgba(70,20,35,.04) !important; }
  .msg{ padding:34px 18px; }

  /* 숫자는 세리프 — 처리해야 할 개수가 가장 먼저 보이게 */
  .count b, .sc .g, .pill, .bdg, .n{ font-family:var(--serif); }
  .count{ font-size:0.95rem; }

  /* 입력 — 터치 타깃 44px · 포커스 와인 링 */
  input, select, textarea{ font-family:inherit; }
  .search, .aidate, .aihw, .aih, .aim, .bp-ctrl select, .bp-ctrl input,
  input[type=text], input[type=date], input[type=number], input[type=month], select, textarea{
    border:1.5px solid var(--border); border-radius:10px; outline:none;
    transition:border-color .12s, box-shadow .12s; }
  .search{ min-height:42px; padding:9px 13px; }
  .search:focus, .aidate:focus, .aihw:focus, .aih:focus, .aim:focus,
  input[type=text]:focus, input[type=date]:focus, input[type=number]:focus, input[type=month]:focus,
  select:focus, textarea:focus{ border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }

  /* 버튼 — 상태 버튼은 눌린 게 확실히 보이게 */
  .aibtn, .bp-b, .bp-mode, .mini, .aisave, .bp-save, .bp-all{ border-radius:9px; font-family:inherit; }
  .aibtn, .bp-b{ min-height:36px; }
  .aibtn.on, .bp-b.on, .bp-mode.on{ box-shadow:0 1px 4px rgba(134,38,51,.22); }
  .aisave, .bp-save{ min-height:42px; font-weight:800; }
  .mini{ display:inline-flex; align-items:center; gap:6px; min-height:34px; }
  .bp-save, .aisave{ display:inline-flex; align-items:center; justify-content:center; gap:7px; }
  .bp-all{ display:inline-flex; align-items:center; gap:6px; }

  /* 라벨·섹션 */
  .ailabel{ display:flex; align-items:center; gap:6px; }
  .bp-head{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .attwrap, .cliwrap{ border-style:solid !important; background:#FFFCFC !important; border-radius:12px !important; }
  .cliwrap{ background:#FAFDFD !important; }


  /* 아이콘이 들어간 라벨·배지 정렬 */
  .sechead, .paynote, .rd, .file, .sumline, .copybtn, .ghost{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .badge{ display:inline-flex !important; align-items:center; gap:5px; }
  .file a{ flex:1; min-width:0; }

  /* 상단 바 — 제목/부제 2줄로 고정(부제가 제목을 밀지 않게) */
  .top > div:first-child{ flex-direction:column; align-items:flex-start; gap:2px; }
  h1{ white-space:nowrap; }
  .sub{ line-height:1.4; }
  /* 상태 버튼·이름은 줄바꿈 금지 */
  .bp-b, .aibtn, .pill, .badge, .cls, .mini{ white-space:nowrap; }
  .bp-nm{ flex:0 0 92px; width:92px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bp-st{ gap:6px; }
  .count{ white-space:nowrap; }
  .chead{ gap:7px; }
  .nm{ white-space:nowrap; }
  .meta{ white-space:nowrap; }

  /* 텍스트 라벨은 flex로 만들지 않는다 — 문장이 조각나 gap이 끼어든다. 아이콘은 vertical-align으로 정렬됨 */
  .sechead, .paynote, .rd, .file, .sumline, .bp-head, .ailabel, .hint{ display:block !important; }
  .file a{ flex:none; }
  /* 상단 바 — 부제는 한 줄로 잘라 바 높이를 흔들지 않게 */
  .top{ align-items:center; }
  .top > div:first-child{ flex:1 1 auto; min-width:0; }
  .sub{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

  /* 버튼은 inline-flex + 줄바꿈 금지 (아이콘과 라벨이 한 줄에) */
  .copybtn, .ghost, .mini, .aisave, .bp-save, .bp-all, .listbtn{
    display:inline-flex !important; align-items:center; justify-content:center; gap:6px;
    flex-wrap:nowrap !important; white-space:nowrap; }
  .bp-save{ flex:1; }
  .sumbox .s, .clshead{ white-space:nowrap; }

  /* ── 반응형 (반드시 마지막) — 위 블록들과 동일 특이도라 소스 순서로 이겨야 한다 ── */
  @media (max-width:640px){
    .top{ flex-wrap:wrap; gap:8px 10px; align-items:flex-start; }
    .top > div:first-child{ flex:1 1 100%; }
    .top .kwnav{ margin-left:0; }
    /* 좁은 화면에선 안내 문구를 자르지 않고 접는다 (바는 이미 2줄이므로 높이 손해 없음) */
    .sub{ white-space:normal; overflow:visible; text-overflow:clip; }
  }
</style>

  </div>
  <div class="bar">
    <div class="count" id="count">불러오는 중…</div>
    <input class="search" id="search" placeholder="이름·반 검색" oninput="render()">
  </div>
  <div class="batch" id="batchPanel" style="display:none;">
    <div class="bp-head"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M13.5 2.5 5 13.5h5l-1.5 8L18 10.5h-5z"></path></svg>반별 일괄 <span id="bpModeLabel">출석</span> 체크 <span style="font-weight:500;color:var(--muted);font-size:0.78rem;">· 반을 고르고 학생마다 상태만 눌러 한 번에 저장</span></div>
    <div class="bp-ctrl">
      <select id="bpClass" onchange="bpRenderList()"></select>
      <input type="date" id="bpDate">
    </div>
    <div class="bp-modes">
      <button type="button" id="bpMA" class="bp-mode on" onclick="bpSetMode('att')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>수업 출결</button>
      <button type="button" id="bpMC" class="bp-mode" onclick="bpSetMode('cli')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><rect x="9" y="2.5" width="6" height="4" rx="1"></rect><rect x="4.5" y="4.5" width="15" height="17" rx="2"></rect><path d="M8.5 11h7M8.5 15h5"></path></svg>클리닉</button>
    </div>
    <div id="bpList"></div>
    <div class="bp-foot">
      <button type="button" class="bp-all" onclick="bpAllPresent()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c1-3.2 3.4-4.6 6-4.6s5 1.4 6 4.6"></path><path d="M16 5.4a3.2 3.2 0 0 1 0 5.2M18 20c-.3-1.5-.8-2.7-1.5-3.6"></path></svg>전원 출석</button>
      <button type="button" class="bp-save" id="bpSaveBtn" onclick="bpSave()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M5 4.5h11L19.5 8v11.5H5z"></path><path d="M8.5 4.5v5h7M8.5 19.5v-5h7v5"></path></svg>이 반 저장</button>
    </div>
  </div>
  <div id="content"><div class="msg">불러오는 중…</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
  var token = sessionStorage.getItem('kwmath_admin_pw') || localStorage.getItem('kwmath_admin_pw') || localStorage.getItem('kwmath_admin_token') || null;
  var students = [], attCache = {};
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function showToast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},2400); }
  function logout(){ sessionStorage.removeItem('kwmath_admin_pw'); localStorage.removeItem('kwmath_admin_pw'); location.href='/portal'; }
  function curMonth(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

  async function api(path, opts){
    opts = opts || {}; opts.headers = opts.headers || {};
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    opts.credentials = 'same-origin';
    var r = await fetch(path, opts);
    if (r.status === 401){ logout(); throw new Error('401'); }
    return r;
  }

  function val(v){ return v ? '<span class="v">'+esc(v)+'</span>' : '<span class="v empty">—</span>'; }
  function score(label, g){ return '<div class="sc"><div class="l">'+label+'</div><div class="g'+(g?'':' empty')+'">'+esc(g||'—')+'</div></div>'; }

  function cardHtml(s){
    var appr = (s.approvalStatus==='대기중')
      ? '<span class="badge b-pending">승인대기</span>'
      : (s.approvalStatus==='거부' ? '<span class="badge b-pending">거부</span>' : '<span class="badge b-ok">재원</span>');
    return ''+
    '<div class="card">'+
      '<div class="chead">'+
        '<span class="nm">'+esc(s.name||'(이름없음)')+'</span>'+
        (s.className?'<span class="cls">'+esc(s.className)+'</span>':'')+
        appr+
        '<span class="meta">'+esc(s.school||'')+(s.grade?' · '+esc(s.grade):'')+'</span>'+
      '</div>'+
      '<div class="grid">'+
        '<div class="f"><span class="k">현재 수학 등급</span>'+val(s.level)+'</div>'+
        '<div class="f"><span class="k">선행 진도</span>'+val(s.advanceProgress)+'</div>'+
        '<div class="f"><span class="k">약점 단원</span>'+val(s.weakness)+'</div>'+
        '<div class="f"><span class="k">목표 대학</span>'+val(s.dreamUniv)+'</div>'+
      '</div>'+
      '<div class="scorebox">'+
        score('수학 모의', s.mathMockGrade)+
        score('국어 모의', s.korMockGrade)+
        score('영어 모의', s.engMockGrade)+
        score('내신 수학', s.schoolMathGrade)+
      '</div>'+
      // 🆔 출결·클리닉은 student_id로 지목 — 이름으로 보내면 동명이인 시 남의 기록에 저장된다(2026-07-29 전환)
      '<div class="arow">'+
        '<button class="mini" onclick="toggleAtt(this,\''+esc(String(s.id))+'\')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>수업 출결</button>'+
        '<button class="mini" onclick="toggleClinic(this,\''+esc(String(s.id))+'\')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><rect x="9" y="2.5" width="6" height="4" rx="1"></rect><rect x="4.5" y="4.5" width="15" height="17" rx="2"></rect><path d="M8.5 11h7M8.5 15h5"></path></svg>클리닉</button>'+
      '</div>'+
      '<div class="attwrap" data-id="'+esc(String(s.id))+'"></div>'+
      '<div class="cliwrap" data-id="'+esc(String(s.id))+'"></div>'+
    '</div>';
  }

  function render(){
    var q = ($('search').value||'').trim().toLowerCase();
    var list = students.filter(function(s){
      if(!q) return true;
      return (String(s.name||'').toLowerCase().indexOf(q)>=0) || (String(s.className||'').toLowerCase().indexOf(q)>=0);
    });
    var acad = students.length ? (students[0].academy||'') : '';
    $('count').innerHTML = (acad?esc(acad)+' · ':'')+'학생 <b>'+list.length+'</b>명';
    if(!students.length){ $('content').innerHTML = '<div class="msg">담당 학원에 등록된 학생이 없어요.<br><span style="font-size:0.78rem;">(원장이 학원 배정을 안 했거나, 아직 학생이 없는 경우)</span></div>'; return; }
    if(!list.length){ $('content').innerHTML = '<div class="msg">검색 결과가 없어요.</div>'; return; }
    $('content').innerHTML = list.map(cardHtml).join('');
  }

  async function toggleAtt(btn, sid){
    var box = btn.closest('.card').querySelector('.attwrap');
    if(box.classList.contains('show')){ box.classList.remove('show'); return; }
    box.classList.add('show');
    if(box.dataset.built==='1') return;
    box.dataset.built='1';
    box.innerHTML =
      '<div class="attin">'+
        '<div class="ailabel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>출결 입력</div>'+
        '<div class="air">'+
          '<input type="date" class="aidate" value="'+todayStr()+'">'+
          '<div class="aist">'+
            ['출석','지각','결석','병결','공결'].map(function(s){ return '<button type="button" class="aibtn" data-st="'+s+'">'+s+'</button>'; }).join('')+
          '</div>'+
        '</div>'+
        '<div class="air">'+
          '<input type="number" class="aihw" placeholder="숙제 완료 %" min="0" max="100">'+
          '<button type="button" class="aisave">저장</button>'+
        '</div>'+
      '</div>'+
      '<div class="attsummary">불러오는 중…</div>';
    var btns = box.querySelectorAll('.aibtn');
    btns.forEach(function(b){ b.addEventListener('click', function(){ btns.forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); }); });
    box.querySelector('.aisave').addEventListener('click', function(){ saveAtt(box, sid, this); });
    await loadAttSummary(box, sid);
  }

  async function loadAttSummary(box, sid){
    var sumEl = box.querySelector('.attsummary');
    sumEl.innerHTML = '불러오는 중…';
    try{
      var m = curMonth();
      var r = await api('/api/attendance?id='+encodeURIComponent(sid)+'&month='+m);
      var j = await r.json();
      var rec = (j&&j.records)||{};
      var dates = Object.keys(rec).sort();
      if(!dates.length){ sumEl.innerHTML = '<span style="color:#999;">'+m+' 출결 기록 없음</span>'; return; }
      var c={출석:0,지각:0,결석:0,병결:0,공결:0}, hwSum=0, hwN=0;
      dates.forEach(function(d){ var e=rec[d]||{}; if(c[e.status]!==undefined)c[e.status]++; if(typeof e.homework==='number'){hwSum+=e.homework;hwN++;} });
      var pills='<span class="pill ok">출석 '+c.출석+'</span>'+
        (c.지각?'<span class="pill late">지각 '+c.지각+'</span>':'')+
        (c.결석?'<span class="pill ab">결석 '+c.결석+'</span>':'')+
        (c.병결?'<span class="pill">병결 '+c.병결+'</span>':'')+
        (c.공결?'<span class="pill">공결 '+c.공결+'</span>':'');
      var hw = hwN? '<span class="pill">숙제 평균 '+Math.round(hwSum/hwN)+'%</span>':'';
      var days = dates.map(function(d){ var e=rec[d]||{}; return '<div>'+esc(d.slice(5))+' · '+esc(e.status||'-')+(typeof e.homework==='number'?' · 숙제 '+e.homework+'%':'')+(e.note?' · '+esc(e.note):'')+'</div>'; }).join('');
      sumEl.innerHTML = '<div class="attsum">'+pills+hw+'</div><div style="color:var(--muted);line-height:1.7;">'+days+'</div>';
    }catch(e){ sumEl.innerHTML = '<span style="color:#c0392b;">출결을 불러오지 못했어요.</span>'; }
  }

  async function saveAtt(box, sid, btnEl){
    var date = (box.querySelector('.aidate').value||'').trim();
    if(!date){ showToast('날짜를 선택해주세요.'); return; }
    var stBtn = box.querySelector('.aibtn.on');
    var status = stBtn ? stBtn.dataset.st : '';
    var hwRaw = (box.querySelector('.aihw').value||'').trim();
    var body = { id: sid, date: date };
    body.notifyParent = false;   // 조교 출결 저장은 학부모 자동알림 억제 — 결석·지각·병결 푸시는 원장이 admin에서 확인 후 발송(2026-07-16 확정 방침)
    if(status) body.status = status;
    if(hwRaw!==''){
      var hw = Number(hwRaw);
      if(!isFinite(hw)||hw<0||hw>100){ showToast('숙제 %는 0~100 사이로 입력해주세요.'); return; }
      body.homework = Math.round(hw);
    }
    if(!body.status && body.homework===undefined){ showToast('출결 상태나 숙제 %를 입력해주세요.'); return; }
    var old = btnEl.textContent; btnEl.disabled=true; btnEl.textContent='저장 중…';
    try{
      var r = await api('/api/attendance', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      var j = await r.json().catch(function(){return {};});
      if(!r.ok){ showToast(j.error||'저장에 실패했어요.'); return; }
      showToast(date.slice(5)+' 저장됐어요.');
      box.querySelectorAll('.aibtn').forEach(function(x){x.classList.remove('on');});
      box.querySelector('.aihw').value='';
      await loadAttSummary(box, sid);
    }catch(e){ if(String(e.message)!=='401') showToast('저장 중 오류가 났어요.'); }
    finally{ btnEl.disabled=false; btnEl.textContent=old; }
  }

  function fmtMin(min){ var h=Math.floor(min/60), m=min%60; var s=(h?h+'시간':'')+(m?(h?' ':'')+m+'분':''); return s||'0분'; }

  async function toggleClinic(btn, sid){
    var box = btn.closest('.card').querySelector('.cliwrap');
    if(box.classList.contains('show')){ box.classList.remove('show'); return; }
    box.classList.add('show');
    if(box.dataset.built==='1') return;
    box.dataset.built='1';
    box.innerHTML =
      '<div class="attin">'+
        '<div class="ailabel"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><rect x="9" y="2.5" width="6" height="4" rx="1"></rect><rect x="4.5" y="4.5" width="15" height="17" rx="2"></rect><path d="M8.5 11h7M8.5 15h5"></path></svg>클리닉 입력</div>'+
        '<div class="air">'+
          '<input type="date" class="aidate" value="'+todayStr()+'">'+
          '<div class="aist">'+
            ['출석','지각','결석','병결','공결'].map(function(s){ return '<button type="button" class="aibtn" data-st="'+s+'">'+s+'</button>'; }).join('')+
          '</div>'+
        '</div>'+
        '<div class="air">'+
          '<span class="ailabel2">성취도</span>'+
          '<div class="aist">'+
            [0,25,50,75,100].map(function(v){ return '<button type="button" class="aibtn" data-ach="'+v+'">'+v+'</button>'; }).join('')+
          '</div>'+
        '</div>'+
        '<div class="air">'+
          '<span class="ailabel2">시간</span>'+
          '<input type="number" class="aih" min="0" max="12" placeholder="0"><span class="ailabel2">시간</span>'+
          '<input type="number" class="aim" min="0" max="60" placeholder="0"><span class="ailabel2">분</span>'+
          '<button type="button" class="aisave">저장</button>'+
        '</div>'+
      '</div>'+
      '<div class="clisummary">불러오는 중…</div>';
    var stBtns = box.querySelectorAll('.aibtn[data-st]');
    stBtns.forEach(function(b){ b.addEventListener('click', function(){ stBtns.forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); }); });
    var achBtns = box.querySelectorAll('.aibtn[data-ach]');
    achBtns.forEach(function(b){ b.addEventListener('click', function(){ achBtns.forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); }); });
    box.querySelector('.aisave').addEventListener('click', function(){ saveClinic(box, sid, this); });
    await loadClinicSummary(box, sid);
  }

  async function loadClinicSummary(box, sid){
    var sumEl = box.querySelector('.clisummary');
    sumEl.innerHTML = '불러오는 중…';
    try{
      var m = curMonth();
      var r = await api('/api/clinic?id='+encodeURIComponent(sid)+'&month='+m);
      var j = await r.json();
      var rec = (j&&j.records)||{};
      var dates = Object.keys(rec).sort();
      if(!dates.length){ sumEl.innerHTML = '<span style="color:#999;">'+m+' 클리닉 기록 없음</span>'; return; }
      var c={출석:0,지각:0,결석:0,병결:0,공결:0}, achSum=0, achN=0, minSum=0;
      dates.forEach(function(d){ var e=rec[d]||{}; if(c[e.status]!==undefined)c[e.status]++; if(typeof e.achieve==='number'){achSum+=e.achieve;achN++;} if(typeof e.minutes==='number'){minSum+=e.minutes;} });
      var pills='<span class="pill ok">출석 '+c.출석+'</span>'+
        (c.지각?'<span class="pill late">지각 '+c.지각+'</span>':'')+
        (c.결석?'<span class="pill ab">결석 '+c.결석+'</span>':'')+
        (c.병결?'<span class="pill">병결 '+c.병결+'</span>':'')+
        (c.공결?'<span class="pill">공결 '+c.공결+'</span>':'');
      var extra=(achN?'<span class="pill cli">성취도 평균 '+Math.round(achSum/achN)+'</span>':'')+(minSum?'<span class="pill cli">시간 합계 '+fmtMin(minSum)+'</span>':'');
      var days = dates.map(function(d){ var e=rec[d]||{}; return '<div>'+esc(d.slice(5))+' · '+esc(e.status||'-')+(typeof e.achieve==='number'?' · 성취도 '+e.achieve:'')+(typeof e.minutes==='number'?' · '+fmtMin(e.minutes):'')+(e.note?' · '+esc(e.note):'')+'</div>'; }).join('');
      sumEl.innerHTML = '<div class="attsum">'+pills+extra+'</div><div style="color:var(--muted);line-height:1.7;">'+days+'</div>';
    }catch(e){ sumEl.innerHTML = '<span style="color:#c0392b;">클리닉을 불러오지 못했어요.</span>'; }
  }

  async function saveClinic(box, sid, btnEl){
    var date = (box.querySelector('.aidate').value||'').trim();
    if(!date){ showToast('날짜를 선택해주세요.'); return; }
    var stBtn = box.querySelector('.aibtn[data-st].on');
    var achBtn = box.querySelector('.aibtn[data-ach].on');
    var hRaw = (box.querySelector('.aih').value||'').trim();
    var mRaw = (box.querySelector('.aim').value||'').trim();
    var body = { id: sid, date: date };
    if(stBtn) body.status = stBtn.dataset.st;
    if(achBtn) body.achieve = Number(achBtn.dataset.ach);
    if(hRaw!=='' || mRaw!==''){
      var hh = hRaw===''?0:Number(hRaw), mm = mRaw===''?0:Number(mRaw);
      if(!isFinite(hh)||hh<0||hh>12){ showToast('시간은 0~12 사이로 입력해주세요.'); return; }
      if(!isFinite(mm)||mm<0||mm>60){ showToast('분은 0~60 사이로 입력해주세요.'); return; }
      body.minutes = Math.round(hh)*60 + Math.round(mm);
    }
    if(!body.status && body.achieve===undefined && body.minutes===undefined){ showToast('출결·성취도·시간 중 하나는 입력해주세요.'); return; }
    var old = btnEl.textContent; btnEl.disabled=true; btnEl.textContent='저장 중…';
    try{
      var r = await api('/api/clinic', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      var j = await r.json().catch(function(){return {};});
      if(!r.ok){ showToast(j.error||'저장에 실패했어요.'); return; }
      showToast(date.slice(5)+' 클리닉 저장됐어요.');
      box.querySelectorAll('.aibtn').forEach(function(x){x.classList.remove('on');});
      box.querySelector('.aih').value=''; box.querySelector('.aim').value='';
      await loadClinicSummary(box, sid);
    }catch(e){ if(String(e.message)!=='401') showToast('저장 중 오류가 났어요.'); }
    finally{ btnEl.disabled=false; btnEl.textContent=old; }
  }

  // ── 반별 일괄 출석/클리닉 (관리자 '반별 빠른 출석' 미러, 조교 학원 스코프) ──
  var bpMode='att';   // 'att'=수업출결 /api/attendance, 'cli'=클리닉 /api/clinic
  var STATS=['출석','지각','결석','병결','공결'];
  function bpClassesOf(){
    var seen={}, list=[];
    students.forEach(function(s){ var c=(s.className||'').trim()||'(반 없음)'; if(!seen[c]){seen[c]=1;list.push(c);} });
    list.sort(function(a,b){ return a.localeCompare(b,'ko'); });
    return list;
  }
  function buildBatchPanel(){
    if(!students.length) return;
    $('batchPanel').style.display='block';
    var cls=bpClassesOf();
    $('bpClass').innerHTML=cls.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join('');
    $('bpDate').value=todayStr();
    bpRenderList();
  }
  function bpStudentsOfClass(){
    var c=$('bpClass').value;
    return students.filter(function(s){ return ((s.className||'').trim()||'(반 없음)')===c; })
      .sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','ko'); });
  }
  function bpRenderList(){
    var list=bpStudentsOfClass();
    if(!list.length){ $('bpList').innerHTML='<div class="bp-empty">이 반에 학생이 없어요.</div>'; return; }
    $('bpList').innerHTML=list.map(function(s){
      var nm=esc(s.name||'');
      // 🆔 data-id로 지목 — 이름은 화면 표시용. 동명이인이 같은 반이면 이름만으론 구분 불가(2026-07-29 전환)
      return '<div class="bp-row" data-id="'+esc(String(s.id))+'"><span class="bp-nm">'+nm+'</span><div class="bp-st">'+
        STATS.map(function(st){ return '<button type="button" class="bp-b" data-st="'+st+'" onclick="bpPick(this)">'+st+'</button>'; }).join('')+
        '</div></div>';
    }).join('');
  }
  function bpPick(btn){
    var row=btn.closest('.bp-row'); if(!row) return;
    var on=btn.classList.contains('on');
    row.querySelectorAll('.bp-b').forEach(function(b){ b.classList.remove('on'); });
    if(!on) btn.classList.add('on');
  }
  function bpAllPresent(){
    document.querySelectorAll('#bpList .bp-row').forEach(function(row){
      row.querySelectorAll('.bp-b').forEach(function(b){ b.classList.remove('on'); });
      var first=row.querySelector('.bp-b[data-st="출석"]'); if(first) first.classList.add('on');
    });
  }
  function bpSetMode(m){
    bpMode=m;
    $('bpMA').classList.toggle('on', m==='att');
    $('bpMC').classList.toggle('on', m==='cli');
    $('batchPanel').classList.toggle('cli', m==='cli');
    $('bpModeLabel').textContent = m==='cli' ? '클리닉' : '출석';
  }
  async function bpSave(){
    var date=($('bpDate').value||'').trim();
    if(!date){ showToast('날짜를 선택해주세요.'); return; }
    var rows=Array.prototype.slice.call(document.querySelectorAll('#bpList .bp-row'));
    var jobs=[];
    rows.forEach(function(row){ var on=row.querySelector('.bp-b.on'); if(!on) return; jobs.push({ id: row.getAttribute('data-id'), status: on.dataset.st }); });
    if(!jobs.length){ showToast('상태를 고른 학생이 없어요.'); return; }
    var path = bpMode==='cli' ? '/api/clinic' : '/api/attendance';
    var kind = bpMode==='cli' ? '클리닉' : '출결';
    var btn=$('bpSaveBtn'); btn.disabled=true; var old=btn.textContent; btn.textContent='저장 중…';
    var ok=0, fail=0;
    for(var i=0;i<jobs.length;i++){
      try{
        var body={id:jobs[i].id,date:date,status:jobs[i].status};
        // 조교 일괄은 학부모 자동알림 억제 — 결석·지각·병결 푸시는 원장이 admin에서 확인 후 발송(2026-07-16 확정 방침 보존)
        if(bpMode!=='cli') body.notifyParent=false;
        var r=await api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        if(r.ok) ok++; else fail++;
      }catch(e){ if(String(e.message)==='401'){ return; } fail++; }
    }
    btn.disabled=false; btn.textContent=old;
    showToast(''+kind+' 저장 · '+ok+'명'+(fail?(' · '+fail+'건 실패'):''));
  }

  async function boot(){
    if(!token){ logout(); return; }
    try{
      var r = await api('/api/students');
      var j = await r.json();
      students = Array.isArray(j) ? j : [];
      render();
      buildBatchPanel();
    }catch(e){ if(String(e.message)!=='401') $('content').innerHTML = '<div class="msg">목록을 불러오지 못했어요. 다시 시도해주세요.</div>'; }
  }
  boot();
</script>
<!-- 조교/원장 공통 상단 네비: 홈(역할별) + 메뉴 드롭다운 -->
<script>
(function(){
  try{
    var pw = sessionStorage.getItem('kwmath_admin_pw') || localStorage.getItem('kwmath_admin_pw') || '';
    var home = /^ast_/.test(pw) ? '/staff-home' : '/admin';
    var h = document.getElementById('kwnavHome'); if(h){ h.setAttribute('href', home); }
    var tt = document.getElementById('kwnavTitleHome'); if(tt){ tt.setAttribute('href', home); }
    var path = (location.pathname || '').replace(/\.html$/,''); if(path.length > 1){ path = path.replace(/\/+$/,''); }
    var pop = document.getElementById('kwnavPop');
    if(pop){
      var links = pop.querySelectorAll('a[data-p]');
      for(var i=0;i<links.length;i++){
        if(links[i].getAttribute('data-p') === path){ links[i].className = 'cur'; links[i].removeAttribute('href'); }
      }
    }
    var tog = document.getElementById('kwnavToggle');
    if(tog && pop){
      tog.addEventListener('click', function(e){
        e.stopPropagation();
        var open = pop.classList.toggle('show');
        tog.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', function(ev){
        if(!pop.contains(ev.target) && ev.target !== tog){ pop.classList.remove('show'); tog.setAttribute('aria-expanded','false'); }
      });
    }
    var lo = document.getElementById('kwnavLogout');
    if(lo){
      lo.addEventListener('click', function(e){
        e.preventDefault();
        try{ sessionStorage.removeItem('kwmath_admin_pw'); localStorage.removeItem('kwmath_admin_pw'); localStorage.removeItem('kwmath_admin_token'); }catch(_){}
        location.href = '/portal';
      });
    }
  }catch(_){}
})();
</script>
