<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>방문 통계 · 이관우 수학연구소</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;600;700;900&display=swap');
  :root{ --primary:#862633; --primary-light:#F9ECED; --ink:#241318; --muted:#8A7B75; --border:#E9E1D9; --bg:#F7F5F2;  --hairline:#F1EAE2; --serif:'Noto Serif KR',serif; --primary-mid:#A83040;}
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap{ max-width:760px; margin:0 auto; padding:max(20px,env(safe-area-inset-top,20px)) 18px 48px; }
  .top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  h1{ font-size:1.35rem; margin:6px 0 2px; }
  .sub{ color:var(--muted); font-size:0.84rem; margin-bottom:22px; }
  a.back{ color:var(--primary); text-decoration:none; font-size:0.84rem; font-weight:700; display:inline-block; margin-bottom:6px; }
  .cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:8px; }
  .card{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px 12px; text-align:center; }
  .card .lbl{ font-size:0.8rem; color:var(--muted); margin-bottom:8px; }
  .card .big{ font-size:1.7rem; font-weight:800; color:var(--primary); line-height:1.05; }
  .card .sm{ font-size:0.74rem; color:var(--muted); margin-top:5px; }
  .section-title{ font-weight:700; margin:22px 0 10px; font-size:1rem; }
  .bars{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin:5px 0; font-size:0.8rem; }
  .bar-date{ width:54px; color:var(--muted); flex-shrink:0; }
  .bar-track{ flex:1; background:var(--primary-light); border-radius:6px; height:18px; overflow:hidden; }
  .bar-fill{ display:block; background:var(--primary); height:100%; border-radius:6px; min-width:2px; }
  .bar-val{ width:44px; text-align:right; flex-shrink:0; font-weight:600; }
  /* 💡 유입경로 — 채널 이름이 날짜보다 길어서 .bar-date(54px)를 그대로 쓸 수 없다 */
  .rf-row{ display:flex; align-items:center; gap:10px; margin:6px 0; font-size:0.8rem; width:100%;
           background:none; border:none; padding:0; color:inherit; font-family:inherit; text-align:left; cursor:pointer; }
  .rf-name{ width:152px; flex-shrink:0; line-height:1.3; font-weight:600; }
  .rf-val{ width:80px; text-align:right; flex-shrink:0; font-weight:700; color:var(--primary); }
  .rf-names{ font-size:0.76rem; color:var(--muted); line-height:1.65; padding:0 0 8px 8px; margin:-2px 0 6px; border-left:2px solid var(--primary-light); }
  .rf-chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .rf-chip{ background:#fff; border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:5px 12px; font-size:0.78rem; font-weight:700; }
  .rf-chip.on{ background:var(--primary); border-color:var(--primary); color:#fff; }
  .rf-foot{ font-size:0.77rem; color:var(--muted); margin-top:12px; padding-top:10px; border-top:1px solid var(--border); line-height:1.7; }
  @media (max-width:480px){ .rf-name{ width:98px; font-size:0.75rem; } .rf-val{ width:68px; font-size:0.75rem; } }
  .msg{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:28px 20px; text-align:center; color:var(--muted); line-height:1.6; }
  .login{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:24px; max-width:340px; margin:48px auto; text-align:center; }
  .login input{ width:100%; padding:11px; border:1px solid var(--border); border-radius:10px; margin:12px 0; font-size:1rem; }
  button{ background:var(--primary); color:#fff; border:none; border-radius:10px; padding:10px 18px; font-weight:700; cursor:pointer; font-size:0.92rem; }
  .note{ font-size:0.78rem; color:var(--muted); margin-top:18px; line-height:1.55; }
  /* 상단 통합 네비 (홈 + 메뉴 드롭다운) */
  .kwnav{ display:flex; align-items:center; gap:8px; }
  .kwnav-home{ display:inline-flex; align-items:center; gap:5px; background:var(--primary); color:#fff; font-weight:800; font-size:0.84rem; text-decoration:none; padding:8px 13px; border-radius:9px; font-family:inherit; white-space:nowrap; line-height:1; }
  .kwnav-mw{ position:relative; }
  .kwnav-toggle{ display:inline-flex; align-items:center; gap:5px; background:#fff; color:var(--primary); border:1.5px solid var(--primary); font-weight:800; font-size:0.84rem; padding:6px 13px; border-radius:9px; cursor:pointer; font-family:inherit; white-space:nowrap; line-height:1.25; }
  .kwnav-pop{ position:absolute; right:0; top:calc(100% + 6px); background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,0.16); padding:6px; min-width:196px; z-index:200; display:none; }
  .kwnav-pop.show{ display:block; }
  .kwnav-pop a{ display:block; text-decoration:none; color:var(--ink); font-weight:700; font-size:0.86rem; padding:9px 12px; border-radius:8px; white-space:nowrap; }
  .kwnav-pop a:hover{ background:var(--primary-light); }
  .kwnav-pop a.cur{ background:var(--primary-light); color:var(--primary); cursor:default; }
  .kwnav-pop a.kwnav-logout{ color:var(--muted); border-top:1px solid var(--border); margin-top:4px; }
  .kwnav-pop a.kwnav-logout:hover{ background:#FBE6E6; color:#b3261e; }

  /* ══════════════════════════════════════════════════════════════════════
     2026-08-04 관리자 콘솔 정렬 — 디자인가이드_조교관리자.md
     기능이 한눈에 · 바로 처리. 기존 규칙·DOM·JS는 그대로 두고 여기서만 덮어쓴다.
     되돌리려면 이 블록만 지우면 됩니다.
     ══════════════════════════════════════════════════════════════════════ */
  body{ font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
        letter-spacing:-0.01em; word-break:keep-all; overflow-wrap:break-word; }

  /* 본문 폭·여백 — 상단 바를 화면 끝까지 붙이기 위해 좌우 패딩을 통일 */
  .wrap, .page, .dash-body{ padding-left:16px !important; padding-right:16px !important; }
  .wrap, .page{ max-width:900px; }

  /* ── 상단 바 ① : <div class="wrap"><div class="top"> 패턴 ───────────── */
  .wrap > .top:first-child, body > .top{
    display:flex; align-items:center; gap:12px;
    background:var(--primary); color:#fff;
    position:sticky; top:0; z-index:30;
    margin:0 -16px 18px; padding:max(12px,env(safe-area-inset-top,12px)) 16px 11px; }
  .wrap > .top:first-child > div:first-child, body > .top > div:first-child{
    flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .wrap > .top:first-child h1, body > .top h1, body > .top .title{
    font-size:1rem; font-weight:800; margin:0; color:#fff; letter-spacing:-0.02em;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  .wrap > .top:first-child h1 svg, body > .top .title svg{ opacity:.85; }
  .wrap > .top:first-child .sub, body > .top .sub{
    font-size:0.76rem; color:rgba(255,255,255,0.66); margin:0 !important; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .wrap > .top:first-child .kwnav, body > .top .kwnav{ margin-left:auto; flex:0 0 auto; }
  .wrap > .top:first-child .back, .wrap > .top:first-child > button,
  body > .top .back, body > .top > button{
    margin-left:auto; flex:0 0 auto; color:#fff; background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.28); border-radius:9px; padding:7px 12px;
    font-size:0.78rem; font-weight:700; text-decoration:none; cursor:pointer; font-family:inherit; }

  /* ── 상단 바 ② : <header><div class="headInner"> 패턴 ───────────────── */
  header{ position:sticky; top:0; z-index:30; background:var(--primary) !important;
          border-bottom:none !important; padding:max(12px,env(safe-area-inset-top,12px)) 0 11px !important; }
  header h1{ color:#fff; font-size:1rem; font-weight:800; margin:0; letter-spacing:-0.02em;
             display:inline-flex; align-items:center; gap:7px; }
  header .headInner{ gap:10px; max-width:900px; }
  header button{ background:rgba(255,255,255,0.14) !important; border:1px solid rgba(255,255,255,0.28) !important;
                 color:#fff !important; border-radius:9px; padding:7px 12px; font-size:0.78rem; font-weight:700;
                 cursor:pointer; font-family:inherit; }
  header button.primary{ background:#fff !important; color:var(--primary) !important; border-color:#fff !important; }
  header .count{ background:rgba(255,255,255,0.18); color:#fff; border-radius:999px; padding:2px 9px;
                 font-size:0.78rem; font-weight:800; font-family:var(--serif); }
  /* header 바로 뒤에 붙은 네비 줄(admin-surveys)도 같은 바로 합친다 */
  header + div[style*="flex-end"]{ background:var(--primary) !important; border-bottom:none !important;
        position:sticky; top:0; z-index:29; padding:0 14px 9px !important; margin-top:-1px; }

  /* ── 상단 바 ③ : .topbar 패턴 (이미 와인) ─────────────────────────── */
  .topbar{ position:sticky; top:0; z-index:30; padding:max(12px,env(safe-area-inset-top,12px)) 16px 12px; }
  .topbar-title{ font-size:1rem; font-weight:800; letter-spacing:-0.02em;
                 display:inline-flex; align-items:center; gap:7px; }
  .topbar-title svg{ opacity:.85; }

  /* ── 상단 바 ④ : .wrap 첫 자식이 .kwnav 인 패턴 (makeup·notify·stats) ─ */
  .wrap > .kwnav:first-child{
    background:var(--primary); position:sticky; top:0; z-index:30;
    margin:0 -16px 16px; padding:max(11px,env(safe-area-inset-top,11px)) 16px 10px;
    justify-content:flex-end; }
  /* 이 패턴에서 제목은 바 아래 크림 배경에 온다 */
  .wrap > .kwnav:first-child ~ h1{ font-size:1.12rem; font-weight:800; color:var(--primary);
    margin:0 0 5px; letter-spacing:-0.02em; display:flex; align-items:center; gap:8px; }
  .wrap > .kwnav:first-child ~ .sub{ font-size:0.82rem; line-height:1.55; margin:0 0 16px; }
  /* stats: kwnav 바 다음의 .top 은 평범한 제목 줄로 (와인 바 중복 방지) */
  .wrap > .kwnav:first-child + .top{
    background:transparent; position:static; margin:0 0 16px; padding:0;
    display:flex; align-items:flex-end; gap:12px; }
  .wrap > .kwnav:first-child + .top h1{ color:var(--primary); font-size:1.12rem; font-weight:800; margin:0;
    display:inline-flex; align-items:center; gap:8px; }
  .wrap > .kwnav:first-child + .top .sub{ color:var(--text-light,var(--muted)); font-size:0.8rem; margin:4px 0 0 !important; }
  .wrap > .kwnav:first-child + .top > button{ margin-left:auto; background:#fff; color:var(--primary);
    border:1.5px solid var(--primary); border-radius:9px; padding:7px 13px; font-size:0.8rem; font-weight:700; }

  /* 와인 바 안의 공유 네비는 반투명 흰색으로 */
  .wrap > .top:first-child .kwnav-home, .wrap > .top:first-child .kwnav-toggle,
  body > .top .kwnav-home, body > .top .kwnav-toggle,
  header .kwnav-home, header .kwnav-toggle,
  header + div[style*="flex-end"] .kwnav-home, header + div[style*="flex-end"] .kwnav-toggle,
  .wrap > .kwnav:first-child .kwnav-home, .wrap > .kwnav:first-child .kwnav-toggle,
  .topbar .kwnav-home, .topbar .kwnav-toggle{
    background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28); color:#fff; padding:7px 12px; }
  .wrap > .top:first-child .kwnav-home:hover, body > .top .kwnav-home:hover, header .kwnav-home:hover,
  .wrap > .kwnav:first-child .kwnav-home:hover, .topbar .kwnav-home:hover,
  .wrap > .top:first-child .kwnav-toggle:hover, body > .top .kwnav-toggle:hover, header .kwnav-toggle:hover,
  .wrap > .kwnav:first-child .kwnav-toggle:hover, .topbar .kwnav-toggle:hover{ background:rgba(255,255,255,0.24); }

  /* ── 카드·면 ── */
  .card, .msg, .note, .box, .cfg, .intro, .summary, .state-box, .grid-card, .batch, .detail{
    border-color:var(--border,var(--line)) !important; box-shadow:0 1px 3px rgba(70,20,35,.04) !important; }

  /* ── 숫자는 세리프 — 처리할 개수가 먼저 보이게 ── */
  .count, .cnt, .big, .num, .avg, .score-big, .stat .v, .summary .v, .pill, .badge, .cbadge,
  .b-cnt, .nft-count, .bar-val, .cmin, .sm{ font-family:var(--serif); }

  /* ── 입력 — 터치 타깃 · 포커스 와인 링 ── */
  input, select, textarea, button{ font-family:inherit; }
  input[type=text], input[type=password], input[type=number], input[type=date], input[type=month],
  input[type=tel], input[type=search], select, textarea, .search, .login-input{
    border:1.5px solid var(--border,var(--line)); border-radius:10px; outline:none;
    transition:border-color .12s, box-shadow .12s; }
  input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, input[type=date]:focus,
  input[type=month]:focus, input[type=tel]:focus, input[type=search]:focus, select:focus, textarea:focus,
  .search:focus, .login-input:focus{ border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }

  /* ── 버튼 — 아이콘+라벨 한 줄, 눌린 상태 확실히 ── */
  .mini, .ghost, .btn-primary, .b-pri, .b-sec, .save, .aisave, .bp-save, .bp-all, .listbtn,
  .pushbtn, .b-reopen, .b-done, .b-del, .b-ghost, .restore, .del, .up, .hide, .act, .dl, .jump{
    display:inline-flex !important; align-items:center; justify-content:center; gap:6px;
    flex-wrap:nowrap !important; white-space:nowrap; border-radius:9px; font-family:inherit; }
  .tab-btn, .tabs button, .mtab, .seg button, .chip, .nft-btn, .bp-mode, .modeTabs button{
    border-radius:9px; font-family:inherit; white-space:nowrap; }
  .tab-btn.active, .tabs .on, .mtab.on, .seg .on, .chip.on, .nft-btn.on, .bp-mode.on{
    box-shadow:0 1px 4px rgba(134,38,51,.22); }

  /* ── 텍스트 라벨은 flex로 만들지 않는다 (문장이 조각나 gap이 끼어든다) ── */
  .sechead, .paynote, .section-label, .panel-title, .menu-sec-t, .cardHead, .stHead, .section-title{
    display:block !important; }
  .badge, .pill, .cbadge, .tag{ display:inline-flex !important; align-items:center; gap:5px; white-space:nowrap; }

  /* ── 표 ── */
  table{ border-collapse:collapse; }
  th{ font-weight:700; color:var(--text-light,var(--muted)); font-size:0.78rem; }
  td, th{ border-color:var(--hairline,var(--border)) !important; }
  td.num, td.n, .num{ text-align:right; font-family:var(--serif); }

  /* ── 반응형 (반드시 마지막) — 위 블록과 동일 특이도라 소스 순서로 이겨야 한다 ── */
  @media (max-width:640px){
    .wrap > .top:first-child, body > .top{ flex-wrap:wrap; gap:8px 10px; align-items:flex-start; }
    .wrap > .top:first-child > div:first-child, body > .top > div:first-child{ flex:1 1 100%; }
    .wrap > .top:first-child .kwnav, body > .top .kwnav{ margin-left:0; }
    .wrap > .top:first-child .sub, body > .top .sub{ white-space:normal; overflow:visible; text-overflow:clip; }
    header .headInner{ flex-wrap:wrap; }
  }

  /* 빈 배지·개수 칩은 다시 숨긴다 — 위 !important 규칙에 눌려 있던 원본 동작 복원 */
  .badge:empty, .pill:empty, .cbadge:empty, .tag:empty, .bdg:empty, .b-cnt:empty, .cnt:empty, .count:empty{
    display:none !important; }
  .section-title{ display:flex !important; align-items:center; gap:7px; }
</style>

        <a role="menuitem" href="/staff-materials" data-p="/staff-materials"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path><path d="M4 18a2.5 2.5 0 0 1 2.5-2.5H20"></path></svg>수업자료</a>
        <a role="menuitem" href="/admin-surveys" data-p="/admin-surveys"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M4 20l1.2-4.2L16.4 4.6a2 2 0 0 1 2.8 2.8L8 18.6 4 20z"></path><path d="M14.5 6.5l2.8 2.8"></path></svg>테스트</a>
        <a role="menuitem" href="/staff-worklog" data-p="/staff-worklog"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>근무기록</a>
        <a role="menuitem" href="#" class="kwnav-logout" id="kwnavLogout">🚪 로그아웃</a>
      </div>
    </div>
  </div>
  <div class="top">
    <div>
      <h1><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;"><path d="M6 20V12"></path><path d="M12 20V5"></path><path d="M18 20V9"></path></svg>방문 통계</h1>
      <div class="sub">이관우 수학연구소 · Cloudflare Web Analytics</div>
    </div>
    <button id="reloadBtn" onclick="load()" style="display:none;">새로고침</button>
  </div>
  <div id="content"><div class="msg">불러오는 중…</div></div>
  <!-- 💡 유입경로 — #content 밖에 둔다. render()가 #content를 통째로 갈아끼우므로
       안에 두면 방문 통계를 다시 그릴 때마다 사라진다. Cloudflare 토큰이 없어도 이 블록은 살아 있다. -->
  <div id="refBox"></div>
  <div class="note" id="note"></div>
</div>
<script>
  var token = sessionStorage.getItem('kwmath_admin_pw') || localStorage.getItem('kwmath_admin_pw') || localStorage.getItem('kwmath_admin_token') || null;

  function $(id){ return document.getElementById(id); }
  function fmt(n){ return (n || 0).toLocaleString('ko-KR'); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function showLogin(err){
    $('reloadBtn').style.display = 'none';
    $('note').innerHTML = '';
    refStudents = null;                                  // 로그인 화면에서는 유입경로도 지운다
    if ($('refBox')) $('refBox').innerHTML = '';
    $('content').innerHTML =
      '<div class="login"><div style="font-weight:700;">관리자 비밀번호</div>' +
      '<input type="password" id="pw" placeholder="비밀번호" onkeydown="if(event.key===\'Enter\')doLogin()">' +
      (err ? '<div style="color:#c0392b;font-size:0.8rem;margin-bottom:8px;">' + esc(err) + '</div>' : '') +
      '<button onclick="doLogin()">확인</button></div>';
    var p = $('pw'); if (p) p.focus();
  }
  function doLogin(){
    token = ($('pw').value || '').trim();
    if (!token) return;
    sessionStorage.setItem('kwmath_admin_pw', token);
    load();
  }

  async function load(){
    $('content').innerHTML = '<div class="msg">불러오는 중…</div>';
    var headers = {};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    if (token) loadReferral(headers);      // 💡 유입경로 — 병렬로 부른다(방문 통계를 기다리게 하지 않는다)
    var r;
    try { r = await fetch('/api/admin-analytics', { headers: headers, credentials: 'same-origin' }); }
    catch (e) { $('content').innerHTML = '<div class="msg">네트워크 오류. 다시 시도해 주세요.</div>'; return; }
    if (r.status === 401) {
      sessionStorage.removeItem('kwmath_admin_pw');
      var had = token; token = null;
      showLogin(had ? '비밀번호가 틀렸습니다' : '');
      return;
    }
    var d = await r.json().catch(function(){ return null; });
    if (!d) { $('content').innerHTML = '<div class="msg">응답 오류</div>'; return; }
    render(d);
  }

  function card(lbl, v){
    v = v || {};
    return '<div class="card"><div class="lbl">' + lbl + '</div>' +
      '<div class="big">' + fmt(v.visits) + '</div>' +
      '<div class="sm">방문 · 페이지뷰 ' + fmt(v.views) + '</div></div>';
  }

  function render(d){
    $('reloadBtn').style.display = '';
    if (d.configured === false) {
      $('content').innerHTML = '<div class="msg">Cloudflare API 토큰(<b>CF_ANALYTICS_TOKEN</b>)이 아직 등록되지 않았어요.<br>환경변수 등록 후 재배포하면 표시됩니다.</div>';
      return;
    }
    if (d.error) {
      $('content').innerHTML = '<div class="msg">조회 오류: ' + esc(d.error) +
        (d.detail ? '<br><small>' + esc(JSON.stringify(d.detail)) + '</small>' : '') + '</div>';
      return;
    }
    var html = '<div class="cards">' + card('오늘', d.today) + card('최근 7일', d.week) + card('최근 30일', d.month) + '</div>';
    var daily = (d.daily || []).slice(-30);
    if (daily.length) {
      var max = Math.max.apply(null, daily.map(function(x){ return x.visits || 0; }).concat([1]));
      html += '<div class="section-title">일별 방문 (최근 ' + daily.length + '일)</div><div class="bars">';
      daily.forEach(function(x){
        var w = Math.round((x.visits || 0) / max * 100);
        html += '<div class="bar-row"><span class="bar-date">' + esc((x.date || '').slice(5)) + '</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:' + w + '%"></span></span>' +
          '<span class="bar-val">' + fmt(x.visits) + '</span></div>';
      });
      html += '</div>';
    }
    $('content').innerHTML = html;
    $('note').innerHTML = '방문(Visits)=고유 방문 세션, 페이지뷰=총 열람 수. 데이터는 Web Analytics를 켠 시점부터 집계되고, 실시간이 아니라 몇 분 지연될 수 있어요.' +
      (d.updatedAt ? '<br>업데이트: ' + esc(d.updatedAt.replace('T', ' ').slice(0, 16)) : '');
  }

  // ══ 💡 유입경로 — 등록 신청자가 스스로 적은 "저를 어떻게 알게 되셨나요" 집계 ══════
  //  왜 이 화면에 붙였나
  //    방문 수는 "몇 명이 왔나"만 말하고 "어디서 왔나"는 말해주지 않는다.
  //    register.html 의 필수 항목 💡「저를 어떻게 알게 되셨나요」는 이미 쌓이고 있는데,
  //    지금까지는 admin.html 학생 카드를 한 명씩 열어야만 볼 수 있었다(admin.html:3123).
  //  원칙
  //    ① 새 API를 만들지 않는다 — 이미 있는 /api/students 를 그대로 쓴다.
  //    ② 실패하면 이 블록만 조용히 사라진다. 위쪽 방문 통계는 그대로 살아 있다.
  //    ③ 없는 숫자를 만들지 않는다. 미기재·기간 밖 인원은 각주에 그대로 밝힌다.
  //       (등록일 created_at 은 DB 기본값에 의존해 비어 있을 수 있다 → 값이 있는 학생이
  //        하나도 없으면 기간 칩을 아예 띄우지 않는다. 못 믿을 필터는 안 보이는 게 낫다.)
  var refStudents = null;      // null = 아직 못 불러옴 → 블록을 그리지 않는다
  var refDays = 0;             // 0 = 전체 기간
  var refOpen = {};            // 펼친 채널 (학생 이름 목록) — 정렬 순서 기준 index

  function refHasDate(s){ return /^\d{4}-\d{2}-\d{2}/.test(String((s && s.createdAt) || '')); }

  function refAgg(days){
    // 거부한 신청은 유입 성과가 아니므로 뺀다. 대기중은 센다 —
    // "이 경로로 문을 두드렸다"는 사실이고, 승인이 늦을 때 최근 경로가 통째로 사라지는 게 더 위험하다.
    var list = (refStudents || []).filter(function(s){ return s && s.approvalStatus !== '거부'; });
    var dropped = 0;
    if (days) {
      var from = new Date(Date.now() + 9*3600000 - (days-1)*86400000).toISOString().slice(0,10);
      var before = list.length;
      list = list.filter(function(s){ return refHasDate(s) && String(s.createdAt).slice(0,10) >= from; });
      dropped = before - list.length;         // 기간 밖 + 등록일이 빈 학생
    }
    var counts = {}, names = {}, who = {}, etc = [], blank = 0;
    list.forEach(function(s){
      var ch = String(s.referral || '').trim();
      if (!ch) { blank++; return; }
      counts[ch] = (counts[ch] || 0) + 1;
      (names[ch] = names[ch] || []).push(String(s.name || '(이름없음)'));
      var d = String(s.referralDetail || '').trim();
      if (!d) return;
      if (ch === '친구·지인 추천') who[d] = (who[d] || 0) + 1;   // 상세칸이 사람 이름인 경우
      else if (ch === '기타') etc.push(d);                       // 상세칸이 자유서술 → 놓친 채널 후보
    });
    var rows = Object.keys(counts).map(function(k){ return { ch:k, n:counts[k], names:names[k] }; });
    rows.sort(function(a, b){ return b.n - a.n || a.ch.localeCompare(b.ch, 'ko'); });
    var whoRows = Object.keys(who).map(function(k){ return { name:k, n:who[k] }; });
    whoRows.sort(function(a, b){ return b.n - a.n || a.name.localeCompare(b.name, 'ko'); });
    return { rows:rows, whoRows:whoRows, etc:etc, blank:blank,
             answered:(list.length - blank), total:list.length, dropped:dropped };
  }

  function setRefDays(d){ refDays = d; refOpen = {}; renderReferral(); }   // 기간이 바뀌면 순서도 바뀐다 → 펼침 초기화
  function refToggle(i){ if (refOpen[i]) delete refOpen[i]; else refOpen[i] = 1; renderReferral(); }

  function renderReferral(){
    var host = $('refBox');
    if (!host) return;
    if (!token || !refStudents || !refStudents.length) { host.innerHTML = ''; return; }
    var a = refAgg(refDays);
    var anyDate = refStudents.some(refHasDate);
    var chip = function(d, lbl){
      return '<button type="button" class="rf-chip' + (refDays === d ? ' on' : '') +
             '" onclick="setRefDays(' + d + ')">' + lbl + '</button>';
    };
    var html = '<div class="section-title"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M9.5 17.5h5M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9V17.5h7V13.9A6 6 0 0 0 12 3z"></path></svg>어떻게 알고 오셨나 (등록 신청 기준)</div>' +
      '<div class="rf-chips">' + chip(0, '전체') + (anyDate ? chip(365, '최근 1년') + chip(90, '최근 3개월') : '') + '</div>' +
      '<div class="bars">';
    if (!a.rows.length) {
      html += '<div style="color:var(--muted);font-size:0.84rem;text-align:center;padding:6px 0;">이 기간에 적힌 유입경로가 없습니다.</div>';
    } else {
      var max = a.rows[0].n;
      a.rows.forEach(function(r, i){
        var w = Math.round(r.n / max * 100);
        var pct = a.answered ? Math.round(r.n / a.answered * 100) : 0;
        html += '<button type="button" class="rf-row" onclick="refToggle(' + i + ')" title="눌러서 학생 이름 보기">' +
          '<span class="rf-name">' + (refOpen[i] ? '▾ ' : '▸ ') + esc(r.ch) + '</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:' + w + '%"></span></span>' +
          '<span class="rf-val">' + fmt(r.n) + '명 · ' + pct + '%</span></button>';
        if (refOpen[i]) html += '<div class="rf-names">' + r.names.map(esc).join(' · ') + '</div>';
      });
    }
    html += '</div>';
    var foot = ['응답 ' + fmt(a.answered) + '명 기준' +
      (a.blank ? ' · 미기재 ' + fmt(a.blank) + '명 (유입경로 항목이 생기기 전에 등록한 학생)' : '')];
    if (refDays && a.dropped) foot.push('기간 밖이거나 등록일이 비어 있는 ' + fmt(a.dropped) + '명은 빠졌습니다.');
    if (a.whoRows.length) {
      foot.push('🙌 소개해 주신 분: ' + a.whoRows.slice(0, 8).map(function(x){
        return esc(x.name) + (x.n > 1 ? ' (' + x.n + '명)' : '');
      }).join(' · ') + (a.whoRows.length > 8 ? ' 외 ' + (a.whoRows.length - 8) + '명' : ''));
    }
    if (a.etc.length) foot.push('✍️ 「기타」에 적힌 내용: ' + a.etc.slice(0, 6).map(esc).join(' · ') +
      (a.etc.length > 6 ? ' 외 ' + (a.etc.length - 6) + '건' : '') + ' — 같은 말이 반복되면 선택지로 올릴 때입니다.');
    host.innerHTML = html + '<div class="rf-foot">' + foot.join('<br>') + '</div>';
  }

  async function loadReferral(headers){
    try {
      var r = await fetch('/api/students', { headers: headers, credentials: 'same-origin' });
      if (!r.ok) return;                                  // 401 등 → 위쪽 방문 통계가 이미 로그인 화면을 띄운다
      var list = await r.json().catch(function(){ return null; });
      if (!Array.isArray(list)) return;
      refStudents = list;
      renderReferral();
    } catch (_) { /* 부가 정보 — 실패해도 방문 통계는 그대로 */ }
  }

  load();
</script>
<!-- 조교/원장 공통 상단 네비: 홈(역할별) + 메뉴 드롭다운 -->
<script>
(function(){
  try{
    var pw = sessionStorage.getItem('kwmath_admin_pw') || localStorage.getItem('kwmath_admin_pw') || '';
    var home = /^ast_/.test(pw) ? '/staff-home' : '/admin';
    var h = document.getElementById('kwnavHome'); if(h){ h.setAttribute('href', home); }
    var path = (location.pathname || '').replace(/\.html$/,''); if(path.length > 1){ path = path.replace(/\/+$/,''); }
    var pop = document.getElementById('kwnavPop');
    if(pop){
      var links = pop.querySelectorAll('a[data-p]');
      for(var i=0;i<links.length;i++){
        if(links[i].getAttribute('data-p') === path){ links[i].className = 'cur'; links[i].removeAttribute('href'); }
      }
    }
    var tog = document.getElementById('kwnavToggle');
    if(tog && pop){
      tog.addEventListener('click', function(e){
        e.stopPropagation();
        var open = pop.classList.toggle('show');
        tog.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', function(ev){
        if(!pop.contains(ev.target) && ev.target !== tog){ pop.classList.remove('show'); tog.setAttribute('aria-expanded','false'); }
      });
    }
    var lo = document.getElementById('kwnavLogout');
    if(lo){
      lo.addEventListener('click', function(e){
        e.preventDefault();
        try{ sessionStorage.removeItem('kwmath_admin_pw'); localStorage.removeItem('kwmath_admin_pw'); localStorage.removeItem('kwmath_admin_token'); }catch(_){}
        location.href = '/portal';
      });
    }
  }catch(_){}
})();
</script>
<!-- ☰ 메뉴에 원장 전용 화면 채우기 (2026-07-29) — 위 인라인 네비 스크립트 뒤에 실려야 한다(#kwnavPop이 만들어진 뒤여야 하므로) -->
<script src="/kwnav.js?v=1"></script>
</body>
