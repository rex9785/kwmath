<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>알림 보내기 · 이관우 수학연구소</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;600;700;900&display=swap');
  :root{ --primary:#862633; --primary-light:#F9ECED; --ink:#241318; --muted:#8A7B75; --border:#E9E1D9; --bg:#F7F5F2;  --hairline:#F1EAE2; --serif:'Noto Serif KR',serif; --primary-mid:#A83040;}
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap{ max-width:760px; margin:0 auto; padding:max(20px,env(safe-area-inset-top,20px)) 18px 48px; }
  a.back{ color:var(--primary); text-decoration:none; font-size:0.84rem; font-weight:700; display:inline-block; margin-bottom:6px; }
  h1{ font-size:1.35rem; margin:6px 0 2px; }
  .sub{ color:var(--muted); font-size:0.84rem; margin-bottom:22px; line-height:1.5; }
  .msg{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:28px 20px; text-align:center; color:var(--muted); line-height:1.6; }
  .login{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:24px; max-width:340px; margin:48px auto; text-align:center; }
  .login input{ width:100%; padding:11px; border:1px solid var(--border); border-radius:10px; margin:12px 0; font-size:1rem; }
  button{ background:var(--primary); color:#fff; border:none; border-radius:10px; padding:10px 18px; font-weight:700; cursor:pointer; font-size:0.92rem; }
  button:disabled{ opacity:0.55; cursor:default; }
  .field{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .field > label{ display:block; font-weight:700; font-size:0.9rem; margin-bottom:8px; }
  .field .opt{ color:var(--muted); font-weight:400; font-size:0.8rem; }
  select, input[type=text], textarea{ width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-size:0.95rem; font-family:inherit; background:#fff; color:var(--ink); }
  textarea{ resize:vertical; line-height:1.55; }
  .stHead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cnt{ color:var(--primary); font-weight:700; font-size:0.82rem; }
  .mini{ padding:5px 12px; font-size:0.78rem; border-radius:8px; }
  .studentGrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px; max-height:260px; overflow-y:auto; padding:2px; }
  .stItem{ display:flex; align-items:center; gap:7px; padding:8px 10px; border:1px solid var(--border); border-radius:10px; cursor:pointer; font-size:0.86rem; background:#fff; }
  .stItem input{ margin:0; flex-shrink:0; }
  .stItem .nm{ font-weight:600; }
  .stItem .mt{ color:var(--muted); font-size:0.74rem; margin-left:auto; text-align:right; }
  .empty{ color:var(--muted); font-size:0.85rem; padding:14px; text-align:center; }
  .aud{ display:flex; gap:8px; flex-wrap:wrap; }
  .aud .radio{ display:flex; align-items:center; gap:6px; padding:9px 14px; border:1px solid var(--border); border-radius:10px; cursor:pointer; font-size:0.88rem; }
  .aud .radio input{ margin:0; }
  .sendBar{ margin-top:6px; }
  .sendBar button{ width:100%; padding:13px; font-size:1rem; }
  .result{ margin-top:12px; border-radius:12px; padding:14px 16px; font-size:0.9rem; line-height:1.5; }
  .result.ok{ background:var(--primary-light); color:var(--primary); border:1px solid var(--border); }
  .result.err{ background:#fdecec; color:#c0392b; border:1px solid #f5c6c6; }
  /* 보낸 알림 관리(회수) */
  .sentList{ display:flex; flex-direction:column; gap:6px; max-height:420px; overflow-y:auto; padding:2px; }
  .ntItem{ display:flex; align-items:flex-start; gap:9px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; cursor:pointer; background:#fff; }
  .ntItem input{ margin:3px 0 0; flex-shrink:0; }
  .ntMain{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .ntTop{ font-size:0.76rem; color:var(--muted); }
  .ntTop b{ color:var(--ink); font-size:0.84rem; }
  .ntTitle{ font-size:0.86rem; font-weight:700; }
  .ntBody{ font-size:0.8rem; color:var(--muted); line-height:1.45; word-break:break-all; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .rd{ color:#2e7d32; } .unrd{ color:#c0392b; }
  .mini.danger{ background:#c0392b; }
  /* 상단 통합 네비 (홈 + 메뉴 드롭다운) */
  .kwnav{ display:flex; align-items:center; gap:8px; }
  .kwnav-home{ display:inline-flex; align-items:center; gap:5px; background:var(--primary); color:#fff; font-weight:800; font-size:0.84rem; text-decoration:none; padding:8px 13px; border-radius:9px; font-family:inherit; white-space:nowrap; line-height:1; }
  .kwnav-mw{ position:relative; }
  .kwnav-toggle{ display:inline-flex; align-items:center; gap:5px; background:#fff; color:var(--primary); border:1.5px solid var(--primary); font-weight:800; font-size:0.84rem; padding:6px 13px; border-radius:9px; cursor:pointer; font-family:inherit; white-space:nowrap; line-height:1.25; }
  .kwnav-pop{ position:absolute; right:0; top:calc(100% + 6px); background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,0.16); padding:6px; min-width:196px; z-index:200; display:none; }
  .kwnav-pop.show{ display:block; }
  .kwnav-pop a{ display:block; text-decoration:none; color:var(--ink); font-weight:700; font-size:0.86rem; padding:9px 12px; border-radius:8px; white-space:nowrap; }
  .kwnav-pop a:hover{ background:var(--primary-light); }
  .kwnav-pop a.cur{ background:var(--primary-light); color:var(--primary); cursor:default; }
  .kwnav-pop a.kwnav-logout{ color:var(--muted); border-top:1px solid var(--border); margin-top:4px; }
  .kwnav-pop a.kwnav-logout:hover{ background:#FBE6E6; color:#b3261e; }

  /* ══════════════════════════════════════════════════════════════════════
     2026-08-04 관리자 콘솔 정렬 — 디자인가이드_조교관리자.md
     기능이 한눈에 · 바로 처리. 기존 규칙·DOM·JS는 그대로 두고 여기서만 덮어쓴다.
     되돌리려면 이 블록만 지우면 됩니다.
     ══════════════════════════════════════════════════════════════════════ */
  body{ font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
        letter-spacing:-0.01em; word-break:keep-all; overflow-wrap:break-word; }

  /* 본문 폭·여백 — 상단 바를 화면 끝까지 붙이기 위해 좌우 패딩을 통일 */
  .wrap, .page, .dash-body{ padding-left:16px !important; padding-right:16px !important; }
  .wrap, .page{ max-width:900px; }

  /* ── 상단 바 ① : <div class="wrap"><div class="top"> 패턴 ───────────── */
  .wrap > .top:first-child, body > .top{
    display:flex; align-items:center; gap:12px;
    background:var(--primary); color:#fff;
    position:sticky; top:0; z-index:30;
    margin:0 -16px 18px; padding:max(12px,env(safe-area-inset-top,12px)) 16px 11px; }
  .wrap > .top:first-child > div:first-child, body > .top > div:first-child{
    flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .wrap > .top:first-child h1, body > .top h1, body > .top .title{
    font-size:1rem; font-weight:800; margin:0; color:#fff; letter-spacing:-0.02em;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  .wrap > .top:first-child h1 svg, body > .top .title svg{ opacity:.85; }
  .wrap > .top:first-child .sub, body > .top .sub{
    font-size:0.76rem; color:rgba(255,255,255,0.66); margin:0 !important; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .wrap > .top:first-child .kwnav, body > .top .kwnav{ margin-left:auto; flex:0 0 auto; }
  .wrap > .top:first-child .back, .wrap > .top:first-child > button,
  body > .top .back, body > .top > button{
    margin-left:auto; flex:0 0 auto; color:#fff; background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.28); border-radius:9px; padding:7px 12px;
    font-size:0.78rem; font-weight:700; text-decoration:none; cursor:pointer; font-family:inherit; }

  /* ── 상단 바 ② : <header><div class="headInner"> 패턴 ───────────────── */
  header{ position:sticky; top:0; z-index:30; background:var(--primary) !important;
          border-bottom:none !important; padding:max(12px,env(safe-area-inset-top,12px)) 0 11px !important; }
  header h1{ color:#fff; font-size:1rem; font-weight:800; margin:0; letter-spacing:-0.02em;
             display:inline-flex; align-items:center; gap:7px; }
  header .headInner{ gap:10px; max-width:900px; }
  header button{ background:rgba(255,255,255,0.14) !important; border:1px solid rgba(255,255,255,0.28) !important;
                 color:#fff !important; border-radius:9px; padding:7px 12px; font-size:0.78rem; font-weight:700;
                 cursor:pointer; font-family:inherit; }
  header button.primary{ background:#fff !important; color:var(--primary) !important; border-color:#fff !important; }
  header .count{ background:rgba(255,255,255,0.18); color:#fff; border-radius:999px; padding:2px 9px;
                 font-size:0.78rem; font-weight:800; font-family:var(--serif); }
  /* header 바로 뒤에 붙은 네비 줄(admin-surveys)도 같은 바로 합친다 */
  header + div[style*="flex-end"]{ background:var(--primary) !important; border-bottom:none !important;
        position:sticky; top:0; z-index:29; padding:0 14px 9px !important; margin-top:-1px; }

  /* ── 상단 바 ③ : .topbar 패턴 (이미 와인) ─────────────────────────── */
  .topbar{ position:sticky; top:0; z-index:30; padding:max(12px,env(safe-area-inset-top,12px)) 16px 12px; }
  .topbar-title{ font-size:1rem; font-weight:800; letter-spacing:-0.02em;
                 display:inline-flex; align-items:center; gap:7px; }
  .topbar-title svg{ opacity:.85; }

  /* ── 상단 바 ④ : .wrap 첫 자식이 .kwnav 인 패턴 (makeup·notify·stats) ─ */
  .wrap > .kwnav:first-child{
    background:var(--primary); position:sticky; top:0; z-index:30;
    margin:0 -16px 16px; padding:max(11px,env(safe-area-inset-top,11px)) 16px 10px;
    justify-content:flex-end; }
  /* 이 패턴에서 제목은 바 아래 크림 배경에 온다 */
  .wrap > .kwnav:first-child ~ h1{ font-size:1.12rem; font-weight:800; color:var(--primary);
    margin:0 0 5px; letter-spacing:-0.02em; display:flex; align-items:center; gap:8px; }
  .wrap > .kwnav:first-child ~ .sub{ font-size:0.82rem; line-height:1.55; margin:0 0 16px; }
  /* stats: kwnav 바 다음의 .top 은 평범한 제목 줄로 (와인 바 중복 방지) */
  .wrap > .kwnav:first-child + .top{
    background:transparent; position:static; margin:0 0 16px; padding:0;
    display:flex; align-items:flex-end; gap:12px; }
  .wrap > .kwnav:first-child + .top h1{ color:var(--primary); font-size:1.12rem; font-weight:800; margin:0;
    display:inline-flex; align-items:center; gap:8px; }
  .wrap > .kwnav:first-child + .top .sub{ color:var(--text-light,var(--muted)); font-size:0.8rem; margin:4px 0 0 !important; }
  .wrap > .kwnav:first-child + .top > button{ margin-left:auto; background:#fff; color:var(--primary);
    border:1.5px solid var(--primary); border-radius:9px; padding:7px 13px; font-size:0.8rem; font-weight:700; }

  /* 와인 바 안의 공유 네비는 반투명 흰색으로 */
  .wrap > .top:first-child .kwnav-home, .wrap > .top:first-child .kwnav-toggle,
  body > .top .kwnav-home, body > .top .kwnav-toggle,
  header .kwnav-home, header .kwnav-toggle,
  header + div[style*="flex-end"] .kwnav-home, header + div[style*="flex-end"] .kwnav-toggle,
  .wrap > .kwnav:first-child .kwnav-home, .wrap > .kwnav:first-child .kwnav-toggle,
  .topbar .kwnav-home, .topbar .kwnav-toggle{
    background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28); color:#fff; padding:7px 12px; }
  .wrap > .top:first-child .kwnav-home:hover, body > .top .kwnav-home:hover, header .kwnav-home:hover,
  .wrap > .kwnav:first-child .kwnav-home:hover, .topbar .kwnav-home:hover,
  .wrap > .top:first-child .kwnav-toggle:hover, body > .top .kwnav-toggle:hover, header .kwnav-toggle:hover,
  .wrap > .kwnav:first-child .kwnav-toggle:hover, .topbar .kwnav-toggle:hover{ background:rgba(255,255,255,0.24); }

  /* ── 카드·면 ── */
  .card, .msg, .note, .box, .cfg, .intro, .summary, .state-box, .grid-card, .batch, .detail{
    border-color:var(--border,var(--line)) !important; box-shadow:0 1px 3px rgba(70,20,35,.04) !important; }

  /* ── 숫자는 세리프 — 처리할 개수가 먼저 보이게 ── */
  .count, .cnt, .big, .num, .avg, .score-big, .stat .v, .summary .v, .pill, .badge, .cbadge,
  .b-cnt, .nft-count, .bar-val, .cmin, .sm{ font-family:var(--serif); }

  /* ── 입력 — 터치 타깃 · 포커스 와인 링 ── */
  input, select, textarea, button{ font-family:inherit; }
  input[type=text], input[type=password], input[type=number], input[type=date], input[type=month],
  input[type=tel], input[type=search], select, textarea, .search, .login-input{
    border:1.5px solid var(--border,var(--line)); border-radius:10px; outline:none;
    transition:border-color .12s, box-shadow .12s; }
  input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, input[type=date]:focus,
  input[type=month]:focus, input[type=tel]:focus, input[type=search]:focus, select:focus, textarea:focus,
  .search:focus, .login-input:focus{ border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }

  /* ── 버튼 — 아이콘+라벨 한 줄, 눌린 상태 확실히 ── */
  .mini, .ghost, .btn-primary, .b-pri, .b-sec, .save, .aisave, .bp-save, .bp-all, .listbtn,
  .pushbtn, .b-reopen, .b-done, .b-del, .b-ghost, .restore, .del, .up, .hide, .act, .dl, .jump{
    display:inline-flex !important; align-items:center; justify-content:center; gap:6px;
    flex-wrap:nowrap !important; white-space:nowrap; border-radius:9px; font-family:inherit; }
  .tab-btn, .tabs button, .mtab, .seg button, .chip, .nft-btn, .bp-mode, .modeTabs button{
    border-radius:9px; font-family:inherit; white-space:nowrap; }
  .tab-btn.active, .tabs .on, .mtab.on, .seg .on, .chip.on, .nft-btn.on, .bp-mode.on{
    box-shadow:0 1px 4px rgba(134,38,51,.22); }

  /* ── 텍스트 라벨은 flex로 만들지 않는다 (문장이 조각나 gap이 끼어든다) ── */
  .sechead, .paynote, .section-label, .panel-title, .menu-sec-t, .cardHead, .stHead, .section-title{
    display:block !important; }
  .badge, .pill, .cbadge, .tag{ display:inline-flex !important; align-items:center; gap:5px; white-space:nowrap; }

  /* ── 표 ── */
  table{ border-collapse:collapse; }
  th{ font-weight:700; color:var(--text-light,var(--muted)); font-size:0.78rem; }
  td, th{ border-color:var(--hairline,var(--border)) !important; }
  td.num, td.n, .num{ text-align:right; font-family:var(--serif); }

  /* ── 반응형 (반드시 마지막) — 위 블록과 동일 특이도라 소스 순서로 이겨야 한다 ── */
  @media (max-width:640px){
    .wrap > .top:first-child, body > .top{ flex-wrap:wrap; gap:8px 10px; align-items:flex-start; }
    .wrap > .top:first-child > div:first-child, body > .top > div:first-child{ flex:1 1 100%; }
    .wrap > .top:first-child .kwnav, body > .top .kwnav{ margin-left:0; }
    .wrap > .top:first-child .sub, body > .top .sub{ white-space:normal; overflow:visible; text-overflow:clip; }
    header .headInner{ flex-wrap:wrap; }
  }

  /* 빈 배지·개수 칩은 다시 숨긴다 — 위 !important 규칙에 눌려 있던 원본 동작 복원 */
  .badge:empty, .pill:empty, .cbadge:empty, .tag:empty, .bdg:empty, .b-cnt:empty, .cnt:empty, .count:empty{
    display:none !important; }
</style>

        <a role="menuitem" href="/staff-reports" data-p="/staff-reports"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><rect x="4.5" y="3" width="15" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>리포트</a>
        <a role="menuitem" href="/staff-materials" data-p="/staff-materials"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path><path d="M4 18a2.5 2.5 0 0 1 2.5-2.5H20"></path></svg>수업자료</a>
        <a role="menuitem" href="/admin-surveys" data-p="/admin-surveys"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M4 20l1.2-4.2L16.4 4.6a2 2 0 0 1 2.8 2.8L8 18.6 4 20z"></path><path d="M14.5 6.5l2.8 2.8"></path></svg>테스트</a>
        <a role="menuitem" href="/staff-worklog" data-p="/staff-worklog"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>근무기록</a>
        <a role="menuitem" href="#" class="kwnav-logout" id="kwnavLogout">🚪 로그아웃</a>
      </div>
    </div>
  </div>
  <h1><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;"><path d="M14 5 6 9H4a1.5 1.5 0 0 0-1.5 1.5v3A1.5 1.5 0 0 0 4 15h2l8 4z"></path><path d="M17.5 9a4 4 0 0 1 0 6"></path></svg>알림 보내기</h1>
  <div class="sub">학원·반·학생을 골라 자유 알림을 보냅니다. 결석·숙제 알림과 달리 받는 사람(학부모·학생)을 매번 고를 수 있어요.</div>

  <div id="login" class="login" style="display:none;">
    <div style="font-weight:700;">관리자 비밀번호</div>
    <input type="password" id="pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="loginErr" style="color:#c0392b;font-size:0.8rem;margin-bottom:8px;"></div>
    <button onclick="doLogin()">확인</button>
  </div>

  <div id="loading" class="msg">불러오는 중…</div>

  <div id="form" style="display:none;">
    <div class="field">
      <label>학원</label>
      <select id="acSel" onchange="onAcademyChange()"></select>
    </div>
    <div class="field">
      <label>반</label>
      <select id="clSel" onchange="renderStudents()"></select>
    </div>
    <div class="field">
      <div class="stHead">
        <label style="margin:0;">학생 <span id="stCount" class="cnt"></span></label>
        <button type="button" class="mini" id="allBtn" onclick="toggleAll()">전체 선택</button>
      </div>
      <div id="students" class="studentGrid"></div>
    </div>
    <div class="field">
      <label>제목 <span class="opt">(선택 · 비우면 “📢 알림”)</span></label>
      <input type="text" id="title" maxlength="60" placeholder="📢 알림">
    </div>
    <div class="field">
      <label>내용</label>
      <textarea id="bodyText" rows="4" maxlength="1000" placeholder="보낼 알림 내용을 입력하세요."></textarea>
    </div>
    <div class="field">
      <label>받는 사람</label>
      <div class="aud">
        <label class="radio"><input type="radio" name="aud" value="parent" checked> 학부모</label>
        <label class="radio"><input type="radio" name="aud" value="student"> 학생</label>
        <label class="radio"><input type="radio" name="aud" value="all"> 학부모 + 학생</label>
      </div>
    </div>
    <div class="sendBar">
      <button id="sendBtn" onclick="doSend()">보내기</button>
    </div>
    <div id="result" class="result" style="display:none;"></div>

    <div class="field" id="sentBox" style="margin-top:22px;">
      <div class="stHead">
        <label style="margin:0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:0 0 auto;"><path d="M3.5 13.5V18a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-4.5"></path><path d="M3.5 13.5 6 5.5h12l2.5 8"></path><path d="M8.5 13.5h7l-1 2.5h-5z"></path></svg>보낸 알림 관리 <span id="ntCount" class="cnt"></span></label>
        <span style="display:flex;gap:6px;">
          <button type="button" class="mini" onclick="loadSent()">새로고침</button>
          <button type="button" class="mini danger" id="recallBtn" onclick="recallSelected()">선택 회수</button>
        </span>
      </div>
      <div style="color:var(--muted);font-size:0.78rem;line-height:1.5;margin-bottom:8px;">
        잘못 보낸 알림을 체크해 회수하면 학부모·학생 <b>알림함에서 삭제</b>됩니다.
        (결석·숙제·클리닉 자동 알림 포함 · 이미 폰에 도착한 푸시 배너까지는 되돌릴 수 없어요)
      </div>
      <div id="sentList" class="sentList"><div class="empty">불러오는 중…</div></div>
    </div>
  </div>
</div>

<script>
  var token = sessionStorage.getItem('kwmath_admin_pw') || localStorage.getItem('kwmath_admin_pw') || localStorage.getItem('kwmath_admin_token') || null;
  var roster = [];   // 승인된 재원생만

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function show(id, on){ $(id).style.display = on ? '' : 'none'; }
  function uniq(arr){ return Array.from(new Set(arr)); }

  function showLogin(err){
    show('loading', false); show('form', false); show('login', true);
    $('loginErr').textContent = err || '';
    var p = $('pw'); if (p) p.focus();
  }
  function doLogin(){
    token = ($('pw').value || '').trim();
    if (!token) return;
    sessionStorage.setItem('kwmath_admin_pw', token);
    load();
  }

  async function load(){
    show('login', false); show('form', false); show('loading', true);
    $('loading').textContent = '불러오는 중…';
    var headers = {}; if (token) headers['Authorization'] = 'Bearer ' + token;
    var r;
    try { r = await fetch('/api/students', { headers: headers, credentials: 'same-origin' }); }
    catch (e) { $('loading').textContent = '네트워크 오류. 새로고침 해주세요.'; return; }
    if (r.status === 401) {
      sessionStorage.removeItem('kwmath_admin_pw');
      var had = token; token = null;
      showLogin(had ? '비밀번호가 틀렸습니다' : '');
      return;
    }
    var d = await r.json().catch(function(){ return null; });
    if (!Array.isArray(d)) { $('loading').textContent = '학생 목록을 불러오지 못했습니다.'; return; }
    // 승인 학생만(대기중/거부 제외; 빈 값=옛 학생 통과). 퇴원생은 이미 목록에 없음.
    roster = d.filter(function(s){ var st = (s.approvalStatus || ''); return st === '' || st === '승인'; });
    show('loading', false); show('form', true);
    buildAcademies(); onAcademyChange();
    applyPreset();   // ?acad=&cls=&sid= 로 넘어왔으면 대상을 미리 골라 둔다
    loadSent();   // 보낸 알림함도 같이 로드
  }

  function academyLabel(a){ return a || '(학원 미지정)'; }

  // ── 대상 프리셋 (?acad=&cls=&sid=) ─────────────────────────────
  //   학생 목록의 학생 카드·반 헤더 인라인 버튼에서 넘어올 때 대상을 미리 선택해 둔다.
  //   식별은 반드시 student_id(sid). 이름은 URL에 싣지 않는다 —
  //     ① 동명이인 오발송 방지(이름은 유일하지 않음)  ② 주소창·히스토리에 실명 안 남김.
  //   sid가 roster에 없으면(퇴원·반이동) 조용히 넘어가지 않고 경고를 띄우고 멈춘다.
  function presetHasOption(sel, v){
    if (!sel) return false;
    for (var i = 0; i < sel.options.length; i++) if (sel.options[i].value === v) return true;
    return false;
  }
  function presetBanner(html, warn){
    var host = $('form'); if (!host) return;
    var el = document.getElementById('presetBanner');
    if (!el){ el = document.createElement('div'); el.id = 'presetBanner'; host.insertBefore(el, host.firstChild); }
    el.style.cssText = 'margin:0 0 14px;padding:10px 12px;border-radius:10px;font-size:0.86rem;font-weight:700;line-height:1.5;'
      + (warn ? 'background:#FBE5E9;color:#B02347;border:1px solid #F2A8B5;'
              : 'background:#E8F1FB;color:#1B4F86;border:1px solid #A9C9EB;');
    el.innerHTML = html;
  }
  function applyPreset(){
    var q; try { q = new URLSearchParams(location.search); } catch(_) { return; }
    var acad = q.get('acad'), cls = q.get('cls'), sid = q.get('sid');
    if (!acad && !cls && !sid) return;
    var stu = null;
    if (sid){
      stu = roster.filter(function(s){ return String(s.id) === String(sid); })[0];
      if (!stu){
        presetBanner('⚠️ 지정된 학생을 찾지 못했습니다. 퇴원했거나 반이 바뀌었을 수 있어요 — 대상을 직접 골라주세요.', true);
        return;
      }
      acad = stu.academy || '';       // 대상은 학생 데이터가 정본 (URL의 acad/cls보다 우선)
      cls  = stu.className || '';
    }
    if (acad != null && presetHasOption($('acSel'), acad)){ $('acSel').value = acad; onAcademyChange(); }
    if (cls  != null && presetHasOption($('clSel'), cls)){  $('clSel').value  = cls;  renderStudents(); }
    if (stu){
      var boxes = document.querySelectorAll('.stChk'), hit = false;
      for (var i = 0; i < boxes.length; i++){
        if (boxes[i].value === String(stu.id)){ boxes[i].checked = true; hit = true; break; }
      }
      updateCount();
      if (hit) presetBanner('🔔 <b>' + esc(stu.name || '') + '</b> 학생에게 보냅니다. <span style="font-weight:500;">(아래에서 대상을 더하거나 뺄 수 있어요)</span>');
      else     presetBanner('⚠️ ' + esc(stu.name || '') + ' 학생이 목록에 없습니다 — 대상을 직접 골라주세요.', true);
    } else {
      presetBanner('🔔 <b>' + esc(acad || '') + (cls ? ' · ' + esc(cls) : '') + '</b> 반에 보냅니다. <span style="font-weight:500;">(학생을 골라 일부에게만 보낼 수도 있어요)</span>');
    }
  }

  function buildAcademies(){
    var acs = uniq(roster.map(function(s){ return s.academy || ''; })).sort();
    var html = '<option value="__ALL__">전체 학원</option>';
    acs.forEach(function(a){ html += '<option value="' + esc(a) + '">' + esc(academyLabel(a)) + '</option>'; });
    $('acSel').innerHTML = html;
  }
  function onAcademyChange(){
    var ac = $('acSel').value;
    var pool = (ac === '__ALL__') ? roster : roster.filter(function(s){ return (s.academy || '') === ac; });
    var cls = uniq(pool.map(function(s){ return s.className || ''; })).sort();
    var html = '<option value="__ALL__">전체 반</option>';
    cls.forEach(function(c){ html += '<option value="' + esc(c) + '">' + esc(c || '(반 미지정)') + '</option>'; });
    $('clSel').innerHTML = html;
    renderStudents();
  }
  function visibleStudents(){
    var ac = $('acSel').value, cl = $('clSel').value;
    return roster.filter(function(s){
      if (ac !== '__ALL__' && (s.academy || '') !== ac) return false;
      if (cl !== '__ALL__' && (s.className || '') !== cl) return false;
      return true;
    }).sort(function(a, b){ return (a.name || '').localeCompare(b.name || '', 'ko'); });
  }
  function renderStudents(){
    var list = visibleStudents();
    if (!list.length){ $('students').innerHTML = '<div class="empty">해당 조건의 학생이 없습니다.</div>'; updateCount(); return; }
    var html = '';
    list.forEach(function(s){
      var sid = esc(String(s.id == null ? '' : s.id));   // 체크박스 값=학생 id(동명이인 안전). 표시는 이름.
      var nm = esc(s.name || '');
      var meta = esc((s.className || '') + (s.grade ? (' · ' + s.grade) : ''));
      html += '<label class="stItem"><input type="checkbox" class="stChk" value="' + sid + '" onchange="updateCount()"><span class="nm">' + nm + '</span><span class="mt">' + meta + '</span></label>';
    });
    $('students').innerHTML = html;
    updateCount();
  }
  function checkedIds(){
    return Array.prototype.slice.call(document.querySelectorAll('.stChk:checked')).map(function(c){ return c.value; });
  }
  function updateCount(){
    var n = checkedIds().length, total = document.querySelectorAll('.stChk').length;
    $('stCount').textContent = '(' + n + '/' + total + '명 선택)';
    var allBtn = $('allBtn'); if (allBtn) allBtn.textContent = (n > 0 && n === total) ? '전체 해제' : '전체 선택';
  }
  function toggleAll(){
    var chks = document.querySelectorAll('.stChk');
    var n = checkedIds().length, total = chks.length;
    var on = !(n > 0 && n === total);
    Array.prototype.forEach.call(chks, function(c){ c.checked = on; });
    updateCount();
  }
  function audValue(){
    var r = document.querySelector('input[name="aud"]:checked'); return r ? r.value : 'all';
  }
  function audLabel(v){ return v === 'parent' ? '학부모' : v === 'student' ? '학생' : '학부모+학생'; }

  function showResult(ok, msg){
    var el = $('result'); el.style.display = ''; el.className = 'result ' + (ok ? 'ok' : 'err'); el.textContent = msg;
  }

  async function doSend(){
    var ids = checkedIds();
    var bodyText = ($('bodyText').value || '').trim();
    var title = ($('title').value || '').trim();
    var aud = audValue();
    if (!ids.length){ alert('받을 학생을 선택해주세요.'); return; }
    if (!bodyText){ alert('알림 내용을 입력해주세요.'); $('bodyText').focus(); return; }
    if (!confirm('학생 ' + ids.length + '명의 [' + audLabel(aud) + ']에게 알림을 보냅니다.\n\n보낼까요?')) return;

    var btn = $('sendBtn'); btn.disabled = true; var old = btn.textContent; btn.textContent = '보내는 중…';
    var headers = { 'Content-Type': 'application/json' }; if (token) headers['Authorization'] = 'Bearer ' + token;
    var r, d;
    try {
      r = await fetch('/api/notifications', { method: 'POST', headers: headers, credentials: 'same-origin',
        body: JSON.stringify({ action: 'create_bulk', ids: ids, title: title, body: bodyText, audience: aud }) });
      d = await r.json().catch(function(){ return null; });
    } catch (e) { btn.disabled = false; btn.textContent = old; showResult(false, '네트워크 오류로 보내지 못했습니다.'); return; }
    btn.disabled = false; btn.textContent = old;
    if (r.status === 401){ sessionStorage.removeItem('kwmath_admin_pw'); token = null; showLogin('다시 로그인해주세요'); return; }
    if (!d || !d.ok){ showResult(false, (d && d.error) || '발송에 실패했습니다.'); return; }
    var msg = (d.sent || 0) + '명에게 보냈습니다.';
    if (d.misses && d.misses.length) {   // 서버는 못 찾은 id를 반환 → 화면엔 이름으로 표시
      var missNames = d.misses.map(function(id){
        var f = roster.find(function(s){ return String(s.id) === String(id); });
        return f ? (f.name || String(id)) : String(id);
      });
      msg += ' (못 보냄: ' + missNames.join(', ') + ')';
    }
    showResult(true, msg);
    $('bodyText').value = ''; $('title').value = '';   // 대상 선택은 유지, 내용만 비움
    loadSent();   // 방금 보낸 알림이 보낸 알림함에 뜨도록
  }

  // ══════════ 보낸 알림 관리(회수) — 2026-07-16 ══════════
  var sent = [];   // 최근 보낸 알림(전체 학생, 자동알림 포함)

  function fmtKST(iso){
    var t = Date.parse(iso || ''); if (!t) return '';
    var d = new Date(t + 9 * 3600 * 1000);   // KST 표시
    function p(n){ return (n < 10 ? '0' : '') + n; }
    return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + ' ' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes());
  }
  function ntAudLabel(v){ return v === 'parent' ? '학부모' : v === 'student' ? '학생' : '학부모+학생'; }

  async function loadSent(){
    var headers = {}; if (token) headers['Authorization'] = 'Bearer ' + token;
    var r, d;
    try {
      r = await fetch('/api/notifications?recent=1&limit=100', { headers: headers, credentials: 'same-origin' });
      d = await r.json().catch(function(){ return null; });
    } catch (e) { $('sentList').innerHTML = '<div class="empty">네트워크 오류로 불러오지 못했습니다.</div>'; return; }
    if (r.status === 403) { show('sentBox', false); return; }   // 원장 전용 — 조교면 섹션 숨김
    sent = (d && d.notifications) || [];
    renderSent();
  }

  function renderSent(){
    $('ntCount').textContent = sent.length ? '(최근 ' + sent.length + '건)' : '';
    if (!sent.length){ $('sentList').innerHTML = '<div class="empty">보낸 알림이 없습니다.</div>'; return; }
    var html = '';
    sent.forEach(function(n){
      var who = n.studentName || String(n.studentId || '');
      html += '<label class="ntItem"><input type="checkbox" class="ntChk" value="' + esc(n.id) + '">'
        + '<span class="ntMain">'
        + '<span class="ntTop"><b>' + esc(who) + '</b> · ' + esc(ntAudLabel(n.audience)) + ' · ' + esc(fmtKST(n.createdAt))
        + (n.read ? ' · <span class="rd">읽음</span>' : ' · <span class="unrd">안읽음</span>') + '</span>'
        + '<span class="ntTitle">' + esc(n.title) + '</span>'
        + '<span class="ntBody">' + esc(n.body) + '</span>'
        + '</span></label>';
    });
    $('sentList').innerHTML = html;
  }

  async function recallSelected(){
    var ids = Array.prototype.slice.call(document.querySelectorAll('.ntChk:checked')).map(function(c){ return c.value; });
    if (!ids.length){ alert('회수할 알림을 선택해주세요.'); return; }
    if (!confirm('선택한 알림 ' + ids.length + '건을 회수(삭제)합니다.\n알림함에서 사라지지만, 이미 도착한 푸시 배너는 되돌릴 수 없어요.\n\n회수할까요?')) return;
    var btn = $('recallBtn'); btn.disabled = true;
    var headers = { 'Content-Type': 'application/json' }; if (token) headers['Authorization'] = 'Bearer ' + token;
    var r, d;
    try {
      r = await fetch('/api/notifications', { method: 'DELETE', headers: headers, credentials: 'same-origin',
        body: JSON.stringify({ ids: ids }) });
      d = await r.json().catch(function(){ return null; });
    } catch (e) { btn.disabled = false; alert('네트워크 오류로 회수하지 못했습니다.'); return; }
    btn.disabled = false;
    if (!d || !d.ok){ alert((d && d.error) || '회수에 실패했습니다.'); return; }
    alert(d.deleted + '건 회수했습니다.');
    loadSent();
  }

  load();
</script>
<!-- 조교/원장 공통 상단 네비: 홈(역할별) + 메뉴 드롭다운 -->
<script>
(function(){
  try{
    var pw = sessionStorage.getItem('kwmath_admin_pw') || localStorage.getItem('kwmath_admin_pw') || '';
    var home = /^ast_/.test(pw) ? '/staff-home' : '/admin';
    var h = document.getElementById('kwnavHome'); if(h){ h.setAttribute('href', home); }
    var path = (location.pathname || '').replace(/\.html$/,''); if(path.length > 1){ path = path.replace(/\/+$/,''); }
    var pop = document.getElementById('kwnavPop');
    if(pop){
      var links = pop.querySelectorAll('a[data-p]');
      for(var i=0;i<links.length;i++){
        if(links[i].getAttribute('data-p') === path){ links[i].className = 'cur'; links[i].removeAttribute('href'); }
      }
    }
    var tog = document.getElementById('kwnavToggle');
    if(tog && pop){
      tog.addEventListener('click', function(e){
        e.stopPropagation();
        var open = pop.classList.toggle('show');
        tog.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', function(ev){
        if(!pop.contains(ev.target) && ev.target !== tog){ pop.classList.remove('show'); tog.setAttribute('aria-expanded','false'); }
      });
    }
    var lo = document.getElementById('kwnavLogout');
    if(lo){
      lo.addEventListener('click', function(e){
        e.preventDefault();
        try{ sessionStorage.removeItem('kwmath_admin_pw'); localStorage.removeItem('kwmath_admin_pw'); localStorage.removeItem('kwmath_admin_token'); }catch(_){}
        location.href = '/portal';
      });
    }
  }catch(_){}
})();
</script>
